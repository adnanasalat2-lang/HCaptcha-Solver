<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>hCaptcha Master Pro — Persistent Cloud AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0c0c0c; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: #161616; padding: 8px 14px; border-bottom: 2px solid #00ff88; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-shrink: 0; border-radius: 4px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header h1 { margin: 0; font-size: 16px; color: #00ff88; }
        .tabs { display: flex; gap: 5px; }
        .tab-btn { background: #222; color: #aaa; border: 1px solid #333; padding: 5px 12px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .tab-btn.active { background: #00ff88; color: #000; border-color: #00ff88; }
        .count-badge { background: #000; color: #fff; padding: 1px 5px; border-radius: 6px; font-size: 11px; margin-left: 3px; }

        .ai-bar { display: flex; align-items: center; gap: 8px; }
        .sync-status { font-size: 12px; color: #ffaa00; font-weight: bold; }
        .sync-status.active { color: #00ff88; }
        .btn-toggle { padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #444; background: #222; color: #888; }
        .btn-toggle.on { background: #00ff88; color: #000; border-color: #00ff88; }
        .btn-clear-ai { background: #2a1111; color: #ff6666; border: 1px solid #552222; padding: 5px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .search-box input { padding: 5px 8px; background: #1a1a1a; border: 1px solid #333; color: #00ff88; border-radius: 4px; font-size: 12px; outline: none; width: 120px; }

        .workspace-split { display: flex; gap: 10px; flex: 1; min-height: 0; margin-top: 8px; }
        
        .column { flex: 1; display: flex; flex-direction: column; background: #121212; border: 1px solid #222; border-radius: 6px; overflow: hidden; }
        .column-header { padding: 6px 10px; background: #181818; border-bottom: 1px solid #2c2c2c; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .col-title-ai { color: #00ff88; font-size: 13px; }
        .col-title-manual { color: #ff9900; font-size: 13px; }
        .stream-count { background: #000; padding: 1px 6px; border-radius: 6px; font-size: 11px; color: #fff; }
        
        .task-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
        
        .task-card { background: #181818; border: 1px solid #2c2c2c; border-radius: 5px; padding: 8px; will-change: transform; }
        .task-card.ai-processing { border-color: #ff00ff; box-shadow: 0 0 6px rgba(255,0,255,0.25); }
        .task-card.in-retrain { border: 2px solid #ff8800 !important; background: #1f1408 !important; }
        .task-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .task-id { color: #ff5555; font-family: monospace; font-size: 12px; font-weight: bold; }
        
        .prompt-container { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; background: #1f1f1f; padding: 4px; border-radius: 4px; border: 1px solid #2a2a2a; }
        .example-wrap { flex-shrink: 0; width: 38px; height: 38px; }
        .example-img { width: 38px; height: 38px; object-fit: cover; border-radius: 3px; border: 1px solid #444; }
        .example-img-placeholder { width: 38px; height: 38px; border-radius: 3px; background: #252525; border: 1px dashed #444; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .task-prompt { color: #fff; font-size: 12px; font-weight: bold; line-height: 1.2; }

        .img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
        .img-grid img { width: 100%; height: 95px; object-fit: cover; cursor: pointer; border: 2px solid transparent; background: #222; border-radius: 3px; }
        .img-grid img.selected { border-color: #00ff88; opacity: 0.85; }
        .img-grid img.ai-pick { border-color: #ff00ff; opacity: 0.9; }
        .img-grid img.retrain-pick { border-color: #ff8800 !important; opacity: 0.95; }
        
        .single-box { position: relative; width: 100%; cursor: crosshair; display: flex; justify-content: center; align-items: center; background: #000; border-radius: 4px; border: 1px solid #333; overflow: hidden; }
        .single-box img { width: 100%; height: auto; min-height: 350px; max-height: 440px; object-fit: contain; display: block; user-select: none; }
        .dot { position: absolute; width: 14px; height: 14px; background: #00ff88; border: 2px solid #000; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        .dot.retrain-dot { background: #ff8800; }

        .actions { display: flex; gap: 5px; margin-top: 6px; }
        .btn { flex: 1; padding: 7px; border: none; font-weight: bold; cursor: pointer; color: #fff; font-size: 11px; border-radius: 3px; }
        .btn-save { background: #00ff88; color: #000; }
        .btn-reset { background: #333; }
        .btn-del { background: #ee4444; flex: 0.25; }
        .btn-retrain { background: #ff8800; color: #000; }
        .btn-confirm { background: #00ff88; color: #000; }
        .btn-cancel { background: #444; }
        .btn-warn { background: #ee2222 !important; color: #fff !important; }

        #trainedView { display: none; flex: 1; flex-direction: column; background: #121212; border: 1px solid #222; border-radius: 6px; overflow: hidden; margin-top: 8px; }
        .trained-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
        .retrain-banner { font-size: 11px; color: #ff8800; margin-bottom: 5px; padding: 4px; background: #291705; border-radius: 3px; border: 1px dashed #ff8800; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>hCaptcha Master Pro</h1>
        <div class="tabs">
            <button class="tab-btn active" id="btn-pending" onclick="setTab('pending')">Pending <span class="count-badge" id="c-pending">0</span></button>
            <button class="tab-btn" id="btn-trained" onclick="setTab('trained')">Trained <span class="count-badge" id="c-trained">0</span></button>
        </div>
    </div>
    <div class="ai-bar">
        <span class="sync-status" id="syncStatus">🧠 Initializing AI...</span>
        <button id="btnAutoTrain" class="btn-toggle on" onclick="toggleAutoTrain()">🧠 Auto Train: ON</button>
        <button id="btnAutoSave" class="btn-toggle on" onclick="toggleAutoSave()">💾 Auto Save: ON</button>
        <button class="btn-clear-ai" onclick="resetAIBrain()">🧹 Reset</button>
        <div class="search-box">
            <input type="text" id="searchInput" oninput="filterTasks()" placeholder="🔍 Task ID..."/>
        </div>
    </div>
</div>

<div class="workspace-split" id="pendingView">
    <div class="column">
        <div class="column-header">
            <span class="col-title-ai">🤖 AI Fast-Train Stream (Grids)</span>
            <span class="stream-count" id="c-grid">0 Tasks</span>
        </div>
        <div class="task-list" id="gridArea"></div>
    </div>
    <div class="column">
        <div class="column-header">
            <span class="col-title-manual">👷 Manual Worker Stream (Videos / Coordinates)</span>
            <span class="stream-count" id="c-manual">0 Tasks</span>
        </div>
        <div class="task-list" id="manualArea"></div>
    </div>
</div>

<div id="trainedView">
    <div class="column-header">
        <span style="color:#00ff88;font-size:13px;">🗂️ Trained Database Archive</span>
        <span class="stream-count" id="c-trained-total">0 Solved</span>
    </div>
    <div class="trained-container" id="trainedArea"></div>
</div>

<script>
const SERVER_URL = location.origin;
const gridArea = document.getElementById('gridArea');
const manualArea = document.getElementById('manualArea');
const trainedArea = document.getElementById('trainedArea');
const syncStatus = document.getElementById('syncStatus');

let currentTab = 'pending';
let serverData = { pending: {}, trained: {} }, activeTasksStore = {};
let videoTasksMap = new Map();
let ghostBlocker = new Set();
let retrainEditingTasks = new Set();
let isFetching = false;
let trainedPage = 0;

let isAIReady = false, aiModel = null, knn = null;
let autoTrainEnabled = true, autoSaveEnabled = true;

let aiTaskQueue = [];
let isProcessingAIQueue = false;

// ── PERSISTENT SERVER-SIDE AI BRAIN ENGINE ──
async function initAI() {
    try {
        try {
            await tf.setBackend('webgl');
            tf.env().set('WEBGL_FORCE_F16_TEXTURES', true);
        } catch(e) {
            await tf.setBackend('cpu');
        }
        await tf.ready();

        aiModel = await mobilenet.load({ version: 2, alpha: 1.0 });
        knn = knnClassifier.create();
        
        // 1. Download Persistent AI Brain from Server DB
        await loadBrainFromServer();
        
        isAIReady = true;
        updateAIStatus();
        triggerAIQueue();
    } catch(e) {
        syncStatus.innerHTML = "⚠️ AI Fallback Mode";
        try {
            await tf.setBackend('cpu');
            await tf.ready();
            aiModel = await mobilenet.load({ version: 2, alpha: 0.5 });
            knn = knnClassifier.create();
            await loadBrainFromServer();
            isAIReady = true;
            updateAIStatus();
        } catch(err) {}
    }
}

function updateAIStatus() {
    if (!knn) return;
    try {
        let ds = knn.getClassExampleCount();
        let concepts = Object.keys(ds).filter(k => !k.startsWith('negative_')).length;
        syncStatus.innerHTML = `🤖 AI Brain Ready ✅ (${concepts} Concepts Synced)`;
        syncStatus.classList.add('active');
    } catch(e) {}
}

// Save brain directly to Railway Server
async function saveBrainToServer() {
    if (!knn) return;
    try {
        let ds = knn.getClassifierDataset();
        let ser = {};
        for (let k in ds) {
            ser[k] = { data: Array.from(ds[k].dataSync()), shape: ds[k].shape };
        }
        await fetch(`${SERVER_URL}/api/ai-brain`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ser)
        });
        updateAIStatus();
    } catch(e) {}
}

// Load brain on startup from Railway Server
async function loadBrainFromServer() {
    try {
        const res = await fetch(`${SERVER_URL}/api/ai-brain?t=${Date.now()}`);
        if (!res.ok) return;
        const ser = await res.json();
        if (!ser || Object.keys(ser).length === 0) return;
        
        let ds = {};
        for (let k in ser) {
            if (ser[k] && ser[k].data && ser[k].shape) {
                ds[k] = tf.tensor(ser[k].data, ser[k].shape);
            }
        }
        knn.setClassifierDataset(ds);
    } catch(e) {}
}

async function resetAIBrain() {
    if (confirm("Kya aap Server se AI Brain ki saari training reset karna chahte hain?")) {
        await fetch(`${SERVER_URL}/api/ai-brain`, { method: 'DELETE' });
        if (knn) knn.clearAllClasses();
        location.reload();
    }
}

function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + tab).classList.add('active');
    
    if (tab === 'pending') {
        document.getElementById('pendingView').style.display = 'flex';
        document.getElementById('trainedView').style.display = 'none';
    } else {
        document.getElementById('pendingView').style.display = 'none';
        document.getElementById('trainedView').style.display = 'flex';
        trainedArea.innerHTML = '';
        fetchTrainedTab();
    }
}

function toggleAutoTrain() {
    autoTrainEnabled = !autoTrainEnabled;
    let btn = document.getElementById('btnAutoTrain');
    btn.className = 'btn-toggle' + (autoTrainEnabled ? ' on' : '');
    btn.textContent = '🧠 Auto Train: ' + (autoTrainEnabled ? 'ON' : 'OFF');
    if (autoTrainEnabled && isAIReady) triggerAIQueue();
}

function toggleAutoSave() {
    autoSaveEnabled = !autoSaveEnabled;
    let btn = document.getElementById('btnAutoSave');
    btn.className = 'btn-toggle' + (autoSaveEnabled ? ' on' : '');
    btn.textContent = '💾 Auto Save: ' + (autoSaveEnabled ? 'ON' : 'OFF');
}

function loadSafeImage(src) {
    return new Promise(resolve => {
        if (!src) return resolve(null);
        let img = new Image();
        if (!src.startsWith('data:')) img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
        setTimeout(() => resolve(img.complete && img.naturalWidth > 0 ? img : null), 800);
    });
}

function queueTaskForAI(taskId) {
    if (!aiTaskQueue.includes(taskId)) {
        aiTaskQueue.push(taskId);
    }
    triggerAIQueue();
}

async function triggerAIQueue() {
    if (isProcessingAIQueue || !isAIReady || !autoTrainEnabled || aiTaskQueue.length === 0) return;
    isProcessingAIQueue = true;

    while (aiTaskQueue.length > 0) {
        let tid = aiTaskQueue.shift();
        let t = activeTasksStore[tid];
        if (t && t.type === 'grid' && (!t.clicks || t.clicks.length === 0)) {
            await predictWithAI(t);
            await new Promise(r => setTimeout(r, 25));
        }
    }
    isProcessingAIQueue = false;
}

// ── 3X FAST LEARNER (Saves directly to Server DB) ──
async function trainAIBrainAsync(task) {
    if (!isAIReady || task.type !== 'grid' || !task.media || !task.clicks || task.clicks.length === 0) return;
    let pText = task.prompt.split('|||')[0].trim().toLowerCase();
    let negLabel = 'negative_' + pText;

    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = await loadSafeImage(imgSrc);
            if (!img || !img.complete || img.naturalWidth === 0) continue;
            
            tf.tidy(() => {
                let tfImg = tf.browser.fromPixels(img);
                let features = aiModel.infer(tfImg, true);
                if (task.clicks.includes(m.index)) {
                    knn.addExample(features, pText);
                    knn.addExample(features, pText);
                    knn.addExample(features, pText);
                } else {
                    knn.addExample(features, negLabel);
                }
            });
            await tf.nextFrame();
        } catch(e) {}
    }
    await saveBrainToServer();
    triggerAIQueue();
}

async function predictWithAI(task) {
    if (!isAIReady || !autoTrainEnabled || task.type !== 'grid' || !task.media) return;
    let pText = task.prompt.split('|||')[0].trim().toLowerCase();
    let dataset = knn.getClassExampleCount();
    if (!dataset[pText] || dataset[pText] < 1) return;

    let predictedClicks = [];
    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = await loadSafeImage(imgSrc);
            if (!img || !img.complete || img.naturalWidth === 0) continue;
            
            let res = null;
            tf.tidy(() => {
                let tfImg = tf.browser.fromPixels(img);
                let features = aiModel.infer(tfImg, true);
                res = knn.predictClass(features);
            });
            let resolvedRes = await res;
            let conf = resolvedRes.confidences[pText] || 0;
            let negConf = resolvedRes.confidences['negative_' + pText] || 0;
            
            if (resolvedRes.label === pText && conf >= 0.80 && negConf < 0.30) {
                predictedClicks.push(m.index);
            }
            await tf.nextFrame();
        } catch(e) {}
    }

    if (predictedClicks.length >= 2 && predictedClicks.length <= 5) {
        task.clicks = predictedClicks;
        let card = document.querySelector(`.task-card[data-id="${task.id}"]`);
        if (card) {
            card.classList.add('ai-processing');
            predictedClicks.forEach(idx => {
                let imgEl = card.querySelector(`.g-img[data-index="${idx}"]`);
                if (imgEl) { imgEl.classList.add('ai-pick'); }
            });
            if (autoSaveEnabled) {
                let btn = card.querySelector('.btn-save');
                if (btn) { btn.style.background = '#ff00ff'; btn.textContent = '🤖 Solved'; }
                sendToServer(task.id, btn, card);
            }
        }
    }
}

async function fetchTasks() {
    if (isFetching) return;
    isFetching = true;
    try {
        const res = await fetch(`${SERVER_URL}/api/tasks?tab=pending&page=0&size=40&t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
            const data = await res.json();
            serverData.pending = data.tasks || {};
            renderPendingStreams();
        }
        
        fetch(`${SERVER_URL}/api/counts`).then(r => r.json()).then(counts => {
            document.getElementById('c-pending').innerText = counts.pending;
            document.getElementById('c-trained').innerText = counts.trained;
            document.getElementById('c-trained-total').innerText = `${counts.trained} Solved`;
        }).catch(()=>{});
    } catch(e) {}
    isFetching = false;
}

async function fetchTrainedTab() {
    try {
        const res = await fetch(`${SERVER_URL}/api/tasks?tab=trained&page=${trainedPage}&size=40&t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
            const data = await res.json();
            serverData.trained = data.tasks || {};
            renderTrainedStream();
        }
    } catch(e) {}
}

function renderPendingStreams() {
    let pending = serverData.pending;
    let gridCount = 0, manualCount = 0;

    document.querySelectorAll('#pendingView .task-card').forEach(card => {
        let id = card.dataset.id;
        if (!pending[id] || ghostBlocker.has(id)) {
            card.remove();
            delete activeTasksStore[id];
            videoTasksMap.delete(id);
        }
    });

    let gridFrag = document.createDocumentFragment();
    let manualFrag = document.createDocumentFragment();

    for (let id of Object.keys(pending)) {
        if (ghostBlocker.has(id)) continue;
        let td = pending[id], media = td.media || [], isGrid = media.length > 1;

        if (isGrid) gridCount++; else manualCount++;
        if (activeTasksStore[id]) continue;

        activeTasksStore[id] = { id, clicks: [], type: isGrid ? 'grid' : 'coord', media, prompt: td.prompt || '' };
        let card = buildCard(activeTasksStore[id]);

        if (isGrid) {
            gridFrag.appendChild(card);
            queueTaskForAI(id);
        } else {
            manualFrag.appendChild(card);
        }
    }

    gridArea.appendChild(gridFrag);
    manualArea.appendChild(manualFrag);

    document.getElementById('c-grid').innerText = `${gridCount} Grids`;
    document.getElementById('c-manual').innerText = `${manualCount} Tasks`;
}

function renderTrainedStream() {
    let frag = document.createDocumentFragment();
    let existingIds = new Set();
    
    document.querySelectorAll('#trainedView .task-card').forEach(card => {
        let id = card.dataset.id;
        if (!serverData.trained[id]) card.remove();
        else existingIds.add(id);
    });

    for (let id of Object.keys(serverData.trained)) {
        if (existingIds.has(id) || retrainEditingTasks.has(id)) continue;
        let td = serverData.trained[id];
        activeTasksStore[id] = { id, clicks: [...(td.clicks || [])], type: (td.media?.length > 1 ? 'grid' : 'coord'), media: td.media || [], prompt: td.prompt || '' };
        let card = buildCard(activeTasksStore[id], true);
        frag.appendChild(card);
    }
    trainedArea.appendChild(frag);
}

function buildCard(t, isTrained = false) {
    let card = document.createElement('div');
    card.className = 'task-card';
    card.dataset.id = t.id;
    card.style.minWidth = isTrained ? '300px' : 'auto';

    let parts = t.prompt.split('|||');
    let exHtml = parts[1] ? `<img src="${parts[1]}" class="example-img">` : `<div class="example-img-placeholder">🖼️</div>`;
    let mediaHTML = '';

    if (t.type === 'grid') {
        mediaHTML = '<div class="img-grid">';
        t.media.forEach(m => {
            let isSelected = t.clicks.includes(m.index);
            mediaHTML += `<img src="${m.thumb || m.src || ''}" class="g-img ${isSelected?'selected':''}" data-index="${m.index}" draggable="false" loading="lazy"/>`;
        });
        mediaHTML += '</div>';
    } else {
        let m = t.media[0], isVid = m.type === 'video_frames' && m.frames && m.frames.length > 0;
        let src = isVid ? m.frames[0] : (m.src || '');
        mediaHTML = `<div class="single-box"><img src="${src}" class="s-img ${isVid?'vid-player':''}" data-id="${t.id}" draggable="false"/>`;
        t.clicks.forEach(pt => {
            mediaHTML += `<div class="dot" style="left:${pt.px}%;top:${pt.py}%;"></div>`;
        });
        mediaHTML += '</div>';
        if (isVid && !isTrained) {
            videoTasksMap.set(t.id, { frames: m.frames, current: 0 });
        }
    }

    let actions = !isTrained ? `
        <div class="actions">
            <button class="btn btn-save" data-action="save">Save</button>
            <button class="btn btn-reset" data-action="reset">Clear</button>
            <button class="btn btn-del" data-action="del">❌</button>
        </div>` : `
        <div class="actions" id="act-${t.id}">
            <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
            <button class="btn btn-del" data-action="del-trained">❌</button>
        </div>`;

    card.innerHTML = `
        <div class="task-head">
            <span class="task-id">#${t.id.substring(0,6)}</span>
            ${isTrained ? `<span style="font-size:11px;color:#888" id="count-${t.id}">${t.clicks.length} saved</span>` : ''}
        </div>
        <div class="prompt-container"><div class="example-wrap">${exHtml}</div><div class="task-prompt">${parts[0]}</div></div>
        ${mediaHTML}
        ${actions}`;
    return card;
}

let lastVideoTick = 0;
function runVideoAnimation(time) {
    if (time - lastVideoTick > 150) {
        lastVideoTick = time;
        videoTasksMap.forEach((vData, id) => {
            let el = document.querySelector(`.vid-player[data-id="${id}"]`);
            if (el && vData.frames.length > 0) {
                vData.current = (vData.current + 1) % vData.frames.length;
                el.src = vData.frames[vData.current];
            }
        });
    }
    requestAnimationFrame(runVideoAnimation);
}
requestAnimationFrame(runVideoAnimation);

document.body.addEventListener('click', (e) => {
    let actionBtn = e.target.closest('[data-action]');
    let card = e.target.closest('.task-card');
    if (!card) return;
    let tid = card.dataset.id, t = activeTasksStore[tid];
    if (!t) return;

    let isTrainedCard = card.closest('#trainedView') !== null;
    let isInRetrain = retrainEditingTasks.has(tid);

    if (actionBtn) {
        let act = actionBtn.dataset.action;
        
        if (act === 'retrain') {
            retrainEditingTasks.add(tid);
            card.classList.add('in-retrain');
            let banner = document.createElement('div');
            banner.className = 'retrain-banner'; banner.id = `banner-${tid}`;
            banner.textContent = '🟠 RETRAIN MODE: Click images to modify, then Update';
            card.querySelector('.prompt-container').after(banner);

            let actBox = card.querySelector(`#act-${tid}`);
            actBox.innerHTML = `
                <button class="btn btn-confirm" data-action="confirm-retrain">✅ Update</button>
                <button class="btn btn-reset" data-action="clear-retrain">Clear</button>
                <button class="btn btn-cancel" data-action="cancel-retrain">Cancel</button>`;
            return;
        }

        if (act === 'confirm-retrain') {
            if (!t.clicks || t.clicks.length === 0) {
                actionBtn.classList.add('btn-warn');
                actionBtn.textContent = '⚠️ Select first!';
                setTimeout(() => { actionBtn.classList.remove('btn-warn'); actionBtn.textContent = '✅ Update'; }, 1000);
                return;
            }
            fetch(`${SERVER_URL}/api/submit-hcaptcha`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskId: tid, clicks: t.clicks })
            }).then(() => {
                if (isAIReady && t.type === 'grid') trainAIBrainAsync(t);
                retrainEditingTasks.delete(tid);
                card.classList.remove('in-retrain');
                let b = card.querySelector(`#banner-${tid}`); if (b) b.remove();
                let actBox = card.querySelector(`#act-${tid}`);
                actBox.innerHTML = `
                    <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
                    <button class="btn btn-del" data-action="del-trained">❌</button>`;
                fetchTrainedTab();
            });
            return;
        }

        if (act === 'clear-retrain') {
            t.clicks = [];
            card.querySelectorAll('.g-img').forEach(img => img.classList.remove('selected', 'ai-pick', 'retrain-pick'));
            card.querySelectorAll('.dot').forEach(d => d.remove());
            return;
        }

        if (act === 'cancel-retrain') {
            retrainEditingTasks.delete(tid);
            card.classList.remove('in-retrain');
            let b = card.querySelector(`#banner-${tid}`); if (b) b.remove();
            let actBox = card.querySelector(`#act-${tid}`);
            actBox.innerHTML = `
                <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
                <button class="btn btn-del" data-action="del-trained">❌</button>`;
            fetchTrainedTab();
            return;
        }

        if (act === 'save') {
            if (!t.clicks || t.clicks.length === 0) {
                actionBtn.classList.add('btn-warn');
                actionBtn.textContent = '⚠️ Select first!';
                setTimeout(() => { actionBtn.classList.remove('btn-warn'); actionBtn.textContent = 'Save'; }, 1000);
                return;
            }
            sendToServer(tid, actionBtn, card);
            return;
        }

        if (act === 'reset') {
            t.clicks = [];
            card.querySelectorAll('.g-img').forEach(img => img.classList.remove('selected', 'ai-pick'));
            card.querySelectorAll('.dot').forEach(d => d.remove());
            card.classList.remove('ai-processing');
            return;
        }

        if (act === 'del') {
            ghostBlocker.add(tid); card.remove(); delete activeTasksStore[tid]; videoTasksMap.delete(tid);
            fetch(`${SERVER_URL}/api/delete-hcaptcha/${tid}`, { method: 'DELETE' }).catch(()=>{});
            return;
        }

        if (act === 'del-trained') {
            deleteTrained(tid);
            return;
        }
    }

    if (isTrainedCard && !isInRetrain) return;

    if (e.target.classList.contains('g-img')) {
        let idx = parseInt(e.target.dataset.index);
        if (e.target.classList.contains('selected') || e.target.classList.contains('retrain-pick') || e.target.classList.contains('ai-pick')) {
            e.target.classList.remove('selected', 'ai-pick', 'retrain-pick');
            t.clicks = t.clicks.filter(i => i !== idx);
        } else {
            e.target.classList.add('selected');
            if (isInRetrain) e.target.classList.add('retrain-pick');
            t.clicks.push(idx);
        }
    } else if (e.target.classList.contains('s-img')) {
        let img = e.target;
        let rect = img.getBoundingClientRect();
        let nw = img.naturalWidth || 400, nh = img.naturalHeight || 300;
        let containerRatio = rect.width / rect.height, imageRatio = nw / nh;
        let actualW = rect.width, actualH = rect.height, offsetX = 0, offsetY = 0;

        if (containerRatio > imageRatio) {
            actualW = rect.height * imageRatio; offsetX = (rect.width - actualW) / 2;
        } else {
            actualH = rect.width / imageRatio; offsetY = (rect.height - actualH) / 2;
        }

        let clickX = e.clientX - rect.left - offsetX, clickY = e.clientY - rect.top - offsetY;
        if (clickX < 0 || clickX > actualW || clickY < 0 || clickY > actualH) return;

        let px = Math.max(0, Math.min(100, (clickX / actualW) * 100));
        let py = Math.max(0, Math.min(100, (clickY / actualH) * 100));
        t.clicks.push({ px, py });

        let dot = document.createElement('div');
        dot.className = 'dot' + (isInRetrain ? ' retrain-dot' : '');
        dot.style.left = `${((e.clientX - rect.left) / rect.width) * 100}%`;
        dot.style.top = `${((e.clientY - rect.top) / rect.height) * 100}%`;
        img.parentElement.appendChild(dot);
    }
});

function deleteTrained(taskId) {
    fetch(`${SERVER_URL}/api/delete-hcaptcha/${taskId}`, { method: 'DELETE' }).then(() => fetchTrainedTab());
}

function sendToServer(taskId, btnEl, card) {
    let t = activeTasksStore[taskId];
    if (!t || !t.clicks || t.clicks.length === 0) {
        if (card) card.classList.remove('ai-processing');
        return;
    }

    fetch(`${SERVER_URL}/api/submit-hcaptcha`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ taskId, clicks: t.clicks })
    }).catch(()=>{});

    ghostBlocker.add(taskId);
    if (card) card.remove();
    delete activeTasksStore[taskId];
    videoTasksMap.delete(taskId);

    if (isAIReady && t.type === 'grid' && t.clicks.length > 0) {
        trainAIBrainAsync(t);
    }
}

function filterTasks() {
    let f = document.getElementById('searchInput').value.toLowerCase().replace('#', '');
    document.querySelectorAll('.task-card').forEach(c => {
        c.style.display = c.dataset.id.toLowerCase().includes(f) ? "" : "none";
    });
}

setInterval(fetchTasks, 600);
fetchTasks();
setTimeout(initAI, 100);
</script>
