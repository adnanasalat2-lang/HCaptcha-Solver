<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>hCaptcha Master Pro ⚡</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;padding:8px;gap:8px}
.hdr{background:#1a1a1a;padding:8px 12px;border-bottom:2px solid #00ff88;display:flex;justify-content:space-between;align-items:center;border-radius:4px;flex-shrink:0}
.hdr h1{font-size:15px;color:#00ff88}
.hdr-left{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:4px}
.tb{background:#222;color:#888;border:1px solid #333;padding:5px 10px;font-size:12px;font-weight:bold;cursor:pointer;border-radius:4px}
.tb.on{background:#00ff88;color:#000;border-color:#00ff88}
.cnt{background:#000;color:#fff;padding:1px 5px;border-radius:6px;font-size:11px;margin-left:3px}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:bold;padding:3px 8px;border-radius:4px;background:#1a1a1a;border:1px solid #444}
.pill.ok{border-color:#00ff88;color:#00ff88}
.pill.warn{border-color:#ffaa00;color:#ffaa00}
.tog{padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold;border:1px solid #444;background:#222;color:#888}
.tog.on{background:#00ff88;color:#000;border-color:#00ff88}
.btn-del-brain{background:#2a1111;color:#ff5555;border:1px solid #552222;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer}
.srch input{padding:4px 8px;background:#1a1a1a;border:1px solid #333;color:#00ff88;border-radius:4px;font-size:12px;outline:none;width:120px}
.workspace{display:flex;gap:8px;flex:1;min-height:0}
.col{flex:1;display:flex;flex-direction:column;background:#141414;border:1px solid #222;border-radius:4px;overflow:hidden}
.col-hdr{padding:6px 10px;background:#1a1a1a;border-bottom:1px solid #2c2c2c;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold}
.task-list{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
.card{background:#181818;border:1px solid #2c2c2c;border-radius:4px;padding:8px}
.card.ai-on{border-color:#ff00ff;box-shadow:0 0 6px rgba(255,0,255,0.3)}
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cid{color:#ff5555;font-family:monospace;font-size:12px;font-weight:bold}
.pcon{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:#202020;padding:5px;border-radius:4px}
.ewrap{flex-shrink:0;width:38px;height:38px}
.eimg{width:38px;height:38px;object-fit:cover;border-radius:3px;border:1px solid #444;display:block}
.eph{width:38px;height:38px;border-radius:3px;background:#252525;border:1px dashed #444;display:flex;align-items:center;justify-content:center;font-size:14px}
.prompt{color:#fff;font-size:12px;font-weight:bold;line-height:1.2;flex:1}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.ig img{width:100%;height:95px;object-fit:cover;cursor:pointer;border:2px solid transparent;background:#222;border-radius:3px}
.ig img.sel{border-color:#00ff88;opacity:0.8}
.ig img.aip{border-color:#ff00ff!important;opacity:0.9}
.sbox{position:relative;width:100%;cursor:crosshair;display:flex;justify-content:center;background:#000;border-radius:4px;border:1px solid #333;overflow:hidden;user-select:none}
.sbox img{width:100%;height:auto;min-height:280px;max-height:360px;object-fit:contain;display:block;pointer-events:none}
.dot{position:absolute;width:14px;height:14px;background:#00ff88;border:2px solid #000;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:10}
.dot.end-dot{background:#ff8800}
.acts{display:flex;gap:4px;margin-top:6px}
.btn{flex:1;padding:6px;border:none;font-weight:bold;cursor:pointer;color:#fff;font-size:11px;border-radius:3px}
.bsv{background:#00ff88;color:#000}
.brs{background:#333}
.bdl{background:#ee4444;flex:0.3}
.brt{background:#ff8800;color:#000}
.bcf{background:#00ff88;color:#000}
.bcn{background:#444}
.rhint{font-size:10px;color:#ff8800;margin-bottom:4px;padding:3px;background:#291705;border-radius:3px;font-weight:bold;text-align:center}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>⚡ hCaptcha Master Pro</h1>
    <div class="tabs">
      <button class="tb on" id="bt-pending" onclick="setTab('pending')">Pending <span class="cnt" id="cp">0</span></button>
      <button class="tb" id="bt-trained" onclick="setTab('trained')">Trained <span class="cnt" id="ct">0</span></button>
    </div>
  </div>
  <div class="bar">
    <span class="pill warn" id="wsP">🔌 Connecting...</span>
    <span class="pill warn" id="aiP">🧠 AI Loading...</span>
    <button id="bat" class="tog on" onclick="toggleAT()">🧠 Auto: ON</button>
    <button id="bas" class="tog on" onclick="toggleAS()">💾 Save: ON</button>
    <button class="btn-del-brain" onclick="resetBrain()">🧹 Reset AI</button>
    <div class="srch"><input type="text" id="si" oninput="onSrch()" placeholder="🔍 Search..."/></div>
  </div>
</div>

<div class="workspace" id="pendingView">
  <div class="col">
    <div class="col-hdr"><span style="color:#00ff88">🤖 AI Grid Stream</span><span id="c-grid" class="cnt">0</span></div>
    <div class="task-list" id="gridArea"></div>
  </div>
  <div class="col">
    <div class="col-hdr"><span style="color:#ffaa00">👷 Manual Stream</span><span id="c-manual" class="cnt">0</span></div>
    <div class="task-list" id="manualArea"></div>
  </div>
</div>

<div class="workspace" id="trainedView" style="display:none">
  <div class="col">
    <div class="col-hdr"><span style="color:#00ff88">🗂️ Trained Database</span><span id="c-trained-total" class="cnt">0</span></div>
    <div class="task-list" id="trainedArea" style="flex-direction:row;flex-wrap:wrap;align-content:flex-start"></div>
  </div>
</div>

<script>
const SRV = location.origin;
const WS_URL = SRV.replace(/^http/,'ws');

let currentTab = 'pending';
let activeStore = {}, ghost = new Set(), rts = {};
let atOn = true, asOn = true, sq = '';
let autoSaveTimers = {};

// ── In-Browser WebGL TFJS AI ──
let aiModel = null, knn = null, aiReady = false;

async function initAI() {
    try {
        try { await tf.setBackend('webgl'); } catch(e) { await tf.setBackend('cpu'); }
        await tf.ready();
        aiModel = await mobilenet.load({ version: 2, alpha: 1.0 });
        knn = knnClassifier.create();
        loadLocalBrain();
        aiReady = true;
        updateAIStatus();
        if (atOn) reeval();
    } catch(e) {
        document.getElementById('aiP').textContent = '⚠️ AI Error';
    }
}

function updateAIStatus() {
    if (!knn) return;
    let ds = knn.getClassExampleCount();
    let concepts = Object.keys(ds).filter(k => !k.startsWith('neg_')).length;
    let el = document.getElementById('aiP');
    el.textContent = `🤖 AI Ready ✅ (${concepts} concepts)`;
    el.className = 'pill ok';
}

function cleanLabel(raw) {
    return (raw || '').split('|||')[0].replace(/[\n\r\t]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
}

function loadLocalBrain() {
    try {
        let ser = localStorage.getItem('hcm_brain_v2');
        if (!ser) return;
        let data = JSON.parse(ser);
        let ds = {};
        for (let k in data) ds[k] = tf.tensor(data[k].data, data[k].shape);
        knn.setClassifierDataset(ds);
    } catch(e) {}
}

function saveLocalBrain() {
    if (!knn) return;
    try {
        let ds = knn.getClassifierDataset();
        let ser = {};
        for (let k in ds) ser[k] = { data: Array.from(ds[k].dataSync()), shape: ds[k].shape };
        localStorage.setItem('hcm_brain_v2', JSON.stringify(ser));
        updateAIStatus();
    } catch(e) {}
}

function resetBrain() {
    if (!confirm("AI Brain reset karein?")) return;
    localStorage.removeItem('hcm_brain_v2');
    if (knn) knn.clearAllClasses();
    location.reload();
}

function loadImg(src) {
    return new Promise(res => {
        if (!src) return res(null);
        let img = new Image();
        if (!src.startsWith('data:')) img.crossOrigin = 'anonymous';
        img.onload = () => res(img);
        img.onerror = () => res(null);
        img.src = src;
        setTimeout(() => res(img.complete && img.naturalWidth > 0 ? img : null), 1200);
    });
}

async function trainTask(task, wrongIndices = []) {
    if (!aiReady || task.type !== 'grid') return;
    let pText = cleanLabel(task.prompt);
    let negLabel = 'neg_' + pText;

    for (let m of (task.media || [])) {
        let src = m.thumb || m.src;
        let img = await loadImg(src);
        if (!img) continue;

        try {
            tf.tidy(() => {
                let feat = aiModel.infer(img, true);
                let isCorrect = (task.clicks || []).includes(m.index);
                let isWrong = wrongIndices.includes(m.index);

                if (isCorrect) {
                    for (let i = 0; i < 4; i++) knn.addExample(feat, pText);
                } else if (isWrong) {
                    for (let i = 0; i < 6; i++) knn.addExample(feat, negLabel);
                } else {
                    knn.addExample(feat, negLabel);
                }
            });
            await tf.nextFrame();
        } catch(e) {}
    }
    saveLocalBrain();
}

async function predictTask(task) {
    if (!aiReady || task.type !== 'grid') return [];
    let pText = cleanLabel(task.prompt);
    let dataset = knn.getClassExampleCount();

    if (!dataset[pText]) {
        let keys = Object.keys(dataset).filter(k => !k.startsWith('neg_'));
        let matched = keys.find(k => k === pText || k.includes(pText) || pText.includes(k));
        if (matched) pText = matched;
        else return [];
    }

    let predicted = [];
    for (let m of (task.media || [])) {
        let src = m.thumb || m.src;
        let img = await loadImg(src);
        if (!img) continue;

        try {
            let res = null;
            tf.tidy(() => {
                let feat = aiModel.infer(img, true);
                res = knn.predictClass(feat);
            });
            let r = await res;
            let conf = r.confidences[pText] || 0;
            let negConf = r.confidences['neg_' + pText] || 0;

            if (r.label === pText && conf >= 0.40 && negConf < 0.45) {
                predicted.push(m.index);
            }
            await tf.nextFrame();
        } catch(e) {}
    }
    return predicted;
}

async function reeval() {
    for (let id in activeStore) {
        let t = activeStore[id];
        if (currentTab === 'pending' && t.type === 'grid' && (!t.clicks || !t.clicks.length)) {
            await applyAI(t);
        }
    }
}

async function applyAI(task) {
    let clicks = await predictTask(task);
    if (!clicks.length || clicks.length > 6) return;
    task.clicks = clicks;

    let card = document.querySelector(`.card[data-id="${task.id}"]`);
    if (!card) return;
    card.classList.add('ai-on');
    clicks.forEach(idx => {
        let img = card.querySelector(`.gi[data-index="${idx}"]`);
        if (img) { img.classList.remove('sel'); img.classList.add('aip'); }
    });

    if (asOn) {
        let btn = card.querySelector('.bsv');
        if (btn) { btn.style.background = '#ff00ff'; btn.textContent = '🤖 Auto Saving...'; }
        if (autoSaveTimers[task.id]) clearTimeout(autoSaveTimers[task.id]);
        autoSaveTimers[task.id] = setTimeout(() => {
            saveTo(task.id, card);
        }, 1800);
    }
}

// ── WebSocket Live Push ──
let ws = null;
function wsConn() {
    if (ws && ws.readyState < 2) return;
    try { ws = new WebSocket(WS_URL); } catch(e) { setTimeout(wsConn, 3000); return; }
    ws.onopen = () => {
        document.getElementById('wsP').className = 'pill ok';
        document.getElementById('wsP').textContent = '🟢 Live';
        ws.send(JSON.stringify({ action: 'dashboard' }));
    };
    ws.onmessage = ev => {
        try {
            let m = JSON.parse(ev.data);
            if (m.type === 'counts') {
                document.getElementById('cp').innerText = m.data.pending || 0;
                document.getElementById('ct').innerText = m.data.trained || 0;
                document.getElementById('c-trained-total').innerText = m.data.trained || 0;
            }
            if (m.type === 'new_pending' && !ghost.has(m.data.id) && !activeStore[m.data.id]) {
                addCard(m.data.id, m.data);
            }
            if (m.type === 'task_solved' || m.type === 'task_deleted') {
                let tid = m.data.taskId;
                ghost.add(tid);
                document.querySelector(`.card[data-id="${tid}"]`)?.remove();
                delete activeStore[tid];
                updateCounts();
            }
        } catch(e) {}
    };
    ws.onclose = () => {
        document.getElementById('wsP').className = 'pill warn';
        document.getElementById('wsP').textContent = '🔴 Offline';
        setTimeout(wsConn, 3000);
    };
}

// ── UI Rendering ──
const gridArea = document.getElementById('gridArea');
const manualArea = document.getElementById('manualArea');
const trainedArea = document.getElementById('trainedArea');

async function fetchPending() {
    try {
        let r = await fetch(`${SRV}/api/tasks?tab=pending&page=0&size=200&t=${Date.now()}`);
        if (r.ok) {
            let d = await r.json();
            gridArea.innerHTML = ''; manualArea.innerHTML = ''; activeStore = {};
            let tasks = d.tasks || {};
            for (let id in tasks) if (!ghost.has(id)) addCard(id, tasks[id]);
        }
    } catch(e) {}
}

async function fetchTrained() {
    try {
        let r = await fetch(`${SRV}/api/tasks?tab=trained&page=0&size=50&t=${Date.now()}`);
        if (r.ok) {
            let d = await r.json();
            trainedArea.innerHTML = '';
            let tasks = d.tasks || {};
            for (let id in tasks) {
                let td = tasks[id];
                activeStore[id] = { id, clicks: td.clicks || [], type: td.media?.length > 1 ? 'grid' : 'coord', media: td.media || [], prompt: td.prompt || '' };
                trainedArea.appendChild(mkCard(activeStore[id], true));
            }
        }
    } catch(e) {}
}

function addCard(id, td) {
    if (activeStore[id] || ghost.has(id)) return;
    let m = td.media || [];
    let isG = m.length > 1;
    activeStore[id] = { id, clicks: [], type: isG ? 'grid' : 'coord', media: m, prompt: td.prompt || '' };
    let card = mkCard(activeStore[id], false);
    
    if (isG) {
        gridArea.prepend(card);
        if (aiReady && atOn) setTimeout(() => applyAI(activeStore[id]), 200);
    } else {
        manualArea.prepend(card);
    }
    updateCounts();
}

function updateCounts() {
    document.getElementById('c-grid').textContent = gridArea.children.length;
    document.getElementById('c-manual').textContent = manualArea.children.length;
}

function mkCard(t, isTrained) {
    let card = document.createElement('div');
    card.className = 'card'; card.dataset.id = t.id;
    if (isTrained) card.style.minWidth = '240px';

    let pts = t.prompt.split('|||');
    let ex = pts[1] ? `<img src="${pts[1]}" class="eimg">` : `<div class="eph">🖼️</div>`;

    let mH = '';
    if (t.type === 'grid') {
        mH = '<div class="ig">';
        t.media.forEach(m => {
            let sel = t.clicks.includes(m.index) ? ' sel' : '';
            mH += `<img src="${m.thumb || m.src || ''}" class="gi${sel}" data-index="${m.index}" draggable="false">`;
        });
        mH += '</div>';
    } else {
        let m = t.media[0] || {};
        mH = `<div class="sbox" data-id="${t.id}"><img src="${m.src || m.thumb || ''}" class="si" draggable="false">`;
        (t.clicks || []).forEach((pt, i) => {
            mH += `<div class="dot${i % 2 === 1 ? ' end-dot' : ''}" style="left:${pt.px}%;top:${pt.py}%"></div>`;
        });
        mH += `</div>`;
    }

    let aH = isTrained
        ? `<div class="acts" id="act-${t.id}">
             <button class="btn brt" data-action="retrain">🔧 Retrain</button>
             <button class="btn bdl" data-action="del-tr">❌</button>
           </div>`
        : `<div class="acts">
             <button class="btn bsv" data-action="save">Save Task</button>
             <button class="btn brs" data-action="reset">Clear</button>
             <button class="btn bdl" data-action="del">❌</button>
           </div>`;

    card.innerHTML = `
      <div class="chead"><span class="cid">#${t.id.substring(0,6)}</span>${isTrained ? `<span style="font-size:10px;color:#888">${t.clicks.length} clicks</span>` : ''}</div>
      <div class="pcon"><div class="ewrap">${ex}</div><div class="prompt">${pts[0]}</div></div>
      ${mH}${aH}`;
    return card;
}

// ── User Interaction (Grid + Canvas Drag Points) ──
document.body.addEventListener('click', async e => {
    let card = e.target.closest('.card');
    if (!card) return;
    let tid = card.dataset.id;
    let t = activeStore[tid];
    if (!t) return;

    // Grid Click
    if (e.target.classList.contains('gi')) {
        if (autoSaveTimers[tid]) { clearTimeout(autoSaveTimers[tid]); delete autoSaveTimers[tid]; }
        let btn = card.querySelector('.bsv');
        if (btn) { btn.style.background = '#00ff88'; btn.textContent = 'Save Task'; }

        let idx = parseInt(e.target.dataset.index);
        if (e.target.classList.contains('sel') || e.target.classList.contains('aip') || e.target.classList.contains('retrain-pick')) {
            e.target.classList.remove('sel', 'aip', 'retrain-pick');
            t.clicks = t.clicks.filter(i => i !== idx);
        } else {
            e.target.classList.add(rts[tid] ? 'retrain-pick' : 'sel');
            t.clicks.push(idx);
        }
    }

    // Manual Canvas Click (Drag Coordinates)
    let sbox = e.target.closest('.sbox');
    if (sbox && !e.target.closest('.acts')) {
        let rect = sbox.getBoundingClientRect();
        let px = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
        let py = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

        t.clicks.push({ px, py });

        let dot = document.createElement('div');
        dot.className = 'dot' + (t.clicks.length % 2 === 0 ? ' end-dot' : '');
        dot.style.left = px + '%';
        dot.style.top = py + '%';
        sbox.appendChild(dot);
    }

    // Actions
    let actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
        let act = actionBtn.dataset.action;
        if (act === 'save') {
            if (autoSaveTimers[tid]) { clearTimeout(autoSaveTimers[tid]); delete autoSaveTimers[tid]; }
            saveTo(tid, card);
        }
        if (act === 'reset') {
            if (autoSaveTimers[tid]) { clearTimeout(autoSaveTimers[tid]); delete autoSaveTimers[tid]; }
            t.clicks = [];
            card.querySelectorAll('.gi').forEach(i => i.classList.remove('sel', 'aip'));
            card.querySelectorAll('.dot').forEach(d => d.remove());
            card.classList.remove('ai-on');
        }
        if (act === 'del') {
            ghost.add(tid); card.remove(); delete activeStore[tid]; updateCounts();
            fetch(`${SRV}/api/delete-hcaptcha/${tid}`, { method: 'DELETE' }).catch(()=>{});
        }
        if (act === 'retrain') {
            rts[tid] = { old: [...t.clicks] };
            t.clicks = [];
            card.querySelectorAll('.gi').forEach(i => i.classList.remove('sel','aip'));
            card.querySelectorAll('.dot').forEach(d => d.remove());
            let bnr = document.createElement('div'); bnr.className = 'rhint'; bnr.id = `rh-${tid}`;
            bnr.textContent = '🟠 Sahi points/images select karein phir Confirm dabayein';
            card.querySelector('.pcon').after(bnr);
            document.getElementById(`act-${tid}`).innerHTML = `
                <button class="btn bcf" data-action="confirm-rt">✅ Confirm</button>
                <button class="btn bcn" data-action="cancel-rt">Cancel</button>`;
        }
        if (act === 'confirm-rt') {
            let wrong = (rts[tid]?.old || []).filter(i => !t.clicks.includes(i));
            if (aiReady && t.type === 'grid') await trainTask(t, wrong);
            fetch(`${SRV}/api/submit-hcaptcha`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskId: tid, clicks: t.clicks })
            }).then(() => { delete rts[tid]; fetchTrained(); });
        }
        if (act === 'cancel-rt') { delete rts[tid]; fetchTrained(); }
        if (act === 'del-tr') {
            fetch(`${SRV}/api/delete-hcaptcha/${tid}`, { method: 'DELETE' }).then(() => fetchTrained());
            card.remove(); delete activeStore[tid];
        }
    }
});

async function saveTo(taskId, card) {
    let t = activeStore[taskId];
    if (!t || !t.clicks.length) return;

    if (aiReady && t.type === 'grid') {
        await trainTask(t);
        setTimeout(() => { if (atOn) reeval(); }, 300);
    }

    ghost.add(taskId);
    if (card) card.remove();
    delete activeStore[taskId];
    updateCounts();

    await fetch(`${SRV}/api/submit-hcaptcha`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ taskId, clicks: t.clicks })
    }).catch(()=>{});
}

function setTab(t) {
    currentTab = t;
    document.querySelectorAll('.tb').forEach(b => b.classList.remove('on'));
    document.getElementById('bt-' + t).classList.add('on');
    if (t === 'pending') {
        document.getElementById('pendingView').style.display = 'flex';
        document.getElementById('trainedView').style.display = 'none';
        fetchPending();
    } else {
        document.getElementById('pendingView').style.display = 'none';
        document.getElementById('trainedView').style.display = 'flex';
        fetchTrained();
    }
}

function toggleAT() { atOn = !atOn; document.getElementById('bat').className = 'tog' + (atOn ? ' on' : ''); document.getElementById('bat').textContent = '🧠 Auto: ' + (atOn ? 'ON' : 'OFF'); if (atOn && aiReady) reeval(); }
function toggleAS() { asOn = !asOn; document.getElementById('bas').className = 'tog' + (asOn ? ' on' : ''); document.getElementById('bas').textContent = '💾 Save: ' + (asOn ? 'ON' : 'OFF'); }

function onSrch() {
    let q = document.getElementById('si').value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
        c.style.display = (!q || c.dataset.id.includes(q)) ? '' : 'none';
    });
}

wsConn();
fetchPending();
initAI();
</script>
