<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>hCaptcha Master Pro — Live Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0c0c0c; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 12px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #181818; padding: 10px 16px; border-bottom: 2px solid #00ff88; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-shrink: 0; border-radius: 4px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header h1 { margin: 0; font-size: 17px; color: #00ff88; }
        .tabs { display: flex; gap: 6px; }
        .tab-btn { background: #282828; color: #aaa; border: 1px solid #444; padding: 6px 14px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .tab-btn.active { background: #00ff88; color: #000; border-color: #00ff88; }
        .count-badge { background: #000; color: #fff; padding: 1px 6px; border-radius: 8px; font-size: 11px; margin-left: 4px; }
        .ai-bar { display: flex; align-items: center; gap: 8px; }
        .live-status { font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #1a1a1a; border: 1px solid #ff4444; color: #ff4444; }
        .live-status.active { border-color: #00ff88; color: #00ff88; }
        .sync-status { font-size: 12px; color: #ffaa00; font-weight: bold; }
        .sync-status.active { color: #00ff88; }
        .btn-toggle { padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; border: 1px solid #555; background: #222; color: #888; }
        .btn-toggle.on { background: #00ff88; color: #000; border-color: #00ff88; }
        .btn-clear-ai { background: #331111; color: #ff5555; border: 1px solid #772222; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .search-box input { padding: 6px 10px; background: #222; border: 1px solid #444; color: #00ff88; border-radius: 4px; font-size: 12px; outline: none; width: 140px; }
        .workspace-split { display: flex; gap: 12px; flex: 1; min-height: 0; margin-top: 10px; }
        .column { flex: 1; display: flex; flex-direction: column; background: #141414; border: 1px solid #262626; border-radius: 6px; overflow: hidden; }
        .column-header { padding: 8px 12px; background: #1c1c1c; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .col-title-ai { color: #00ff88; font-size: 14px; }
        .col-title-manual { color: #ff9900; font-size: 14px; }
        .stream-count { background: #000; padding: 2px 6px; border-radius: 8px; font-size: 11px; color: #fff; }
        .task-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .task-card { background: #1c1c1c; border: 1px solid #333; border-radius: 6px; padding: 10px; }
        .task-card.ai-processing { border-color: #ff00ff; box-shadow: 0 0 8px rgba(255,0,255,0.3); }
        .task-card.in-retrain { border: 2px solid #ff8800 !important; background: #221405 !important; }

        .task-id { color: #ff4444; font-family: monospace; font-size: 13px; font-weight: bold; }
        .prompt-container { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; background: #222; padding: 5px; border-radius: 4px; border: 1px solid #333; }
        .example-wrap { flex-shrink: 0; width: 42px; height: 42px; }
        .example-img { width: 42px; height: 42px; object-fit: cover; border-radius: 3px; border: 1px solid #555; }
        .example-img-placeholder { width: 42px; height: 42px; border-radius: 3px; background: #2a2a2a; border: 1px dashed #555; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .task-prompt { color: #fff; font-size: 12px; font-weight: bold; line-height: 1.3; }
        .img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
        .img-grid-cell { position: relative; width: 100%; height: 105px; }
        .img-grid-cell img { width: 100%; height: 105px; object-fit: cover; cursor: pointer; border: 3px solid transparent; background: #222; border-radius: 3px; display: block; }
        .img-grid-cell img.selected { border-color: #00ff88; opacity: 0.85; }
        .img-grid-cell img.ai-pick { border-color: #ff00ff; opacity: 0.9; }
        .img-grid-cell img.retrain-pick { border-color: #ff8800 !important; opacity: 0.95; }
        .img-grid-cell img.img-broken { opacity: 0.15; cursor: not-allowed; }
        .img-broken-badge {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #1a0a0a; border: 1px dashed #552222; border-radius: 3px;
            font-size: 10px; color: #884444; pointer-events: none; gap: 3px;
            text-align: center; padding: 4px;
        }
        .img-broken-badge span { font-size: 16px; }
        .img-grid img { width: 100%; height: 105px; object-fit: cover; cursor: pointer; border: 3px solid transparent; background: #222; border-radius: 3px; }
        .img-grid img.selected { border-color: #00ff88; opacity: 0.85; }
        .img-grid img.ai-pick { border-color: #ff00ff; opacity: 0.9; }
        .img-grid img.retrain-pick { border-color: #ff8800 !important; opacity: 0.95; }
        .single-box { position: relative; width: 100%; cursor: crosshair; display: flex; justify-content: center; align-items: center; background: #000; border-radius: 4px; border: 1px solid #444; overflow: hidden; }
        .single-box img { width: 100%; height: auto; min-height: 380px; max-height: 480px; object-fit: contain; display: block; user-select: none; }
        .dot { position: absolute; width: 16px; height: 16px; background: #00ff88; border: 2px solid #000; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        .dot.retrain-dot { background: #ff8800; }
        .trained-error-notice { font-size: 11px; color: #886633; background: #221a00; border: 1px dashed #554400; border-radius: 4px; padding: 4px 8px; margin-bottom: 6px; display: none; text-align: center; }
        .trained-error-notice.visible { display: block; }
        .img-load-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; font-size: 18px; border-radius: 3px; pointer-events: none; }
        .retrain-disabled-note { font-size: 10px; color: #886633; text-align: center; padding: 3px 0; }
        .actions { display: flex; gap: 6px; margin-top: 8px; }
        .btn { flex: 1; padding: 8px; border: none; font-weight: bold; cursor: pointer; color: #fff; font-size: 12px; border-radius: 4px; }
        .btn-save { background: #00ff88; color: #000; }
        .btn-reset { background: #444; }
        .btn-del { background: #ff4444; flex: 0.3; }
        .btn-retrain { background: #ff8800; color: #000; }
        .btn-confirm { background: #00ff88; color: #000; }
        .btn-cancel { background: #555; }
        .btn-warn { background: #ff2222 !important; color: #fff !important; }
        #trainedView { display: none; flex: 1; flex-direction: column; background: #141414; border: 1px solid #262626; border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .trained-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-wrap: wrap; gap: 12px; }
        .retrain-banner { font-size: 11px; color: #ff8800; margin-bottom: 6px; padding: 5px; background: #331c00; border-radius: 3px; border: 1px dashed #ff8800; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>hCaptcha Master Pro</h1>
        <div class="tabs">
            <button class="tab-btn active" id="btn-pending" onclick="setTab('pending')">Pending <span class="count-badge" id="c-pending">0</span></button>
            <button class="tab-btn" id="btn-trained" onclick="setTab('trained')">Trained <span class="count-badge" id="c-trained">0</span></button>
        </div>
    </div>
    <div class="ai-bar">
        <span class="live-status" id="wsStatus">🔴 Offline</span>
        <span class="sync-status" id="syncStatus">🧠 AI Ready</span>
        <span id="trainCountBadge" style="font-size:11px;color:#00ff88;font-weight:bold;background:#001a0a;border:1px solid #00ff88;padding:3px 8px;border-radius:4px;">📚 0 Trained</span>
        <button id="btnAutoTrain" class="btn-toggle on" onclick="toggleAutoTrain()">🧠 Auto Train: ON</button>
        <button id="btnAutoSave" class="btn-toggle on" onclick="toggleAutoSave()">💾 Auto Save: ON</button>
        <button class="btn-clear-ai" onclick="resetAIBrain()">🧹 Reset Brain</button>
        <div class="search-box">
            <input type="text" id="searchInput" oninput="filterTasks()" placeholder="🔍 Task ID..."/>
        </div>
    </div>
</div>

<div class="workspace-split" id="pendingView">
    <div class="column">
        <div class="column-header">
            <span class="col-title-ai">🤖 AI Fast-Train Stream (Grids)</span>
            <span class="stream-count" id="c-grid">0 Tasks</span>
        </div>
        <div class="task-list" id="gridArea"></div>
    </div>
    <div class="column">
        <div class="column-header">
            <span class="col-title-manual">👷 Manual Worker Stream (Videos / Coordinates)</span>
            <span class="stream-count" id="c-manual">0 Tasks</span>
        </div>
        <div class="task-list" id="manualArea"></div>
    </div>
</div>

<div id="trainedView">
    <div class="column-header">
        <span style="color:#00ff88;font-size:14px;">🗂️ Trained Database Archive</span>
        <div style="display:flex;align-items:center;gap:10px;">
            <span id="expiredNotice" class="trained-error-notice">⚠️ Kuch images expire ho gayi hain (server 403). Retrain ke liye naya task ka intezaar karo.</span>
            <span class="stream-count" id="c-trained-total">0 Solved</span>
        </div>
    </div>
    <div class="trained-container" id="trainedArea"></div>
</div>

<script>
const SERVER_URL = location.origin;
const WS_URL = SERVER_URL.replace(/^http/, 'ws');
const gridArea = document.getElementById('gridArea');
const manualArea = document.getElementById('manualArea');
const trainedArea = document.getElementById('trainedArea');
const syncStatus = document.getElementById('syncStatus');
const wsStatus = document.getElementById('wsStatus');

let currentTab = 'pending';
let serverData = { pending: {}, trained: {} }, activeTasksStore = {}, videoTasks = [];
let ghostBlocker = new Set();
let retrainEditingTasks = new Set();
let isFetching = false;
let trainedPage = 0;

let isAIReady = false, aiModel, knn;
let autoTrainEnabled = true;
let autoSaveEnabled = true;
let isEvaluatingAI = false;
let totalTrainedExamples = 0;

// ── WEBSOCKET LIVE ENGINE ──
let ws = null;
function initWS() {
    if (ws && ws.readyState < 2) return;
    try {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => {
            wsStatus.className = 'live-status active';
            wsStatus.innerText = '🟢 Live';
            ws.send(JSON.stringify({ action: 'dashboard' }));
        };
        ws.onmessage = (ev) => {
            try {
                let msg = JSON.parse(ev.data);
                if (msg.type === 'counts') {
                    document.getElementById('c-pending').innerText = msg.data.pending;
                    document.getElementById('c-trained').innerText = msg.data.trained;
                    document.getElementById('c-trained-total').innerText = `${msg.data.trained} Solved`;
                }
                if (msg.type === 'new_task' && currentTab === 'pending') {
                    let td = msg.data;
                    if (!ghostBlocker.has(td.id) && !activeTasksStore[td.id]) {
                        serverData.pending[td.id] = td;
                        let isGrid = (td.media || []).length > 1;
                        activeTasksStore[td.id] = { id: td.id, clicks: [], type: isGrid ? 'grid' : 'coord', media: td.media || [], prompt: td.prompt || '' };
                        let card = buildCard(activeTasksStore[td.id]);
                        if (isGrid) {
                            gridArea.prepend(card);
                            if (isAIReady && autoTrainEnabled) predictWithAI(activeTasksStore[td.id]);
                        } else {
                            manualArea.prepend(card);
                        }
                        updateCountsDisplay();
                    }
                }
                if (msg.type === 'task_solved' || msg.type === 'task_deleted') {
                    let tid = msg.data.taskId;
                    ghostBlocker.add(tid);
                    document.querySelector(`.task-card[data-id="${tid}"]`)?.remove();
                    delete activeTasksStore[tid];
                    delete serverData.pending[tid];
                    videoTasks = videoTasks.filter(v => v.id !== tid);
                    updateCountsDisplay();
                }
            } catch(e) {}
        };
        ws.onclose = () => {
            wsStatus.className = 'live-status';
            wsStatus.innerText = '🔴 Offline';
            setTimeout(initWS, 1500);
        };
    } catch(e) {
        setTimeout(initWS, 1500);
    }
}

function updateCountsDisplay() {
    document.getElementById('c-grid').innerText = `${gridArea.children.length} Grids`;
    document.getElementById('c-manual').innerText = `${manualArea.children.length} Tasks`;
}

async function initAI() {
    try {
        await tf.setBackend('webgl');
        await tf.ready();
        aiModel = await mobilenet.load({ version: 2, alpha: 1.0 });
        // knn object sirf training ke liye rakhte hain (optional)
        knn = knnClassifier.create();
        await loadKNN();
        isAIReady = true;
        updateAIStatus();
        setupWebGLRecovery();
        startMemoryMonitor();
        // 1.5 sec baad start karo — GPU settle ho
        setTimeout(() => reEvaluatePending(), 1500);
    } catch(e) {
        syncStatus.innerHTML = "⚠️ AI Fallback";
    }
}

// ── FIX 3: WebGL Context Lost Recovery ──
function setupWebGLRecovery() {
    // TF.js apna canvas internally banata hai — sab canvases pe listener lagao
    function attachToCanvas(canvas) {
        if (!canvas || canvas._hcmListenerAttached) return;
        canvas._hcmListenerAttached = true;
        canvas.addEventListener('webglcontextlost', async (e) => {
            e.preventDefault();
            isAIReady = false;
            syncStatus.innerHTML = '⚠️ WebGL Crash — Recovering...';
            try {
                await new Promise(r => setTimeout(r, 3000));
                await tf.disposeVariables();
                await tf.setBackend('webgl');
                await tf.ready();
                aiModel = await mobilenet.load({ version: 2, alpha: 1.0 });
                knn = knnClassifier.create();
                // ── Context recover ke baad CPU se fresh tensors banao ──
                _refreshKnnFromCpu();
                isAIReady = true;
                updateAIStatus();
                syncStatus.innerHTML = '✅ WebGL Recovered!';
                setTimeout(() => updateAIStatus(), 2000);
            } catch(err) {
                syncStatus.innerHTML = '❌ WebGL Failed — Reload Karen';
            }
        });
    }
    // Abhi jo canvases hain unpe lagao
    document.querySelectorAll('canvas').forEach(attachToCanvas);
    // Nayi canvases bhi track karo (TF.js baad mein bana sakta hai)
    const observer = new MutationObserver(() => {
        document.querySelectorAll('canvas').forEach(attachToCanvas);
    });
    observer.observe(document.body, { childList: true, subtree: true });
}

// ── FIX 4: Aggressive Memory Monitor — har 5 sec GPU check ──
function startMemoryMonitor() {
    setInterval(() => {
        try {
            let mem = tf.memory();
            // 80 tensors se zyada = KNN leak ho raha — foran saaf karo
            if (mem.numTensors > 80) {
                tf.engine().startScope();
                tf.engine().endScope();
                // KNN dataset tensors bhi re-sync karo taake wo na hate
                syncStatus.innerHTML = `🧹 Auto-Clean (${mem.numTensors}→${tf.memory().numTensors} tensors)`;
                setTimeout(() => updateAIStatus(), 1000);
            }
        } catch(e) {}
    }, 5000);
}

function updateAIStatus() {
    try {
        let concepts = Object.keys(knnCpuDataset).filter(k => !k.startsWith('negative_')).length;
        let totalEx = 0;
        for (let k in knnCpuDataset) { totalEx += knnCpuDataset[k].shape[0]; }
        syncStatus.innerHTML = `🤖 AI Ready ✅ (${concepts} Concepts)`;
        syncStatus.classList.add('active');
        let badge = document.getElementById('trainCountBadge');
        if (badge) badge.textContent = `📚 ${totalEx} Trained`;
    } catch(e) {}
}

const IDB = { name:'hcm_knn_master', store:'knn', key:'model_v6' };
function idbOpen() {
    return new Promise((res,rej)=>{
        let r = indexedDB.open(IDB.name,1);
        r.onupgradeneeded = e => e.target.result.createObjectStore(IDB.store);
        r.onsuccess = e => res(e.target.result);
        r.onerror = () => rej(r.error);
    });
}
async function idbSet(val) {
    let db = await idbOpen();
    return new Promise((res,rej)=>{
        let tx = db.transaction(IDB.store,'readwrite');
        tx.objectStore(IDB.store).put(val, IDB.key);
        tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
}
async function idbGet() {
    let db = await idbOpen();
    return new Promise((res,rej)=>{
        let tx = db.transaction(IDB.store,'readonly');
        let req = tx.objectStore(IDB.store).get(IDB.key);
        req.onsuccess = () => res(req.result||null);
        req.onerror = () => rej(req.error);
    });
}
// ── PERMANENT FIX: KNN data CPU arrays mein rakho, kabhi GPU pe store mat karo ──
// GPU context lost hone pe GPU tensors invalid ho jaate hain — isliye CPU storage
let knnCpuDataset = {}; // { label: { data: Float32Array, shape: [...] } }

async function saveKNN() {
    if (!knn) return;
    try {
        // Seedha knnCpuDataset se save karo — knn se GPU tensors mat lo
        await idbSet(
            Object.fromEntries(
                Object.entries(knnCpuDataset).map(([k, v]) => [k, { data: Array.from(v.data), shape: v.shape }])
            )
        );
        updateAIStatus();
    } catch(e) {}
}

async function loadKNN() {
    try {
        let ser = await idbGet();
        if (!ser) return;
        knnCpuDataset = {};
        for (let k in ser) {
            knnCpuDataset[k] = { data: new Float32Array(ser[k].data), shape: ser[k].shape };
        }
        // KNN mein load karo — sirf is waqt GPU tensors banao
        _refreshKnnFromCpu();
    } catch(e) {}
}

function _refreshKnnFromCpu() {
    // Purane tensors pehle saaf karo
    try {
        let old = knn.getClassifierDataset();
        for (let k in old) { try { old[k].dispose(); } catch(e) {} }
    } catch(e) {}
    // Nayi tensors banao current backend se
    let ds = {};
    for (let k in knnCpuDataset) {
        ds[k] = tf.tensor(knnCpuDataset[k].data, knnCpuDataset[k].shape);
    }
    knn.setClassifierDataset(ds);
}

async function resetAIBrain() {
    if (confirm("Kya aap AI Brain ki sari memory reset karna chahte hain?")) {
        indexedDB.deleteDatabase(IDB.name);
        if (knn) knn.clearAllClasses();
        location.reload();
    }
}

function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + tab).classList.add('active');
    if (tab === 'pending') {
        document.getElementById('pendingView').style.display = 'flex';
        document.getElementById('trainedView').style.display = 'none';
    } else {
        document.getElementById('pendingView').style.display = 'none';
        document.getElementById('trainedView').style.display = 'flex';
        trainedArea.innerHTML = '';
        // Notice reset karo jab tak check na ho
        let notice = document.getElementById('expiredNotice');
        if (notice) notice.classList.remove('visible');
    }
    fetchTasks();
}

function toggleAutoTrain() {
    autoTrainEnabled = !autoTrainEnabled;
    let btn = document.getElementById('btnAutoTrain');
    btn.className = 'btn-toggle' + (autoTrainEnabled ? ' on' : '');
    btn.textContent = '🧠 Auto Train: ' + (autoTrainEnabled ? 'ON' : 'OFF');
    if (autoTrainEnabled && isAIReady) reEvaluatePending();
}

function toggleAutoSave() {
    autoSaveEnabled = !autoSaveEnabled;
    let btn = document.getElementById('btnAutoSave');
    btn.className = 'btn-toggle' + (autoSaveEnabled ? ' on' : '');
    btn.textContent = '💾 Auto Save: ' + (autoSaveEnabled ? 'ON' : 'OFF');
}

// ── 10X TRAINING ENGINE ──
// Positive examples ko 3x repeat karo — zyada weight milega correct answers ko
// Negative examples 1x — balanced lekin kam dominant
const POSITIVE_REPEAT = 3; // Positive label 3 dafa store hoga
const NEGATIVE_REPEAT = 1; // Negative 1 dafa

function addToDataset(label, featureArr) {
    const D = featureArr.length;
    if (!knnCpuDataset[label]) {
        knnCpuDataset[label] = { data: new Float32Array(featureArr), shape: [1, D] };
    } else {
        const old = knnCpuDataset[label];
        // Size cap: ek label ke liye max 500 examples — memory overflow nahi hoga
        const MAX_EXAMPLES = 500;
        const currentN = old.shape[0];
        if (currentN >= MAX_EXAMPLES) {
            // FIFO: purana pehla example hata do, naya add karo (sliding window)
            const newData = new Float32Array(old.data.length);
            newData.set(old.data.subarray(D), 0); // pehla example chod do
            newData.set(featureArr, old.data.length - D);
            knnCpuDataset[label] = { data: newData, shape: [currentN, D] };
        } else {
            const newData = new Float32Array(old.data.length + D);
            newData.set(old.data, 0);
            newData.set(featureArr, old.data.length);
            knnCpuDataset[label] = { data: newData, shape: [currentN + 1, D] };
        }
    }
    totalTrainedExamples++;
}

async function trainAIBrainAsync(task) {
    if (!isAIReady || task.type !== 'grid' || !task.media || !task.clicks || task.clicks.length === 0) return;
    let pText = task.prompt.split('|||')[0].trim().toLowerCase();
    let negLabel = 'negative_' + pText;
    let trained = 0, skipped = 0;

    syncStatus.innerHTML = `⏳ Training "${pText}"...`;

    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = new Image();
            if (!imgSrc.startsWith('data:')) img.crossOrigin = 'anonymous';
            img.src = imgSrc;
            let loaded = await new Promise((res) => {
                img.onload = () => res(true);
                img.onerror = () => res(false);
                setTimeout(() => res(false), 500);
            });
            if (!loaded || !img.complete || img.naturalWidth === 0) { skipped++; continue; }

            let tfImg = null, features = null;
            try {
                tfImg = tf.browser.fromPixels(img);
                features = aiModel.infer(tfImg, true);
                const featureArr = new Float32Array(await features.data());
                const isPositive = task.clicks.includes(m.index);
                const label = isPositive ? pText : negLabel;
                // 10X POWER: Positive = 3 dafa store, Negative = 1 dafa
                const repeat = isPositive ? POSITIVE_REPEAT : NEGATIVE_REPEAT;
                for (let r = 0; r < repeat; r++) addToDataset(label, featureArr);
                trained++;
            } finally {
                if (tfImg) { tfImg.dispose(); tfImg = null; }
                if (features) { features.dispose(); features = null; }
            }
            await tf.nextFrame();
        } catch(e) { skipped++; }
    }

    await saveKNN();
    updateAIStatus();

    if (trained === 0) {
        syncStatus.innerHTML = `⚠️ Koi image load nahi hui — training skip`;
        setTimeout(() => updateAIStatus(), 2500);
    } else {
        syncStatus.innerHTML = `✅ +${trained} trained (${skipped > 0 ? skipped + ' skip' : 'sab load'})`;
        setTimeout(() => updateAIStatus(), 1500);
    }
    // Auto-save hata diya — reEvaluatePending bhi nahi chalega (hang fix)
}

// ════════════════════════════════════════════════════════════
// ── FINAL FIX: KNN library BYPASS — Custom Cosine Similarity ──
// KNN.predictClass() → concatWithNulls → 3.5GB GPU leak
// Ab khud cosine similarity calculate karo — koi concat nahi
// ════════════════════════════════════════════════════════════

// knnCpuDataset: { label: { data: Float32Array, shape:[N,1280] } }
// Ek label ke liye N examples hain (rows), har ek 1280 features

async function myPredict(featureTensor, pText) {
    // featureTensor: shape [1, 1280]
    const negLabel = 'negative_' + pText;
    const labels = Object.keys(knnCpuDataset).filter(
        k => k === pText || k === negLabel
    );
    if (labels.length === 0) return null;

    const scores = {};
    const featArr = await featureTensor.data(); // Float32Array [1280]
    const D = 1280;

    // 🔥 SPEED FIX: Calculate normA sirf 1 dafa loop se bahar! (CPU load khatam)
    let normA = 0;
    for (let j = 0; j < D; j++) {
        normA += featArr[j] * featArr[j];
    }
    const sqrtNormA = Math.sqrt(normA);

    for (let lbl of labels) {
        const entry = knnCpuDataset[lbl];
        const N = entry.shape[0];

        let maxSim = -1; // 🔥 ACCURACY FIX: Average ki bajaye Best Match (Nearest Neighbor)
        
        for (let i = 0; i < N; i++) {
            const offset = i * D;
            let dot = 0, normB = 0;
            for (let j = 0; j < D; j++) {
                const b = entry.data[offset + j];
                dot += featArr[j] * b;
                normB += b * b;
            }
            const sim = dot / (sqrtNormA * Math.sqrt(normB) + 1e-8);
            if (sim > maxSim) maxSim = sim; // Sab se high matching score save karo
        }
        scores[lbl] = maxSim; 
    }

    // Softmax-style confidence
    const vals = Object.values(scores);
    const minV = Math.min(...vals), maxV = Math.max(...vals);
    const range = maxV - minV + 1e-8;
    const confidences = {};
    for (let k in scores) {
        confidences[k] = (scores[k] - minV) / range;
    }

    let bestLabel = labels[0];
    for (let k of labels) {
        if (scores[k] > scores[bestLabel]) bestLabel = k;
    }
    return { label: bestLabel, confidences };
}

// predictWithAI — sirf PREVIEW: AI picks purple border se dikhata hai
// Auto-save nahi hota — aap khud Save & Train karo
async function predictWithAI(task) {
    if (!isAIReady || task.type !== 'grid' || !task.media) return;
    let pText = task.prompt.split('|||')[0].trim().toLowerCase();
    if (!knnCpuDataset[pText]) return; // Is concept ki training nahi — skip
    let predictedClicks = [];

    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = new Image();
            if (!imgSrc.startsWith('data:')) img.crossOrigin = 'anonymous';
            img.src = imgSrc;
            let loaded = await new Promise((res) => {
                img.onload = () => res(true);
                img.onerror = () => res(false);
                setTimeout(() => res(false), 300);
            });
            if (!loaded || !img.complete || img.naturalWidth === 0) continue;

            let tfImg = null, features = null, resolvedRes = null;
            try {
                tfImg = tf.browser.fromPixels(img);
                features = aiModel.infer(tfImg, true);
                resolvedRes = await myPredict(features, pText);
            } finally {
                if (tfImg) { tfImg.dispose(); tfImg = null; }
                if (features) { features.dispose(); features = null; }
            }
            await tf.nextFrame();

            if (resolvedRes) {
                const conf = resolvedRes.confidences[pText] || 0;
                const negConf = resolvedRes.confidences['negative_' + pText] || 0;
                if (resolvedRes.label === pText && conf >= 0.60 && negConf < 0.55) {
                    predictedClicks.push(m.index);
                }
            }
            await new Promise(r => setTimeout(r, 2));
        } catch(e) {}
    }

    if (predictedClicks.length >= 1 && predictedClicks.length <= 6) {
        task.clicks = predictedClicks;
        let card = document.querySelector(`.task-card[data-id="${task.id}"]`);
        if (card) {
            card.classList.add('ai-processing');
            predictedClicks.forEach(idx => {
                let imgEl = card.querySelector(`.g-img[data-index="${idx}"]`);
                if (imgEl) imgEl.classList.add('ai-pick');
            });
            if (autoSaveEnabled) {
                // Auto Save: server ko submit karo — lekin TRAIN NAHI — sirf aapke manual save se training hogi
                let btn = card.querySelector('.btn-save');
                if (btn) { btn.style.background = '#ff00ff'; btn.textContent = '🤖 Auto Solved'; }
                sendToServerNoTrain(task.id, card);
            } else {
                // Auto Save OFF: sirf suggest karo — user khud save kare
                let btn = card.querySelector('.btn-save');
                if (btn) { btn.style.background = '#7700cc'; btn.textContent = '🤖 AI Suggestion — Save karo?'; }
            }
        }
    }
}

// reEvaluatePending — hang-proof version
// isEvaluatingAI lock 30sec ke baad force-release hoga
let _reEvalTimer = null;
async function reEvaluatePending() {
    if (isEvaluatingAI) return;
    isEvaluatingAI = true;
    // Hang safety: 30 sec ke baad automatically unlock
    _reEvalTimer = setTimeout(() => { isEvaluatingAI = false; }, 30000);
    try {
        const ids = Object.keys(serverData.pending);
        for (let id of ids) {
            if (!isEvaluatingAI) break; // Agar force-released ho gaya to stop
            let t = activeTasksStore[id];
            if (t && t.type === 'grid' && (!t.clicks || t.clicks.length === 0)) {
                await predictWithAI(t);
                await new Promise(r => setTimeout(r, 20));
            }
        }
    } catch(e) {
        // Koi bhi error ho — lock release karo
    } finally {
        clearTimeout(_reEvalTimer);
        isEvaluatingAI = false;
    }
}

// ── BUG FIX 2: isFetching try/finally — fetch hang hone pe reset hoga ──
async function fetchTasks() {
    if (isFetching) return;
    isFetching = true;
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(
            `${SERVER_URL}/api/tasks?tab=${currentTab}&page=${trainedPage}&size=40&t=${Date.now()}`,
            { cache: 'no-store', signal: controller.signal }
        );
        clearTimeout(timeoutId);
        if (res.ok) {
            const data = await res.json();
            if (currentTab === 'pending') {
                serverData.pending = data.tasks || {};
                renderPendingStreams();
                if (isAIReady && autoTrainEnabled) reEvaluatePending();
            } else {
                serverData.trained = data.tasks || {};
                renderTrainedStream();
            }
        }
    } catch(e) {
    } finally {
        isFetching = false;
    }
}

function renderPendingStreams() {
    let pending = serverData.pending;
    document.querySelectorAll('#pendingView .task-card').forEach(card => {
        let id = card.dataset.id;
        if (!pending[id] || ghostBlocker.has(id)) {
            card.remove();
            delete activeTasksStore[id];
        }
    });
    for (let id of Object.keys(pending)) {
        if (ghostBlocker.has(id) || activeTasksStore[id]) continue;
        let td = pending[id], media = td.media || [], isGrid = media.length > 1;
        activeTasksStore[id] = { id, clicks: [], type: isGrid ? 'grid' : 'coord', media, prompt: td.prompt || '' };
        let card = buildCard(activeTasksStore[id]);
        if (isGrid) {
            gridArea.prepend(card);
            if (isAIReady && autoTrainEnabled) predictWithAI(activeTasksStore[id]);
        } else {
            manualArea.prepend(card);
        }
    }
    updateCountsDisplay();
}

function renderTrainedStream() {
    let frag = document.createDocumentFragment();
    let existingIds = new Set();
    document.querySelectorAll('#trainedView .task-card').forEach(card => {
        let id = card.dataset.id;
        if (!serverData.trained[id]) card.remove();
        else existingIds.add(id);
    });
    for (let id of Object.keys(serverData.trained)) {
        if (existingIds.has(id) || retrainEditingTasks.has(id)) continue;
        let td = serverData.trained[id];
        activeTasksStore[id] = { id, clicks: [...(td.clicks || [])], type: (td.media?.length > 1 ? 'grid' : 'coord'), media: td.media || [], prompt: td.prompt || '' };
        let card = buildCard(activeTasksStore[id], true);
        frag.appendChild(card);
    }
    trainedArea.appendChild(frag);
    // Thodi der baad broken images check karo
    setTimeout(checkTrainedImageErrors, 800);
}

function checkTrainedImageErrors() {
    let brokenCount = document.querySelectorAll('#trainedView .img-broken').length;
    let notice = document.getElementById('expiredNotice');
    if (notice) {
        if (brokenCount > 0) {
            notice.textContent = `⚠️ ${brokenCount} image(s) expire ho gayi hain (server 403). In cards ko retrain nahi kar sakte.`;
            notice.classList.add('visible');
        } else {
            notice.classList.remove('visible');
        }
    }
    // Cards jahan sari images broken hain unpe retrain button disable karo
    document.querySelectorAll('#trainedView .task-card').forEach(card => {
        let allImgs = card.querySelectorAll('.g-img');
        if (allImgs.length === 0) return;
        let brokenImgs = card.querySelectorAll('.img-broken');
        let retrainBtn = card.querySelector('[data-action="retrain"]');
        if (!retrainBtn) return;
        if (brokenImgs.length === allImgs.length) {
            // Sari images broken — retrain completely disable
            retrainBtn.disabled = true;
            retrainBtn.style.background = '#333';
            retrainBtn.style.color = '#666';
            retrainBtn.style.cursor = 'not-allowed';
            retrainBtn.title = 'Images expire ho gayi hain — retrain nahi ho sakta';
            // Note add karo agar pehle se nahi hai
            if (!card.querySelector('.retrain-disabled-note')) {
                let note = document.createElement('div');
                note.className = 'retrain-disabled-note';
                note.textContent = '🚫 Images expired — retrain unavailable';
                card.querySelector(`#act-${card.dataset.id}`)?.appendChild(note);
            }
        } else if (brokenImgs.length > 0) {
            // Kuch images broken — partial warning
            retrainBtn.title = `${brokenImgs.length}/${allImgs.length} images expire ho gayi — partial retrain possible`;
            retrainBtn.style.background = '#664400';
            retrainBtn.style.color = '#ffaa44';
        }
    });
}

function buildCard(t, isTrained = false) {
    let card = document.createElement('div');
    card.className = 'task-card';
    card.dataset.id = t.id;
    card.style.minWidth = isTrained ? '320px' : 'auto';
    let parts = t.prompt.split('|||');
    let exHtml = parts[1] ? `<img src="${parts[1]}" class="example-img">` : `<div class="example-img-placeholder">🖼️</div>`;
    let mediaHTML = '';
    if (t.type === 'grid') {
        mediaHTML = '<div class="img-grid">';
        t.media.forEach(m => {
            let isSelected = t.clicks.includes(m.index);
            let src = m.thumb || m.src || '';
            mediaHTML += `<div class="img-grid-cell">
                <img src="${src}" class="g-img ${isSelected?'selected':''}" data-index="${m.index}" draggable="false" loading="lazy"
                     onerror="this.classList.add('img-broken');this.nextElementSibling.style.display='flex';this.style.pointerEvents='none';" />
                <div class="img-broken-badge" style="display:none"><span>🚫</span>Expired</div>
            </div>`;
        });
        mediaHTML += '</div>';
    } else {
        let m = t.media[0], isVid = m.type === 'video_frames' && m.frames && m.frames.length > 0;
        let src = isVid ? m.frames[0] : (m.src || '');
        mediaHTML = `<div class="single-box"><img src="${src}" class="s-img ${isVid?'vid-player':''}" data-id="${t.id}" draggable="false"/>`;
        t.clicks.forEach(pt => {
            mediaHTML += `<div class="dot" style="left:${pt.px}%;top:${pt.py}%;"></div>`;
        });
        mediaHTML += '</div>';
        if (isVid && !isTrained) videoTasks.push({ id: t.id, frames: m.frames, current: 0 });
    }
    let actions = !isTrained ? `
        <div class="actions">
            <button class="btn btn-save" data-action="save">Save & Train</button>
            <button class="btn btn-reset" data-action="reset">Clear</button>
            <button class="btn btn-del" data-action="del">❌</button>
        </div>` : `
        <div class="actions" id="act-${t.id}">
            <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
            <button class="btn btn-del" data-action="del-trained">❌</button>
        </div>`;
    card.innerHTML = `
        <div class="task-head">
            <span class="task-id">#${t.id.substring(0,6)}</span>
            ${isTrained ? `<span style="font-size:11px;color:#888" id="count-${t.id}">${t.clicks.length} saved</span>` : ''}
        </div>
        <div class="prompt-container"><div class="example-wrap">${exHtml}</div><div class="task-prompt">${parts[0]}</div></div>
        ${mediaHTML}
        ${actions}`;
    return card;
}

document.body.addEventListener('click', (e) => {
    let actionBtn = e.target.closest('[data-action]');
    let card = e.target.closest('.task-card');
    if (!card) return;
    let tid = card.dataset.id, t = activeTasksStore[tid];
    if (!t) return;
    let isTrainedCard = card.closest('#trainedView') !== null;
    let isInRetrain = retrainEditingTasks.has(tid);
    if (actionBtn) {
        let act = actionBtn.dataset.action;
        if (act === 'retrain') {
            retrainEditingTasks.add(tid);
            card.classList.add('in-retrain');
            let banner = document.createElement('div');
            banner.className = 'retrain-banner'; banner.id = `banner-${tid}`;
            banner.textContent = '🟠 RETRAIN MODE: Click images to modify, then Update';
            card.querySelector('.prompt-container').after(banner);
            let actBox = card.querySelector(`#act-${tid}`);
            actBox.innerHTML = `
                <button class="btn btn-confirm" data-action="confirm-retrain">✅ Update & Train</button>
                <button class="btn btn-reset" data-action="clear-retrain">Clear All</button>
                <button class="btn btn-cancel" data-action="cancel-retrain">Cancel</button>`;
            return;
        }
        if (act === 'confirm-retrain') {
            // Check karo ke koi valid (non-broken) image select hui hai
            let selectedImgs = card.querySelectorAll('.g-img.selected:not(.img-broken), .g-img.retrain-pick:not(.img-broken)');
            if (!t.clicks || t.clicks.length === 0 || selectedImgs.length === 0) {
                actionBtn.classList.add('btn-warn');
                // Better error message — broken vs not selected
                let hasBroken = card.querySelectorAll('.img-broken').length > 0;
                actionBtn.textContent = hasBroken ? '⚠️ Valid image select karo!' : '⚠️ Pehle Select Karo!';
                setTimeout(() => { actionBtn.classList.remove('btn-warn'); actionBtn.textContent = '✅ Update & Train'; }, 1500);
                return;
            }
            fetch(`${SERVER_URL}/api/submit-hcaptcha`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskId: tid, clicks: t.clicks })
            }).then(() => {
                if (isAIReady && t.type === 'grid') trainAIBrainAsync(t);
                retrainEditingTasks.delete(tid);
                card.classList.remove('in-retrain');
                let b = card.querySelector(`#banner-${tid}`); if (b) b.remove();
                let actBox = card.querySelector(`#act-${tid}`);
                actBox.innerHTML = `
                    <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
                    <button class="btn btn-del" data-action="del-trained">❌</button>`;
                fetchTasks();
            });
            return;
        }
        if (act === 'clear-retrain') {
            t.clicks = [];
            card.querySelectorAll('.g-img').forEach(img => img.classList.remove('selected', 'ai-pick', 'retrain-pick'));
            card.querySelectorAll('.dot').forEach(d => d.remove());
            return;
        }
        if (act === 'cancel-retrain') {
            retrainEditingTasks.delete(tid);
            card.classList.remove('in-retrain');
            let b = card.querySelector(`#banner-${tid}`); if (b) b.remove();
            let actBox = card.querySelector(`#act-${tid}`);
            actBox.innerHTML = `
                <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
                <button class="btn btn-del" data-action="del-trained">❌</button>`;
            fetchTasks();
            return;
        }
        if (act === 'save') {
            if (!t.clicks || t.clicks.length === 0) {
                actionBtn.classList.add('btn-warn');
                actionBtn.textContent = '⚠️ Pehle Select Karo!';
                setTimeout(() => { actionBtn.classList.remove('btn-warn'); actionBtn.textContent = 'Save & Train'; }, 1000);
                return;
            }
            sendToServer(tid, actionBtn, card);
            return;
        }
        if (act === 'reset') {
            t.clicks = [];
            card.querySelectorAll('.g-img').forEach(img => img.classList.remove('selected', 'ai-pick', 'retrain-pick'));
            card.querySelectorAll('.dot').forEach(d => d.remove());
            card.classList.remove('ai-processing');
            // AI suggestion button style bhi reset karo
            let saveBtn = card.querySelector('.btn-save');
            if (saveBtn) { saveBtn.style.background = ''; saveBtn.textContent = 'Save & Train'; saveBtn.disabled = false; }
            return;
        }
        if (act === 'del') {
            ghostBlocker.add(tid); card.remove(); delete activeTasksStore[tid];
            updateCountsDisplay();
            fetch(`${SERVER_URL}/api/delete-hcaptcha/${tid}`, { method: 'DELETE' }).catch(()=>{});
            return;
        }
        if (act === 'del-trained') {
            deleteTrained(tid);
            return;
        }
    }
    if (isTrainedCard && !isInRetrain) return;
    if (e.target.classList.contains('g-img')) {
        // Broken/expired images ko ignore karo — click na lena
        if (e.target.classList.contains('img-broken')) return;
        let idx = parseInt(e.target.dataset.index);
        if (e.target.classList.contains('selected') || e.target.classList.contains('retrain-pick') || e.target.classList.contains('ai-pick')) {
            e.target.classList.remove('selected', 'ai-pick', 'retrain-pick');
            t.clicks = t.clicks.filter(i => i !== idx);
        } else {
            e.target.classList.add('selected');
            if (isInRetrain) e.target.classList.add('retrain-pick');
            t.clicks.push(idx);
        }
    } else if (e.target.classList.contains('s-img')) {
        let img = e.target;
        let rect = img.getBoundingClientRect();
        let nw = img.naturalWidth || 400, nh = img.naturalHeight || 300;
        let containerRatio = rect.width / rect.height, imageRatio = nw / nh;
        let actualW = rect.width, actualH = rect.height, offsetX = 0, offsetY = 0;
        if (containerRatio > imageRatio) {
            actualW = rect.height * imageRatio; offsetX = (rect.width - actualW) / 2;
        } else {
            actualH = rect.width / imageRatio; offsetY = (rect.height - actualH) / 2;
        }
        let clickX = e.clientX - rect.left - offsetX, clickY = e.clientY - rect.top - offsetY;
        if (clickX < 0 || clickX > actualW || clickY < 0 || clickY > actualH) return;
        let px = Math.max(0, Math.min(100, (clickX / actualW) * 100));
        let py = Math.max(0, Math.min(100, (clickY / actualH) * 100));
        t.clicks.push({ px, py });
        let dot = document.createElement('div');
        dot.className = 'dot' + (isInRetrain ? ' retrain-dot' : '');
        dot.style.left = `${((e.clientX - rect.left) / rect.width) * 100}%`;
        dot.style.top = `${((e.clientY - rect.top) / rect.height) * 100}%`;
        img.parentElement.appendChild(dot);
    }
});

function deleteTrained(taskId) {
    fetch(`${SERVER_URL}/api/delete-hcaptcha/${taskId}`, { method: 'DELETE' }).then(() => fetchTasks());
}

// Auto Save ke liye — submit karta hai server ko, TRAIN NAHI KARTA
function sendToServerNoTrain(taskId, card) {
    let t = activeTasksStore[taskId];
    if (!t || !t.clicks || t.clicks.length === 0) return;
    fetch(`${SERVER_URL}/api/submit-hcaptcha`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ taskId, clicks: t.clicks })
    }).catch(()=>{});
    ghostBlocker.add(taskId);
    if (card) card.remove();
    delete activeTasksStore[taskId];
    updateCountsDisplay();
    // trainAIBrainAsync nahi — seedha return
}

// Manual Save ke liye — submit bhi karta hai, TRAIN BHI KARTA HAI
function sendToServer(taskId, btnEl, card) {
    let t = activeTasksStore[taskId];
    if (!t || !t.clicks || t.clicks.length === 0) {
        if (card) card.classList.remove('ai-processing');
        return;
    }
    // Button reset karo agar AI suggestion wala style tha
    if (btnEl) {
        btnEl.style.background = '';
        btnEl.textContent = '✅ Saving...';
        btnEl.disabled = true;
    }
    fetch(`${SERVER_URL}/api/submit-hcaptcha`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ taskId, clicks: t.clicks })
    }).catch(()=>{});
    ghostBlocker.add(taskId);
    // Training pehle, phir card remove — task ka data rakho
    if (isAIReady && t.type === 'grid' && t.clicks.length > 0) {
        trainAIBrainAsync(t);
    }
    if (card) card.remove();
    delete activeTasksStore[taskId];
    updateCountsDisplay();
}

function filterTasks() {
    let f = document.getElementById('searchInput').value.toLowerCase().replace('#', '');
    document.querySelectorAll('.task-card').forEach(c => {
        c.style.display = c.dataset.id.toLowerCase().includes(f) ? "" : "none";
    });
}

setInterval(() => {
    videoTasks.forEach(vt => {
        let el = document.querySelector(`.vid-player[data-id="${vt.id}"]`);
        if (el && vt.frames?.length > 0) {
            vt.current = (vt.current + 1) % vt.frames.length;
            el.src = vt.frames[vt.current];
        }
    });
}, 150);

initWS();
fetchTasks();
setTimeout(initAI, 100);
