<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>hCaptcha Master Pro</title>
<style>
*{box-sizing:border-box}
body{background:#121212;color:#fff;font-family:Arial,sans-serif;margin:0;padding:16px}
.hdr{background:#1e1e1e;padding:12px 16px;border-bottom:3px solid #00ff88;margin-bottom:16px;position:sticky;top:0;z-index:100;display:flex;flex-direction:column;gap:10px}
.hdr-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:18px;color:#00ff88}
.tabs{display:flex;gap:8px}
.tb{background:#333;color:#ccc;border:2px solid #444;padding:8px 16px;font-size:14px;font-weight:bold;cursor:pointer;border-radius:4px}
.tb.on{background:#00ff88;color:#000;border-color:#00ff88}
.cnt{background:#000;color:#fff;padding:1px 7px;border-radius:10px;margin-left:5px;font-size:12px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:bold;padding:3px 9px;border-radius:20px;background:#1a1a1a;border:1px solid #444;transition:all .3s}
.pill.ok{border-color:#00ff88;color:#00ff88}
.pill.warn{border-color:#ffaa00;color:#ffaa00}
.pill.err{border-color:#ff4444;color:#ff4444}
.tog{padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;border:2px solid #555;background:#333;color:#888;transition:all .2s}
.tog.on{background:#00ff88;color:#000;border-color:#00ff88}
.wbadge{background:#1a3a2a;border:1px solid #00ff88;color:#00ff88;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer}
.srch input{width:100%;padding:10px;background:#222;border:1px solid #444;color:#00ff88;border-radius:4px;font-size:14px;font-weight:bold;outline:none}
.srch input::placeholder{color:#666;font-weight:normal}
.grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.card{background:#1e1e1e;min-width:460px;flex:1;max-width:640px;padding:14px;border:1px solid #333;border-radius:6px;transition:border-color .2s}
.card.ai-on{border-color:#ff00ff;box-shadow:0 0 8px rgba(255,0,255,.3)}
.card.claimed{opacity:.4;pointer-events:none}
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.cid{color:#ff4444;font-family:monospace;font-size:14px;font-weight:bold}
.cbadge{font-size:10px;padding:2px 6px;border-radius:3px;background:#1a1a1a;color:#888;border:1px solid #444}
.cbadge.mine{background:#002200;color:#00ff88;border-color:#00ff88}
.pcon{display:flex;align-items:center;gap:9px;margin-bottom:11px;background:#222;padding:7px;border-radius:5px;border:1px solid #333}
.ewrap{flex-shrink:0;width:52px;height:52px}
.eimg{width:52px;height:52px;object-fit:cover;border-radius:4px;border:1px solid #555;display:block}
.eph{width:52px;height:52px;border-radius:4px;background:#2a2a2a;border:1px dashed #555;display:flex;align-items:center;justify-content:center;font-size:18px}
.prompt{color:#fff;font-size:13px;font-weight:bold;margin:0;line-height:1.4;flex:1}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.ig img{width:100%;height:135px;object-fit:cover;cursor:pointer;border:4px solid transparent;background:#222;transition:border-color .15s}
.ig img.sel{border-color:#00ff88;opacity:.75}
.ig img.aip{border-color:#ff00ff}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ig img:not([src]),.ig img[src=""]{background:linear-gradient(90deg,#1a1a1a 25%,#2d2d2d 50%,#1a1a1a 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tg img{width:100%;height:95px;object-fit:cover;border:3px solid #333;background:#222}
.tg img.ck{border-color:#00ff88}
.tg img.rp{border-color:#ff8800;cursor:pointer}
.sbox{position:relative;width:100%;cursor:crosshair;display:flex;justify-content:center;background:#000;border-radius:4px;border:2px solid #444;overflow:hidden}
.sbox img{width:100%;height:auto;min-height:420px;max-height:580px;object-fit:contain;display:block}
.dot{position:absolute;width:16px;height:16px;background:#00ff88;border:2px solid #000;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.noimg{background:#111;color:#888;padding:18px;text-align:center;border-radius:4px;border:1px dashed #444;font-size:12px}
.acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.btn{flex:1;padding:11px;border:none;font-weight:bold;cursor:pointer;color:#fff;font-size:13px;border-radius:4px;transition:opacity .2s}
.bsv{background:#00ff88;color:#000}
.brs{background:#555}
.bdl{background:#ff4444;flex:.3}
.brt{background:#ff8800;color:#000}
.bcf{background:#ff8800;color:#000}
.bcn{background:#555}
.bdis{background:#222;color:#555;cursor:not-allowed}
.rhint{font-size:11px;color:#ff8800;margin-top:5px;padding:5px 9px;background:#1a0f00;border-radius:4px}
.pag{display:flex;align-items:center;gap:7px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.pb{background:#333;color:#ccc;border:1px solid #555;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.pb.ap{background:#00ff88;color:#000;border-color:#00ff88;font-weight:bold}
.pb:disabled{opacity:.4;cursor:not-allowed}
.pi{color:#666;font-size:11px}
.empty{text-align:center;padding:50px;color:#555;font-size:16px;width:100%}
@keyframes fn{0%{border-color:#00ff88;box-shadow:0 0 12px #00ff88}100%{border-color:#333;box-shadow:none}}
.card.nf{animation:fn 1.5s ease-out}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-top">
    <h1>hCaptcha Master Pro 🤖</h1>
    <div class="tabs">
      <button class="tb on" id="bt-pending" onclick="setTab('pending')">Pending <span class="cnt" id="cp">0</span></button>
      <button class="tb" id="bt-trained" onclick="setTab('trained')">Trained <span class="cnt" id="ct">0</span></button>
    </div>
  </div>
  <div class="bar">
    <span class="pill warn" id="wsP">🔌 Connecting...</span>
    <span class="pill warn" id="aiP">🧠 AI Loading...</span>
    <button id="bat" class="tog on" onclick="toggleAT()">🧠 Auto Train: ON</button>
    <button id="bas" class="tog on" onclick="toggleAS()">💾 Auto Save: ON</button>
    <span class="wbadge" id="wb" onclick="chgW()">👤 W-?</span>
    <span class="pi" id="oc"></span>
  </div>
  <div class="srch"><input type="text" id="si" oninput="onSrch()" placeholder="🔍 Task ID ya prompt search..."/></div>
</div>
<div id="pt" class="pag" style="display:none"></div>
<div class="grid" id="ta"></div>
<div id="pb2" class="pag" style="display:none"></div>

<script>
const SRV = location.protocol==='file:'
    ? (localStorage.getItem('hcm_srv')||'https://h-production-2c01.up.railway.app')
    : location.origin;
const WS_URL = SRV.replace(/^http/,'ws') + '/ws';
const PG = 20;

// Worker ID
let WID = localStorage.getItem('hcm_wid');
if (!WID) { WID='W-'+Math.random().toString(36).slice(2,5).toUpperCase(); localStorage.setItem('hcm_wid',WID); }
document.getElementById('wb').textContent = '👤 '+WID;
function chgW(){ let n=prompt('Worker ID:',WID); if(n?.trim()){WID=n.trim().toUpperCase();localStorage.setItem('hcm_wid',WID);document.getElementById('wb').textContent='👤 '+WID;} }

// State — Default Auto Train & Auto Save ON
const ta = document.getElementById('ta');
let tab='pending', pg=0, tpg=1, ttl=0;
let pcache={}, store={}, vtasks=[], ghost=new Set(), claimed=new Set(), sq='';
let atOn=true, asOn=true, rts={}, fetching=false;
let autoSaveTimers = {};

// BroadcastChannel
let bc=null; try{bc=new BroadcastChannel('hcm_v2');}catch(e){}
if(bc) bc.onmessage = ev => {
    let {type,taskId,workerId}=ev.data||{};
    if(type==='claimed'&&workerId!==WID){
        let c=document.querySelector(`.card[data-id="${taskId}"]`);
        if(c&&tab==='pending'){c.classList.add('claimed');let b=c.querySelector('.cbadge');if(b){b.textContent=workerId;b.className='cbadge';}}
    }
    if(type==='saved'||type==='deleted'){
        delete pcache[taskId]; ghost.add(taskId);
        document.querySelector(`.card[data-id="${taskId}"]`)?.remove();
        delete store[taskId];
    }
};
function bcs(d){ try{bc?.postMessage(d);}catch(e){} }

// WebSocket
let ws=null, wrt=null, wpt=null;
function wsConn(){
    if(ws&&ws.readyState<2) return;
    try{ ws=new WebSocket(WS_URL); }catch(e){ wsRec(); return; }
    ws.onopen = () => {
        setPill('wsP','ok','🟢 Live');
        clearTimeout(wrt);
        ws.send(JSON.stringify({action:'dashboard'}));
        wpt = setInterval(()=>{ try{ws.send(JSON.stringify({type:'ping'}));}catch(e){} }, 25000);
    };
    ws.onmessage = ev => { try{ handleWS(JSON.parse(ev.data)); }catch(e){} };
    ws.onclose = ws.onerror = () => {
        setPill('wsP','warn','🔴 Reconnecting...');
        clearInterval(wpt); wsRec();
    };
}
function wsRec(){ clearTimeout(wrt); wrt=setTimeout(wsConn,3000); }
function handleWS(m){
    if(m.type==='counts'){
        document.getElementById('cp').innerText = m.data.pending||0;
        document.getElementById('ct').innerText = m.data.trained||0;
        if(m.data.browsers!==undefined) document.getElementById('oc').textContent = `🌐 ${m.data.browsers} browsers | 👥 ${m.data.dashboards} dashboards`;
    }
    if(m.type==='new_pending' && !ghost.has(m.data.id) && !pcache[m.data.id]){
        pcache[m.data.id] = m.data;
        if(tab==='pending') addCard(m.data.id, m.data, true);
    }
    if(m.type==='task_solved'||m.type==='task_deleted'){
        let tid=m.data.taskId; ghost.add(tid); delete pcache[tid];
        document.querySelector(`.card[data-id="${tid}"]`)?.remove();
        delete store[tid];
    }
}
function setPill(id,cls,txt){ let e=document.getElementById(id); e.className='pill '+cls; e.textContent=txt; }

// AI SharedWorker
let aiW=null, aiReady=false, aiCbs=new Map();
function initAI(){
    try{
        aiW = new SharedWorker('ai-worker.js',{name:'hcm-ai'});
        aiW.port.start();
        aiW.port.onmessage  = ev => handleAI(ev.data);
        aiW.port.onerror    = ()  => setPill('aiP','err','⚠️ AI Error');
        aiW.port.postMessage({type:'get_status'});
    }catch(e){ setPill('aiP','err','⚠️ SharedWorker N/A'); }
}
function handleAI(m){
    if(m.type==='status'){ aiReady=m.ready; setPill('aiP',m.ready?'ok':'warn',m.text); if(m.ready&&atOn) reeval(); }
    if(m.type==='predict_result'){ let cb=aiCbs.get(m.taskId); if(cb){cb(m.clicks||[]);aiCbs.delete(m.taskId);} }
    if(m.type==='trained'&&atOn) reeval();
}
function aiTrain(task,wrong){ if(!aiW)return; aiW.port.postMessage({type:'train',task,wrongIndices:wrong||[]}); }
function aiPredict(task){
    return new Promise(r=>{
        if(!aiW||!aiReady) return r([]);
        aiCbs.set(task.id,r);
        aiW.port.postMessage({type:'predict',task});
        setTimeout(()=>{ if(aiCbs.has(task.id)){aiCbs.delete(task.id);r([]);} },8000);
    });
}
function toggleAT(){ atOn=!atOn; let b=document.getElementById('bat'); b.className='tog'+(atOn?' on':''); b.textContent='🧠 Auto Train: '+(atOn?'ON':'OFF'); if(atOn&&aiReady) reeval(); }
function toggleAS(){ asOn=!asOn; let b=document.getElementById('bas'); b.className='tog'+(asOn?' on':''); b.textContent='💾 Auto Save: '+(asOn?'ON':'OFF'); }

async function reeval(){
    for(let id in store){
        let t=store[id];
        if(tab==='pending' && t.type==='grid' && !t.clicks.length) {
            await applyAI(t);
        }
    }
}

async function applyAI(task){
    let clicks = await aiPredict(task);
    if(!clicks.length || clicks.length > 6) return;
    task.clicks = clicks;
    let card = document.querySelector(`.card[data-id="${task.id}"]`);
    if(!card) return;
    card.classList.add('ai-on');
    clicks.forEach(idx => {
        let img = card.querySelector(`.gi[data-index="${idx}"]`);
        if(img){ img.classList.remove('sel'); img.classList.add('aip'); }
    });

    // 2.5s safe correction window before saving
    if(asOn){
        let btn = card.querySelector('.bsv');
        if(btn){ btn.style.background='#ff00ff'; btn.textContent='🤖 Auto Saving in 2s...'; }
        if(autoSaveTimers[task.id]) clearTimeout(autoSaveTimers[task.id]);
        autoSaveTimers[task.id] = setTimeout(() => {
            saveTo(task.id, btn, card);
        }, 2200);
    }
}

// Retrain
function startRT(tid){
    let t=store[tid]; if(!t) return;
    let card=document.querySelector(`.card[data-id="${tid}"]`); if(!card) return;
    rts[tid]={old:[...(t.clicks||[])],nw:[]};
    card.querySelectorAll('.tg img').forEach(img=>{
        img.classList.add('rp');
        img.onclick=()=>{
            let idx=parseInt(img.dataset.index),st=rts[tid];
            if(st.nw.includes(idx)){st.nw=st.nw.filter(x=>x!==idx);img.classList.remove('ck');}
            else{st.nw.push(idx);img.classList.add('ck');}
        };
    });
    let h=document.createElement('div'); h.className='rhint'; h.id='rh-'+tid; h.textContent='🟠 Sahi images click karo → Confirm dabao';
    card.querySelector('.acts').before(h);
    card.querySelector('.acts').innerHTML=`<button class="btn bcf" onclick="cfRT('${tid}')">✅ Confirm</button><button class="btn bcn" onclick="cnRT('${tid}')">❌ Cancel</button>`;
}
async function cfRT(tid){
    let t=store[tid],st=rts[tid]; if(!t||!st) return;
    let wrong=(st.old||[]).filter(i=>!st.nw.includes(i)); t.clicks=st.nw;
    let card=document.querySelector(`.card[data-id="${tid}"]`);
    if(card){let h=card.querySelector('#rh-'+tid);if(h)h.textContent='🧠 AI seekh raha hai...';}
    aiTrain(t,wrong);
    await fetch(`${SRV}/api/submit-hcaptcha`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskId:tid,clicks:st.nw})}).catch(()=>{});
    delete rts[tid];
    if(card){
        let h=card.querySelector('#rh-'+tid);if(h)h.remove();
        card.querySelector('.acts').innerHTML=`<button class="btn bsv">Update</button><button class="btn brt" onclick="startRT('${tid}')">🔧 Retrain</button><button class="btn bdl">❌</button>`;
    }
}
function cnRT(tid){
    delete rts[tid]; let card=document.querySelector(`.card[data-id="${tid}"]`); if(!card) return;
    let h=card.querySelector('#rh-'+tid); if(h) h.remove();
    card.querySelectorAll('.tg img').forEach(img=>{img.classList.remove('rp');img.onclick=null;});
    card.querySelector('.acts').innerHTML=`<button class="btn bsv">Update</button><button class="btn brt" onclick="startRT('${tid}')">🔧 Retrain</button><button class="btn bdl">❌</button>`;
}

// Fetch
async function fetchPending(){
    if(fetching) return; fetching=true;
    try{
        let r=await fetch(`${SRV}/api/tasks?tab=pending&page=0&size=200&t=${Date.now()}`,{cache:'no-store'});
        if(r.ok){ let d=await r.json(); pcache={}; for(let id in(d.tasks||{})) if(!ghost.has(id)) pcache[id]=d.tasks[id]; renderPending(); document.getElementById('cp').innerText=Object.keys(pcache).length; }
    }catch(e){}
    fetching=false;
}
async function fetchTrained(page){
    if(fetching) return; fetching=true;
    try{
        let r=await fetch(`${SRV}/api/tasks?tab=trained&page=${page}&size=${PG}&t=${Date.now()}`,{cache:'no-store'});
        if(r.ok){ let d=await r.json(); pg=d.page||0; tpg=d.pages||1; ttl=d.total||0; document.getElementById('ct').innerText=ttl; renderTrained(d.tasks||{}); renderPag(); }
    }catch(e){}
    fetching=false;
}

// Render
function renderPending(){
    ta.innerHTML=''; store={}; vtasks=[];
    let frag=document.createDocumentFragment(), q=sq.toLowerCase(), cnt=0;
    for(let id in pcache){
        if(ghost.has(id)) continue;
        if(q&&!id.includes(q)&&!(pcache[id].prompt||'').toLowerCase().includes(q)) continue;
        let td=pcache[id], m=td.media||[], isG=m.length>1;
        store[id]={id,clicks:[],type:isG?'grid':'coord',media:m,prompt:td.prompt||''};
        let card=mkCard(store[id]); if(card){frag.appendChild(card);cnt++;}
        if(aiReady&&atOn&&isG) applyAI(store[id]);
    }
    ta.appendChild(frag);
    if(!cnt) ta.innerHTML='<div class="empty">✅ Koi pending task nahi!</div>';
    hidePag();
}
function addCard(id,td,flash=false){
    if(ghost.has(id)||store[id]||tab!=='pending') return;
    let q=sq.toLowerCase();
    if(q&&!id.includes(q)&&!(td.prompt||'').toLowerCase().includes(q)) return;
    let m=td.media||[], isG=m.length>1;
    store[id]={id,clicks:[],type:isG?'grid':'coord',media:m,prompt:td.prompt||''};
    let card=mkCard(store[id]); if(!card) return;
    if(flash) card.classList.add('nf');
    let es=ta.querySelector('.empty'); if(es) es.remove();
    ta.prepend(card);
    if(aiReady&&atOn&&isG) applyAI(store[id]);
}
function renderTrained(tasks){
    ta.innerHTML=''; store={}; vtasks=[];
    let frag=document.createDocumentFragment(), cnt=0;
    for(let id in tasks){
        if(ghost.has(id)) continue;
        let td=tasks[id], m=td.media||[], c=td.clicks||[], isG=m.length>1;
        store[id]={id,clicks:c,type:isG?'grid':'coord',media:m,prompt:td.prompt||''};
        let card=mkCard(store[id]); if(card){frag.appendChild(card);cnt++;}
    }
    ta.appendChild(frag);
    if(!cnt) ta.innerHTML='<div class="empty">📭 Kuch nahi</div>';
}
function renderPag(){
    if(tpg<=1){hidePag();return;}
    let h=`<button class="pb" onclick="goPg(${pg-1})" ${pg===0?'disabled':''}>← Prev</button>`;
    let s=Math.max(0,pg-3),e=Math.min(tpg-1,pg+3);
    if(s>0) h+=`<button class="pb" onclick="goPg(0)">1</button><span class="pi">…</span>`;
    for(let p=s;p<=e;p++) h+=`<button class="pb ${p===pg?'ap':''}" onclick="goPg(${p})">${p+1}</button>`;
    if(e<tpg-1) h+=`<span class="pi">…</span><button class="pb" onclick="goPg(${tpg-1})">${tpg}</button>`;
    h+=`<button class="pb" onclick="goPg(${pg+1})" ${pg>=tpg-1?'disabled':''}>Next →</button><span class="pi">${ttl} total</span>`;
    ['pt','pb2'].forEach(pid=>{ let el=document.getElementById(pid); el.innerHTML=h; el.style.display='flex'; });
}
function hidePag(){ ['pt','pb2'].forEach(pid=>{ document.getElementById(pid).style.display='none'; }); }
function goPg(p){ if(p<0||p>=tpg) return; window.scrollTo(0,0); fetchTrained(p); }

// Tab & Search
function setTab(t){
    tab=t; pg=0; sq='';
    document.getElementById('si').value='';
    document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
    document.getElementById('bt-'+t).classList.add('on');
    ta.innerHTML=''; store={}; vtasks=[]; hidePag();
    t==='pending' ? renderPending() : fetchTrained(0);
}
let _st=null;
function onSrch(){
    sq=document.getElementById('si').value.trim();
    clearTimeout(_st); _st=setTimeout(()=>{
        if(tab==='pending') renderPending();
        else document.querySelectorAll('.card').forEach(c=>{
            let q=sq.toLowerCase().replace('#','');
            c.style.display=(!q||c.dataset.id.includes(q)||(c.dataset.prompt||'').includes(q))?'':'none';
        });
    },300);
}

// Card builder
function su(u){ if(!u)return''; u=u.trim(); if(u.startsWith('data:image/'))return u; if(/^https?:\/\//.test(u))return u.replace(/"/g,'&quot;'); return''; }
function mkCard(t){
    let ip=tab==='pending';
    let card=document.createElement('div');
    card.className='card'; card.dataset.id=t.id;
    card.dataset.prompt=(t.prompt||'').split('|||')[0].substring(0,60);
    let pts=t.prompt.split('|||'), ex=su(pts[1]||'');
    let exH=ex?`<img src="${ex}" class="eimg"><div class="eph" style="display:none">🖼️</div>`:`<div class="eph">🖼️</div>`;
    let mE=!t.media.length||t.media.every(m=>!m.thumb&&!m.src&&!m.frames);
    let mH='';
    if(mE){ mH=`<div class="noimg">⚠️ Images nahi — Clicks: ${t.clicks.length}</div>`; }
    else if(t.type==='grid'){
        if(ip){ mH='<div class="ig">'; t.media.forEach(m=>{ mH+=`<img src="${m.thumb||m.src||''}" class="gi${t.clicks.includes(m.index)?' sel':''}" data-index="${m.index}" draggable="false" loading="lazy" onerror="this.style.opacity='.3'">`; }); mH+='</div>'; }
        else{ mH='<div class="tg">'; t.media.forEach(m=>{ mH+=`<img src="${m.thumb||m.src||''}" class="${t.clicks.includes(m.index)?'ck':''}" data-index="${m.index}" loading="lazy" onerror="this.style.opacity='.2'" title="${t.clicks.includes(m.index)?'✅':'❌'}">`; }); mH+='</div>'; }
    } else {
        let m=t.media[0], isV=m.type==='video_frames'&&m.frames?.length>0, src=isV?m.frames[0]:(m.src||'');
        mH=`<div class="sbox"><img src="${src}" class="si${isV?' vp':''}" data-id="${t.id}" draggable="false" loading="lazy">`;
        t.clicks.forEach(pt=>{ mH+=`<div class="dot" style="left:${pt.px}%;top:${pt.py}%"></div>`; });
        mH+='</div>';
        if(isV) vtasks.push({id:t.id,frames:m.frames,cur:0});
    }
    let cl=claimed.has(t.id);
    let cbH=ip?`<span class="cbadge${cl?' mine':''}" id="cb-${t.id}">${cl?WID:'---'}</span>`:'';
    let aH=ip
        ?`<button class="btn bsv">Save Task</button>${!mE?`<button class="btn brs">Clear</button>`:''}<button class="btn bdl">❌</button>`
        :`${!mE?`<button class="btn bsv">Update</button><button class="btn brt" onclick="startRT('${t.id}')">🔧 Retrain</button>`:`<button class="btn bdis" disabled>No Update</button>`}<button class="btn bdl">❌</button>`;
    card.innerHTML=`
    <div class="chead"><span class="cid">#${t.id.substring(0,8)}</span><div style="display:flex;gap:5px;align-items:center">${cbH}${!ip?`<span style="font-size:10px;color:#666">${t.clicks.length} clicks</span>`:''}</div></div>
    <div class="pcon"><div class="ewrap">${exH}</div><div class="prompt">${pts[0]}</div></div>
    ${mH}<div class="acts">${aH}</div>`;
    return card;
}

// Video player
setInterval(()=>{ vtasks.forEach(vt=>{ let el=document.querySelector(`.vp[data-id="${vt.id}"]`); if(el&&vt.frames?.length>0){vt.cur=(vt.cur+1)%vt.frames.length;el.src=vt.frames[vt.cur];} }); },200);

// Click handler
const _sv=new Set();
ta.addEventListener('click', e => {
    let card=e.target.closest('.card'); if(!card) return;
    let tid=card.dataset.id, t=store[tid]; if(!t) return;
    if(rts[tid]&&!e.target.classList.contains('bcf')&&!e.target.classList.contains('bcn')) return;
    if(tab==='pending'&&!claimed.has(tid)){
        claimed.add(tid); bcs({type:'claimed',taskId:tid,workerId:WID});
        let b=document.getElementById('cb-'+tid); if(b){b.textContent=WID;b.className='cbadge mine';}
    }
    if(e.target.classList.contains('gi')){
        // User manual correction: cancel pending auto-save timer
        if(autoSaveTimers[tid]) { clearTimeout(autoSaveTimers[tid]); delete autoSaveTimers[tid]; }
        let btn = card.querySelector('.bsv');
        if(btn) { btn.style.background='#00ff88'; btn.textContent='Save Task'; }

        let idx=parseInt(e.target.dataset.index);
        if(e.target.classList.contains('sel')||e.target.classList.contains('aip')){
            e.target.classList.remove('sel','aip');
            t.clicks=t.clicks.filter(i=>i!==idx);
        } else {
            e.target.classList.add('sel');
            t.clicks.push(idx);
        }
    } else if(e.target.classList.contains('si')){
        let r=e.target.getBoundingClientRect(), x=((e.clientX-r.left)/r.width)*100, y=((e.clientY-r.top)/r.height)*100;
        t.clicks.push({px:x,py:y});
        let d=document.createElement('div'); d.className='dot'; d.style.left=`${x}%`; d.style.top=`${y}%`;
        e.target.parentElement.appendChild(d);
    } else if(e.target.classList.contains('bsv')){ 
        if(autoSaveTimers[tid]) { clearTimeout(autoSaveTimers[tid]); delete autoSaveTimers[tid]; }
        saveTo(tid,e.target,card); 
    }
    else if(e.target.classList.contains('brs')){ 
        if(autoSaveTimers[tid]) { clearTimeout(autoSaveTimers[tid]); delete autoSaveTimers[tid]; }
        t.clicks=[]; card.querySelectorAll('.gi').forEach(i=>i.classList.remove('sel','aip')); card.querySelectorAll('.dot').forEach(d=>d.remove()); card.classList.remove('ai-on'); 
    }
    else if(e.target.classList.contains('bdl')){ 
        if(autoSaveTimers[tid]) { clearTimeout(autoSaveTimers[tid]); delete autoSaveTimers[tid]; }
        ghost.add(tid); card.remove(); delete store[tid]; delete pcache[tid]; bcs({type:'deleted',taskId:tid,workerId:WID}); fetch(`${SRV}/api/delete-hcaptcha/${tid}`,{method:'DELETE'}).catch(()=>{}); 
    }
});

async function saveTo(taskId,btn,card){
    if(_sv.has(taskId)) return; _sv.add(taskId);
    let t=store[taskId]; if(!t){_sv.delete(taskId);return;}
    try{
        if(aiReady&&tab==='pending'&&t.clicks.length>0){ 
            if(btn){btn.textContent='🧠 Learning...';btn.disabled=true;} 
            aiTrain(t); 
            // 1 task train hotay hi bache hue tasks ko foran auto-solve karo
            setTimeout(() => { if(atOn) reeval(); }, 500);
        }
        if(tab==='pending'){ 
            ghost.add(taskId); 
            setTimeout(()=>ghost.delete(taskId),4000); 
            if(card)card.remove(); 
            delete store[taskId]; 
            delete pcache[taskId]; 
            bcs({type:'saved',taskId,workerId:WID}); 
        }
        else{ 
            if(btn){btn.textContent='Updated!';setTimeout(()=>{if(btn){btn.textContent='Update';btn.disabled=false;}},1200);} 
        }
        await fetch(`${SRV}/api/submit-hcaptcha`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskId,clicks:t.clicks})});
    }catch(e){ 
        if(btn){btn.textContent='❌ Retry';btn.disabled=false;} 
    }
    finally{ 
        _sv.delete(taskId); 
    }
}

window.addEventListener('error',e=>{ if(e.target?.tagName==='IMG'&&e.target.classList.contains('eimg')){e.target.style.display='none';if(e.target.nextElementSibling)e.target.nextElementSibling.style.display='flex';} },true);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) wsConn(); });

wsConn();
fetchPending();
initAI();
</script>
