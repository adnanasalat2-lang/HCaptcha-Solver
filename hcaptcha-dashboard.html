<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>hCaptcha Master Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0c0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;padding:8px;gap:8px}
.header{background:#161616;padding:7px 12px;border-bottom:2px solid #00ff88;display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:4px;flex-shrink:0}
.header h1{font-size:15px;color:#00ff88}
.header-left{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:4px}
.tab-btn{background:#222;color:#aaa;border:1px solid #333;padding:4px 10px;font-size:12px;font-weight:bold;cursor:pointer;border-radius:4px}
.tab-btn.active{background:#00ff88;color:#000;border-color:#00ff88}
.badge{background:#000;color:#fff;padding:1px 5px;border-radius:6px;font-size:11px;margin-left:3px}
.ai-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#syncStatus{font-size:11px;color:#ffaa00;font-weight:bold}
#syncStatus.ok{color:#00ff88}
.btn-toggle{padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold;border:1px solid #444;background:#222;color:#888}
.btn-toggle.on{background:#00ff88;color:#000;border-color:#00ff88}
.btn-danger{background:#2a1111;color:#ff6666;border:1px solid #552222;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer}
#searchInput{padding:4px 8px;background:#1a1a1a;border:1px solid #333;color:#00ff88;border-radius:4px;font-size:12px;outline:none;width:110px}
/* AI Progress Bar */
.ai-progress-bar{height:3px;background:#222;border-radius:2px;overflow:hidden;flex:1;min-width:80px;display:none}
.ai-progress-fill{height:100%;background:#ff00ff;width:0%;transition:width 0.2s}
/* Main workspace */
.workspace{display:flex;gap:8px;flex:1;min-height:0}
.column{flex:1;display:flex;flex-direction:column;background:#121212;border:1px solid #222;border-radius:6px;overflow:hidden}
.col-header{padding:5px 10px;background:#181818;border-bottom:1px solid #2c2c2c;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold;flex-shrink:0}
.col-title-grid{color:#00ff88}
.col-title-manual{color:#ff9900}
.stream-count{background:#000;padding:1px 6px;border-radius:6px;font-size:11px;color:#fff}
/* Virtual scroll container */
.task-list{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
/* Task cards */
.task-card{background:#181818;border:1px solid #2c2c2c;border-radius:5px;padding:7px;contain:layout}
.task-card.ai-done{border-color:#ff00ff;box-shadow:0 0 5px rgba(255,0,255,0.2)}
.task-card.in-retrain{border:2px solid #ff8800!important;background:#1f1408!important}
.task-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.task-id{color:#ff5555;font-family:monospace;font-size:11px;font-weight:bold}
.prompt-container{display:flex;align-items:center;gap:5px;margin-bottom:5px;background:#1f1f1f;padding:4px;border-radius:4px;border:1px solid #2a2a2a}
.ex-wrap{flex-shrink:0;width:36px;height:36px}
.example-img{width:36px;height:36px;object-fit:cover;border-radius:3px;border:1px solid #444;display:block}
.example-img-placeholder{width:36px;height:36px;border-radius:3px;background:#252525;border:1px dashed #444;display:flex;align-items:center;justify-content:center;font-size:13px}
.task-prompt{color:#fff;font-size:11px;font-weight:bold;line-height:1.3}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.g-img{width:100%;height:90px;object-fit:cover;cursor:pointer;border:2px solid transparent;background:#222;border-radius:3px;loading:lazy}
.g-img.selected{border-color:#00ff88;opacity:0.85}
.g-img.ai-pick{border-color:#ff00ff;opacity:0.9}
.g-img.retrain-pick{border-color:#ff8800!important}
.single-box{position:relative;width:100%;cursor:crosshair;display:flex;justify-content:center;background:#000;border-radius:4px;border:1px solid #333;overflow:hidden}
.s-img{width:100%;height:auto;min-height:300px;max-height:400px;object-fit:contain;display:block;user-select:none}
.dot{position:absolute;width:13px;height:13px;background:#00ff88;border:2px solid #000;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:10}
.dot.rd{background:#ff8800}
.actions{display:flex;gap:4px;margin-top:5px}
.btn{flex:1;padding:6px;border:none;font-weight:bold;cursor:pointer;color:#fff;font-size:11px;border-radius:3px}
.btn-save{background:#00ff88;color:#000}
.btn-reset{background:#333}
.btn-del{background:#ee4444;flex:0.3}
.btn-retrain{background:#ff8800;color:#000}
.btn-confirm{background:#00ff88;color:#000}
.btn-cancel{background:#444}
.btn-warn{background:#ee2222!important;color:#fff!important}
.retrain-banner{font-size:11px;color:#ff8800;margin-bottom:4px;padding:3px;background:#291705;border-radius:3px;border:1px dashed #ff8800;font-weight:bold;text-align:center}
/* Trained view */
#trainedView{display:none;flex:1;flex-direction:column;background:#121212;border:1px solid #222;border-radius:6px;overflow:hidden}
.trained-container{flex:1;overflow-y:auto;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.pagination-bar{padding:5px 10px;background:#181818;border-top:1px solid #2c2c2c;display:flex;justify-content:space-between;align-items:center;font-size:12px;flex-shrink:0}
/* Scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>⚡ hCaptcha Master Pro</h1>
    <div class="tabs">
      <button class="tab-btn active" id="btn-pending" onclick="setTab('pending')">Pending <span class="badge" id="c-pending">0</span></button>
      <button class="tab-btn" id="btn-trained" onclick="setTab('trained')">Trained <span class="badge" id="c-trained">0</span></button>
    </div>
  </div>
  <div class="ai-bar">
    <span id="syncStatus">🧠 Loading AI...</span>
    <div class="ai-progress-bar" id="aiProgressBar"><div class="ai-progress-fill" id="aiProgressFill"></div></div>
    <button id="btnAutoTrain" class="btn-toggle on" onclick="toggleAutoTrain()">🧠 Auto: ON</button>
    <button id="btnAutoSave" class="btn-toggle on" onclick="toggleAutoSave()">💾 Save: ON</button>
    <button class="btn-danger" onclick="resetAIBrain()">🧹 Reset AI</button>
    <input type="text" id="searchInput" oninput="filterTasks()" placeholder="🔍 Search..."/>
  </div>
</div>

<div class="workspace" id="pendingView">
  <div class="column">
    <div class="col-header">
      <span class="col-title-grid">🤖 AI Grid Stream</span>
      <span class="stream-count" id="c-grid">0 Grids</span>
    </div>
    <div class="task-list" id="gridArea"></div>
  </div>
  <div class="column">
    <div class="col-header">
      <span class="col-title-manual">👷 Manual Stream</span>
      <span class="stream-count" id="c-manual">0 Tasks</span>
    </div>
    <div class="task-list" id="manualArea"></div>
  </div>
</div>

<div id="trainedView">
  <div class="col-header">
    <span style="color:#00ff88;font-size:13px">🗂️ Trained Database</span>
    <span class="stream-count" id="c-trained-total">0 Solved</span>
  </div>
  <div class="trained-container" id="trainedArea"></div>
  <div class="pagination-bar">
    <button class="btn btn-reset" style="max-width:80px" onclick="prevPage()">⬅️ Prev</button>
    <span id="pageInfo">Page 1 / 1</span>
    <button class="btn btn-reset" style="max-width:80px" onclick="nextPage()">Next ➡️</button>
  </div>
</div>

<script>
const SERVER = location.origin;

// ── State ──
let currentTab = 'pending';
let activeStore = {};
let ghostSet = new Set();
let retrainSet = new Set();
let videoMap = new Map();
let isFetching = false;
let trainedPage = 0;
let totalTrainedPages = 1;
let serverPending = {}, serverTrained = {};

// ── AI State ──
let isAIReady = false, aiModel = null, knn = null;
let autoTrainEnabled = true, autoSaveEnabled = true;
let aiQueue = [];
let aiRunning = false;
let aiBrainData = {};
let brainSaveTimer = null;

// ── AI Init ──
async function initAI() {
    try {
        try { await tf.setBackend('webgl'); } catch(e) { await tf.setBackend('cpu'); }
        await tf.ready();
        aiModel = await mobilenet.load({ version: 2, alpha: 1.0 });
        knn = knnClassifier.create();
        await loadBrain();
        isAIReady = true;
        updateAIStatus();
        // Agar queue mein tasks hain to start karo
        if (aiQueue.length > 0) runAIBatch();
    } catch(e) {
        document.getElementById('syncStatus').textContent = '⚠️ AI Error';
    }
}

function updateAIStatus() {
    if (!knn) return;
    let ds = knn.getClassExampleCount();
    let concepts = Object.keys(ds).filter(k => !k.startsWith('neg_')).length;
    let el = document.getElementById('syncStatus');
    el.textContent = `🤖 AI Ready ✅ (${concepts} concepts)`;
    el.className = 'ok';
}

// ── AI Brain Save/Load ──
async function loadBrain() {
    try {
        let r = await fetch(`${SERVER}/api/ai-brain?t=${Date.now()}`);
        if (!r.ok) return;
        let ser = await r.json();
        if (!ser || !Object.keys(ser).length) return;
        let ds = {};
        for (let k in ser) {
            if (ser[k]?.data && ser[k]?.shape) ds[k] = tf.tensor(ser[k].data, ser[k].shape);
        }
        knn.setClassifierDataset(ds);
    } catch(e) {}
}

function scheduleBrainSave() {
    if (brainSaveTimer) clearTimeout(brainSaveTimer);
    brainSaveTimer = setTimeout(async () => {
        if (!knn) return;
        try {
            let ds = knn.getClassifierDataset();
            let ser = {};
            for (let k in ds) ser[k] = { data: Array.from(ds[k].dataSync()), shape: ds[k].shape };
            await fetch(`${SERVER}/api/ai-brain`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify(ser)
            });
            updateAIStatus();
        } catch(e) {}
    }, 3000);
}

async function resetAIBrain() {
    if (!confirm('Reset AI Brain?')) return;
    await fetch(`${SERVER}/api/ai-brain`, { method: 'DELETE' });
    if (knn) knn.clearAllClasses();
    location.reload();
}

// ── BATCH AI PROCESSING — 1000 tasks ek saath ──
function queueForAI(taskId) {
    if (!aiQueue.includes(taskId)) aiQueue.push(taskId);
    if (isAIReady && autoTrainEnabled && !aiRunning) runAIBatch();
}

async function runAIBatch() {
    if (aiRunning || !isAIReady || !autoTrainEnabled || !aiQueue.length) return;
    aiRunning = true;

    let progressBar = document.getElementById('aiProgressBar');
    let progressFill = document.getElementById('aiProgressFill');
    let totalInBatch = aiQueue.length;
    progressBar.style.display = 'block';

    let processed = 0;
    while (aiQueue.length > 0) {
        let tid = aiQueue.shift();
        let t = activeStore[tid];
        if (t && t.type === 'grid' && (!t.clicks || !t.clicks.length)) {
            await predictTask(t);
        }
        processed++;
        // Progress bar update
        let pct = Math.floor((processed / totalInBatch) * 100);
        progressFill.style.width = pct + '%';
        // Har 5 tasks pe UI yield karo — freeze nahi hogi
        if (processed % 5 === 0) await new Promise(r => requestAnimationFrame(r));
    }

    progressBar.style.display = 'none';
    progressFill.style.width = '0%';
    aiRunning = false;
}

async function predictTask(t) {
    if (!isAIReady || t.type !== 'grid' || !t.media) return;
    let pLabel = t.prompt.split('|||')[0].trim().toLowerCase();
    let ds = knn.getClassExampleCount();
    if (!ds[pLabel] || ds[pLabel] < 1) return;

    let predicted = [];
    for (let m of t.media) {
        let src = m.thumb || m.src;
        if (!src) continue;
        try {
            let img = await loadImg(src);
            if (!img) continue;
            let res = null;
            tf.tidy(() => {
                let feat = aiModel.infer(tf.browser.fromPixels(img), true);
                res = knn.predictClass(feat);
            });
            let r = await res;
            let conf = r.confidences[pLabel] || 0;
            let negConf = r.confidences['neg_' + pLabel] || 0;
            if (r.label === pLabel && conf >= 0.80 && negConf < 0.30) predicted.push(m.index);
            await tf.nextFrame();
        } catch(e) {}
    }

    if (predicted.length >= 2 && predicted.length <= 5) {
        t.clicks = predicted;
        let card = document.querySelector(`.task-card[data-id="${t.id}"]`);
        if (card) {
            card.classList.add('ai-done');
            predicted.forEach(idx => {
                let img = card.querySelector(`.g-img[data-index="${idx}"]`);
                if (img) img.classList.add('ai-pick');
            });
            if (autoSaveEnabled) sendToServer(t.id, card);
        }
    }
}

async function trainTask(task) {
    if (!isAIReady || task.type !== 'grid' || !task.media || !task.clicks?.length) return;
    let pLabel = task.prompt.split('|||')[0].trim().toLowerCase();
    let negLabel = 'neg_' + pLabel;

    for (let m of task.media) {
        let src = m.thumb || m.src;
        if (!src) continue;
        try {
            let img = await loadImg(src);
            if (!img) continue;
            tf.tidy(() => {
                let feat = aiModel.infer(tf.browser.fromPixels(img), true);
                if (task.clicks.includes(m.index)) {
                    // 3x positive examples
                    knn.addExample(feat, pLabel);
                    knn.addExample(feat, pLabel);
                    knn.addExample(feat, pLabel);
                } else {
                    knn.addExample(feat, negLabel);
                }
            });
            await tf.nextFrame();
        } catch(e) {}
    }
    scheduleBrainSave();
    // Naye examples ke baad pending tasks dobara predict karo
    if (autoTrainEnabled) {
        let pendingIds = Object.keys(activeStore).filter(id => {
            let t = activeStore[id];
            return t.type === 'grid' && (!t.clicks || !t.clicks.length) &&
                   t.prompt.split('|||')[0].trim().toLowerCase() === pLabel;
        });
        pendingIds.forEach(id => queueForAI(id));
    }
}

function loadImg(src) {
    return new Promise(res => {
        if (!src) return res(null);
        let img = new Image();
        if (!src.startsWith('data:')) img.crossOrigin = 'anonymous';
        img.onload = () => res(img);
        img.onerror = () => res(null);
        img.src = src;
        setTimeout(() => res(img.complete && img.naturalWidth > 0 ? img : null), 800);
    });
}

// ── Tabs ──
function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + tab).classList.add('active');
    if (tab === 'pending') {
        document.getElementById('pendingView').style.display = 'flex';
        document.getElementById('trainedView').style.display = 'none';
    } else {
        document.getElementById('pendingView').style.display = 'none';
        document.getElementById('trainedView').style.display = 'flex';
        trainedArea.innerHTML = '';
        fetchTrained();
    }
}

function toggleAutoTrain() {
    autoTrainEnabled = !autoTrainEnabled;
    let btn = document.getElementById('btnAutoTrain');
    btn.className = 'btn-toggle' + (autoTrainEnabled ? ' on' : '');
    btn.textContent = '🧠 Auto: ' + (autoTrainEnabled ? 'ON' : 'OFF');
    if (autoTrainEnabled && isAIReady && aiQueue.length) runAIBatch();
}

function toggleAutoSave() {
    autoSaveEnabled = !autoSaveEnabled;
    let btn = document.getElementById('btnAutoSave');
    btn.className = 'btn-toggle' + (autoSaveEnabled ? ' on' : '');
    btn.textContent = '💾 Save: ' + (autoSaveEnabled ? 'ON' : 'OFF');
}

// ── Fetch ──
// ── Poll — har 800ms ──
async function fetchTasks() {
    if (isFetching) return;
    isFetching = true;
    try {
        // Page 0 se saare pending lao — server max 200 deta hai
        let r = await fetch(`${SERVER}/api/tasks?tab=pending&page=0&size=200&t=${Date.now()}`, { cache: 'no-store' });
        if (r.ok) {
            let d = await r.json();
            serverPending = d.tasks || {};
            renderPending();
        }
        // Counts update
        let rc = await fetch(`${SERVER}/api/counts`, { cache: 'no-store' });
        if (rc.ok) {
            let c = await rc.json();
            document.getElementById('c-pending').textContent = c.pending;
            document.getElementById('c-trained').textContent = c.trained;
            document.getElementById('c-trained-total').textContent = c.trained + ' Solved';
        }
    } catch(e) { console.log('Fetch error:', e.message); }
    isFetching = false;
}

async function fetchTrained() {
    try {
        let r = await fetch(`${SERVER}/api/tasks?tab=trained&page=${trainedPage}&t=${Date.now()}`, { cache: 'no-store' });
        if (r.ok) {
            let d = await r.json();
            serverTrained = d.tasks || {};
            totalTrainedPages = d.pages || 1;
            document.getElementById('pageInfo').textContent = `Page ${trainedPage+1} / ${totalTrainedPages}`;
            renderTrained();
        }
    } catch(e) {}
}

function prevPage() { if (trainedPage > 0) { trainedPage--; fetchTrained(); } }
function nextPage() { if (trainedPage + 1 < totalTrainedPages) { trainedPage++; fetchTrained(); } }

// ── Render Pending — Fast DOM update ──
const gridArea = document.getElementById('gridArea');
const manualArea = document.getElementById('manualArea');
const trainedArea = document.getElementById('trainedArea');

function renderPending() {
    let pending = serverPending;
    let gridCount = 0, manualCount = 0;

    // Remove stale cards
    document.querySelectorAll('#pendingView .task-card').forEach(card => {
        let id = card.dataset.id;
        if (!pending[id] || ghostSet.has(id)) {
            card.remove();
            delete activeStore[id];
            videoMap.delete(id);
        }
    });

    let gridFrag = document.createDocumentFragment();
    let manualFrag = document.createDocumentFragment();
    let newGridIds = [];

    for (let id of Object.keys(pending)) {
        if (ghostSet.has(id)) continue;
        let td = pending[id];
        let media = td.media || [];
        let isGrid = media.length > 1;
        if (isGrid) gridCount++; else manualCount++;
        if (activeStore[id]) continue;

        activeStore[id] = { id, clicks: [], type: isGrid ? 'grid' : 'coord', media, prompt: td.prompt || '' };
        let card = buildCard(activeStore[id], false);

        if (isGrid) {
            gridFrag.appendChild(card);
            newGridIds.push(id);
        } else {
            manualFrag.appendChild(card);
        }
    }

    gridArea.appendChild(gridFrag);
    manualArea.appendChild(manualFrag);

    document.getElementById('c-grid').textContent = gridCount + ' Grids';
    document.getElementById('c-manual').textContent = manualCount + ' Tasks';

    // Queue new grid tasks for AI — batch mein
    newGridIds.forEach(id => queueForAI(id));
}

function renderTrained() {
    trainedArea.innerHTML = '';
    let frag = document.createDocumentFragment();
    for (let id of Object.keys(serverTrained)) {
        let td = serverTrained[id];
        activeStore[id] = {
            id, clicks: [...(td.clicks || [])],
            type: td.media?.length > 1 ? 'grid' : 'coord',
            media: td.media || [], prompt: td.prompt || ''
        };
        frag.appendChild(buildCard(activeStore[id], true));
    }
    trainedArea.appendChild(frag);
}

// ── Build Card ──
function buildCard(t, isTrained) {
    let card = document.createElement('div');
    card.className = 'task-card';
    card.dataset.id = t.id;
    if (isTrained) card.style.minWidth = '260px';

    let parts = t.prompt.split('|||');
    let rawEx = parts[1] || '';
    let exSrc = rawEx.startsWith('data:image/') ? rawEx :
                /^https?:\/\//.test(rawEx) ? rawEx.replace(/"/g,'&quot;') : '';
    let exHtml = exSrc
        ? `<img src="${exSrc}" class="example-img" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="example-img-placeholder" style="display:none">🖼️</div>`
        : `<div class="example-img-placeholder">🖼️</div>`;

    let mediaHTML = '';
    if (t.type === 'grid') {
        mediaHTML = '<div class="img-grid">';
        t.media.forEach(m => {
            let sel = t.clicks.includes(m.index) ? ' selected' : '';
            let src = m.thumb || m.src || '';
            mediaHTML += `<img src="${src}" class="g-img${sel}" data-index="${m.index}" draggable="false">`;
        });
        mediaHTML += '</div>';
    } else {
        let m = t.media[0] || {};
        let isVid = m.type === 'video_frames' && m.frames?.length;
        let src = isVid ? m.frames[0] : (m.src || m.thumb || '');
        mediaHTML = `<div class="single-box"><img src="${src}" class="s-img${isVid ? ' vid' : ''}" data-id="${t.id}" draggable="false">`;
        t.clicks.forEach(pt => {
            mediaHTML += `<div class="dot" style="left:${pt.px}%;top:${pt.py}%"></div>`;
        });
        mediaHTML += '</div>';
        if (isVid && !isTrained) videoMap.set(t.id, { frames: m.frames, cur: 0 });
    }

    let actions = isTrained
        ? `<div class="actions" id="act-${t.id}">
            <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
            <button class="btn btn-del" data-action="del-trained">❌</button>
           </div>`
        : `<div class="actions">
            <button class="btn btn-save" data-action="save">Save</button>
            <button class="btn btn-reset" data-action="reset">Clear</button>
            <button class="btn btn-del" data-action="del">❌</button>
           </div>`;

    card.innerHTML = `
        <div class="task-head">
          <span class="task-id">#${t.id.substring(0,6)}</span>
          ${isTrained ? `<span style="font-size:10px;color:#888">${t.clicks.length} clicks</span>` : ''}
        </div>
        <div class="prompt-container"><div class="ex-wrap">${exHtml}</div><div class="task-prompt">${parts[0]}</div></div>
        ${mediaHTML}
        ${actions}`;
    return card;
}

// ── Send to Server ──
function sendToServer(taskId, card) {
    let t = activeStore[taskId];
    if (!t?.clicks?.length) return;
    fetch(`${SERVER}/api/submit-hcaptcha`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ taskId, clicks: t.clicks })
    }).catch(()=>{});
    // Train AI with this solution
    if (isAIReady && t.type === 'grid') trainTask(t);
    ghostSet.add(taskId);
    if (card) card.remove();
    delete activeStore[taskId];
    videoMap.delete(taskId);
}

// ── Click Handler ──
document.body.addEventListener('click', e => {
    let card = e.target.closest('.task-card');
    if (!card) return;
    let tid = card.dataset.id;
    let t = activeStore[tid];
    if (!t) return;
    let isTrainedCard = !!card.closest('#trainedView');
    let isRetrain = retrainSet.has(tid);
    let actionBtn = e.target.closest('[data-action]');

    if (actionBtn) {
        let act = actionBtn.dataset.action;

        if (act === 'save') {
            if (!t.clicks?.length) {
                actionBtn.classList.add('btn-warn'); actionBtn.textContent = '⚠️ Select!';
                setTimeout(() => { actionBtn.classList.remove('btn-warn'); actionBtn.textContent = 'Save'; }, 1000);
                return;
            }
            sendToServer(tid, card); return;
        }
        if (act === 'reset') {
            t.clicks = [];
            card.querySelectorAll('.g-img').forEach(i => i.classList.remove('selected','ai-pick'));
            card.querySelectorAll('.dot').forEach(d => d.remove());
            card.classList.remove('ai-done'); return;
        }
        if (act === 'del') {
            ghostSet.add(tid); card.remove(); delete activeStore[tid]; videoMap.delete(tid);
            fetch(`${SERVER}/api/delete-hcaptcha/${tid}`, { method: 'DELETE' }).catch(()=>{});
            return;
        }
        if (act === 'retrain') {
            retrainSet.add(tid); card.classList.add('in-retrain');
            let banner = document.createElement('div');
            banner.className = 'retrain-banner'; banner.id = `bnr-${tid}`;
            banner.textContent = '🟠 RETRAIN MODE — Select correct images then Update';
            card.querySelector('.prompt-container').after(banner);
            document.getElementById(`act-${tid}`).innerHTML = `
                <button class="btn btn-confirm" data-action="confirm-retrain">✅ Update</button>
                <button class="btn btn-reset" data-action="clear-retrain">Clear</button>
                <button class="btn btn-cancel" data-action="cancel-retrain">Cancel</button>`;
            return;
        }
        if (act === 'confirm-retrain') {
            if (!t.clicks?.length) {
                actionBtn.classList.add('btn-warn'); actionBtn.textContent = '⚠️ Select!';
                setTimeout(() => { actionBtn.classList.remove('btn-warn'); actionBtn.textContent = '✅ Update'; }, 1000);
                return;
            }
            fetch(`${SERVER}/api/submit-hcaptcha`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ taskId: tid, clicks: t.clicks })
            }).then(() => {
                if (isAIReady && t.type === 'grid') trainTask(t);
                retrainSet.delete(tid); card.classList.remove('in-retrain');
                let b = document.getElementById(`bnr-${tid}`); if (b) b.remove();
                document.getElementById(`act-${tid}`).innerHTML = `
                    <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
                    <button class="btn btn-del" data-action="del-trained">❌</button>`;
                fetchTrained();
            }); return;
        }
        if (act === 'clear-retrain') {
            t.clicks = [];
            card.querySelectorAll('.g-img').forEach(i => i.classList.remove('selected','ai-pick','retrain-pick'));
            card.querySelectorAll('.dot').forEach(d => d.remove()); return;
        }
        if (act === 'cancel-retrain') {
            retrainSet.delete(tid); card.classList.remove('in-retrain');
            let b = document.getElementById(`bnr-${tid}`); if (b) b.remove();
            document.getElementById(`act-${tid}`).innerHTML = `
                <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
                <button class="btn btn-del" data-action="del-trained">❌</button>`;
            fetchTrained(); return;
        }
        if (act === 'del-trained') {
            fetch(`${SERVER}/api/delete-hcaptcha/${tid}`, { method: 'DELETE' }).then(() => fetchTrained());
            card.remove(); delete activeStore[tid]; return;
        }
    }

    if (isTrainedCard && !isRetrain) return;

    // Grid image click
    if (e.target.classList.contains('g-img')) {
        let idx = parseInt(e.target.dataset.index);
        let cls = e.target.classList;
        if (cls.contains('selected') || cls.contains('retrain-pick') || cls.contains('ai-pick')) {
            cls.remove('selected','ai-pick','retrain-pick');
            t.clicks = t.clicks.filter(i => i !== idx);
        } else {
            cls.add('selected');
            if (isRetrain) cls.add('retrain-pick');
            t.clicks.push(idx);
        }
    }

    // Single image click
    if (e.target.classList.contains('s-img')) {
        let img = e.target;
        let rect = img.getBoundingClientRect();
        let nw = img.naturalWidth || 400, nh = img.naturalHeight || 300;
        let cr = rect.width/rect.height, ir = nw/nh;
        let aw = rect.width, ah = rect.height, ox = 0, oy = 0;
        if (cr > ir) { aw = rect.height*ir; ox = (rect.width-aw)/2; }
        else { ah = rect.width/ir; oy = (rect.height-ah)/2; }
        let cx = e.clientX - rect.left - ox, cy = e.clientY - rect.top - oy;
        if (cx < 0 || cx > aw || cy < 0 || cy > ah) return;
        let px = Math.max(0, Math.min(100, (cx/aw)*100));
        let py = Math.max(0, Math.min(100, (cy/ah)*100));
        t.clicks.push({ px, py });
        let dot = document.createElement('div');
        dot.className = 'dot' + (isRetrain ? ' rd' : '');
        dot.style.left = `${((e.clientX-rect.left)/rect.width)*100}%`;
        dot.style.top = `${((e.clientY-rect.top)/rect.height)*100}%`;
        img.parentElement.appendChild(dot);
    }
});

// ── Video Animation ──
let lastTick = 0;
function animateVideos(t) {
    if (t - lastTick > 150) {
        lastTick = t;
        videoMap.forEach((v, id) => {
            let el = document.querySelector(`.vid[data-id="${id}"]`);
            if (el && v.frames.length) { v.cur = (v.cur+1)%v.frames.length; el.src = v.frames[v.cur]; }
        });
    }
    requestAnimationFrame(animateVideos);
}
requestAnimationFrame(animateVideos);

// ── Search ──
function filterTasks() {
    let f = document.getElementById('searchInput').value.toLowerCase().replace('#','');
    document.querySelectorAll('.task-card').forEach(c => {
        c.style.display = c.dataset.id.toLowerCase().includes(f) ? '' : 'none';
    });
}

// ── Poll ──
setInterval(fetchTasks, 800);
fetchTasks();
setTimeout(initAI, 200);
</script>
