<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>hCaptcha Master Pro ⚡ (Zero-Blink)</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: #0c0c0c; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 8px; gap: 8px; }

.header { background: #181818; padding: 8px 12px; border-bottom: 2px solid #00ff88; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-radius: 4px; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header h1 { margin: 0; font-size: 16px; color: #00ff88; }
.tabs { display: flex; gap: 4px; }
.tab-btn { background: #282828; color: #aaa; border: 1px solid #444; padding: 5px 12px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; }
.tab-btn.active { background: #00ff88; color: #000; border-color: #00ff88; }
.count-badge { background: #000; color: #fff; padding: 1px 6px; border-radius: 6px; font-size: 11px; margin-left: 4px; }

.ai-bar { display: flex; align-items: center; gap: 6px; }
.sync-status { font-size: 11px; color: #00ff88; font-weight: bold; padding: 4px 8px; background: #1a1a1a; border-radius: 4px; border: 1px solid #333; }
.btn-toggle { padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #555; background: #222; color: #888; }
.btn-toggle.on { background: #00ff88; color: #000; border-color: #00ff88; }
.btn-del-brain { background: #2a1111; color: #ff5555; border: 1px solid #552222; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
.search-box input { padding: 4px 8px; background: #222; border: 1px solid #444; color: #00ff88; border-radius: 4px; font-size: 11px; outline: none; width: 110px; }

.workspace-split { display: flex; gap: 8px; flex: 1; min-height: 0; }
.column { flex: 1; display: flex; flex-direction: column; background: #141414; border: 1px solid #262626; border-radius: 4px; overflow: hidden; }
.column-header { padding: 6px 10px; background: #1c1c1c; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 12px; }
.col-title-ai { color: #00ff88; }
.col-title-manual { color: #ff9900; }
.stream-count { background: #000; padding: 1px 6px; border-radius: 6px; font-size: 11px; color: #fff; }

.task-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.task-card { background: #1c1c1c; border: 1px solid #333; border-radius: 4px; padding: 8px; contain: layout; }
.task-card.ai-processing { border-color: #ff00ff; box-shadow: 0 0 8px rgba(255,0,255,0.3); }
.task-card.in-retrain { border: 2px solid #ff8800 !important; background: #221405 !important; }
.task-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.task-id { color: #ff4444; font-family: monospace; font-size: 12px; font-weight: bold; }

.prompt-container { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; background: #222; padding: 4px; border-radius: 4px; border: 1px solid #333; }
.example-wrap { flex-shrink: 0; width: 38px; height: 38px; }
.example-img { width: 38px; height: 38px; object-fit: cover; border-radius: 3px; border: 1px solid #555; }
.example-img-placeholder { width: 38px; height: 38px; border-radius: 3px; background: #2a2a2a; border: 1px dashed #555; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.task-prompt { color: #fff; font-size: 11px; font-weight: bold; line-height: 1.2; }

.img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.img-grid img { width: 100%; height: 95px; object-fit: cover; cursor: pointer; border: 3px solid transparent; background: #222; border-radius: 3px; }
.img-grid img.selected { border-color: #00ff88; opacity: 0.85; }
.img-grid img.ai-pick { border-color: #ff00ff; }
.img-grid img.retrain-pick { border-color: #ff8800 !important; }

.single-box { position: relative; width: 100%; height: 320px; cursor: crosshair; display: flex; justify-content: center; align-items: center; background: #000; border-radius: 4px; border: 1px solid #444; overflow: hidden; user-select: none; }
.single-box .frame-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; pointer-events: none; }
.single-box .frame-layer.active { display: block; }
.dot { position: absolute; width: 14px; height: 14px; background: #00ff88; border: 2px solid #000; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; box-shadow: 0 0 6px #00ff88; }
.dot.end-dot { background: #ff8800; box-shadow: 0 0 6px #ff8800; }

.actions { display: flex; gap: 4px; margin-top: 6px; }
.btn { flex: 1; padding: 6px; border: none; font-weight: bold; cursor: pointer; color: #fff; font-size: 11px; border-radius: 3px; }
.btn-save { background: #00ff88; color: #000; }
.btn-reset { background: #444; }
.btn-del { background: #ff4444; flex: 0.3; }
.btn-retrain { background: #ff8800; color: #000; }
.btn-confirm { background: #00ff88; color: #000; }
.btn-cancel { background: #555; }

#trainedView { display: none; flex: 1; flex-direction: column; background: #141414; border: 1px solid #262626; border-radius: 4px; overflow: hidden; }
.trained-container { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>⚡ hCaptcha Master Pro</h1>
        <div class="tabs">
            <button class="tab-btn active" id="btn-pending" onclick="setTab('pending')">Pending <span class="count-badge" id="c-pending">0</span></button>
            <button class="tab-btn" id="btn-trained" onclick="setTab('trained')">Trained <span class="count-badge" id="c-trained">0</span></button>
        </div>
    </div>
    <div class="ai-bar">
        <span class="sync-status" id="syncStatus">🧠 AI Ready</span>
        <button id="btnAutoTrain" class="btn-toggle on" onclick="toggleAutoTrain()">🧠 Auto: ON</button>
        <button id="btnAutoSave" class="btn-toggle on" onclick="toggleAutoSave()">💾 Save: ON</button>
        <button class="btn-del-brain" onclick="resetBrain()">🧹 Reset AI</button>
        <div class="search-box"><input type="text" id="searchInput" oninput="filterTasks()" placeholder="🔍 Task ID..."/></div>
    </div>
</div>

<div class="workspace-split" id="pendingView">
    <div class="column">
        <div class="column-header">
            <span class="col-title-ai">🤖 AI Grid Stream</span>
            <span class="stream-count" id="c-grid">0 Tasks</span>
        </div>
        <div class="task-list" id="gridArea"></div>
    </div>
    <div class="column">
        <div class="column-header">
            <span class="col-title-manual">👷 Manual Worker Stream</span>
            <span class="stream-count" id="c-manual">0 Tasks</span>
        </div>
        <div class="task-list" id="manualArea"></div>
    </div>
</div>

<div id="trainedView">
    <div class="column-header">
        <span style="color:#00ff88">🗂️ Trained Database Archive</span>
        <span class="stream-count" id="c-trained-total">0 Solved</span>
    </div>
    <div class="trained-container" id="trainedArea"></div>
</div>

<script>
const SERVER_URL = location.origin;
const WS_URL = SERVER_URL.replace(/^http/, 'ws');
const gridArea = document.getElementById('gridArea');
const manualArea = document.getElementById('manualArea');
const trainedArea = document.getElementById('trainedArea');
const syncStatus = document.getElementById('syncStatus');

let currentTab = 'pending';
let serverData = { pending: {}, trained: {} }, activeTasksStore = {};
let videoControllers = new Map();
let ghostBlocker = new Set(), retrainEditingTasks = new Set();
let isAIReady = false, aiModel, knn;
let autoTrainEnabled = true, autoSaveEnabled = true;
let isEvaluatingAI = false;
let brainSaveTimer = null;

// Smooth WebGL Model Init
async function initAI() {
    try {
        try { await tf.setBackend('webgl'); } catch(e) { await tf.setBackend('cpu'); }
        await tf.ready();
        aiModel = await mobilenet.load({ version: 2, alpha: 1.0 });
        knn = knnClassifier.create();
        await loadBrainFromServer();
        isAIReady = true;
        updateAIStatus();
    } catch(e) {
        syncStatus.innerHTML = "⚠️ AI Fallback";
    }
}

function updateAIStatus() {
    if (!knn) return;
    let ds = knn.getClassExampleCount();
    let concepts = Object.keys(ds).filter(k => !k.startsWith('neg_')).length;
    syncStatus.innerHTML = `🤖 AI Ready ✅ (${concepts} Concepts)`;
}

function cleanLabel(raw) {
    return (raw || '').split('|||')[0].replace(/[\n\r\t]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
}

async function loadBrainFromServer() {
    try {
        let r = await fetch(`${SERVER_URL}/api/ai-brain?t=${Date.now()}`);
        if (!r.ok) return;
        let ser = await r.json();
        if (!ser || !Object.keys(ser).length) return;
        let ds = {};
        for (let k in ser) {
            if (ser[k]?.data && ser[k]?.shape) ds[k] = tf.tensor(ser[k].data, ser[k].shape);
        }
        knn.setClassifierDataset(ds);
    } catch(e) {}
}

function scheduleBrainSave() {
    if (brainSaveTimer) clearTimeout(brainSaveTimer);
    brainSaveTimer = setTimeout(async () => {
        if (!knn) return;
        try {
            let ds = knn.getClassifierDataset();
            let ser = {};
            for (let k in ds) ser[k] = { data: Array.from(ds[k].dataSync()), shape: ds[k].shape };
            await fetch(`${SERVER_URL}/api/ai-brain`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(ser)
            });
            updateAIStatus();
        } catch(e) {}
    }, 1500);
}

async function resetBrain() {
    if (!confirm("AI Brain permanently reset karein?")) return;
    await fetch(`${SERVER_URL}/api/ai-brain`, { method: 'DELETE' });
    if (knn) knn.clearAllClasses();
    location.reload();
}

function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + tab).classList.add('active');
    
    if (tab === 'pending') {
        document.getElementById('pendingView').style.display = 'flex';
        document.getElementById('trainedView').style.display = 'none';
    } else {
        document.getElementById('pendingView').style.display = 'none';
        document.getElementById('trainedView').style.display = 'flex';
        fetchTrained();
    }
}

function toggleAutoTrain() {
    autoTrainEnabled = !autoTrainEnabled;
    let btn = document.getElementById('btnAutoTrain');
    btn.className = 'btn-toggle' + (autoTrainEnabled ? ' on' : '');
    btn.textContent = '🧠 Auto: ' + (autoTrainEnabled ? 'ON' : 'OFF');
}

function toggleAutoSave() {
    autoSaveEnabled = !autoSaveEnabled;
    let btn = document.getElementById('btnAutoSave');
    btn.className = 'btn-toggle' + (autoSaveEnabled ? ' on' : '');
    btn.textContent = '💾 Save: ' + (autoSaveEnabled ? 'ON' : 'OFF');
}

async function trainAIBrainAsync(task) {
    if (!isAIReady || task.type !== 'grid' || !task.media) return;
    let pText = cleanLabel(task.prompt);
    let negLabel = 'neg_' + pText;

    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = new Image();
            img.src = imgSrc;
            await new Promise(res => { img.onload = res; img.onerror = res; setTimeout(res, 250); });
            if (!img.complete || img.naturalWidth === 0) continue;
            
            tf.tidy(() => {
                let tfImg = tf.browser.fromPixels(img);
                let features = aiModel.infer(tfImg, true);
                if (task.clicks.includes(m.index)) {
                    knn.addExample(features, pText);
                    knn.addExample(features, pText);
                } else {
                    knn.addExample(features, negLabel);
                }
            });
            await tf.nextFrame();
        } catch(e) {}
    }
    updateAIStatus();
    scheduleBrainSave();
}

async function predictWithAI(task) {
    if (!isAIReady || !autoTrainEnabled || task.type !== 'grid' || !task.media || task.clicks.length > 0) return;
    let pText = cleanLabel(task.prompt);
    let dataset = knn.getClassExampleCount();
    if (!dataset[pText] || dataset[pText] < 2) return;

    let predictedClicks = [];
    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = new Image();
            img.src = imgSrc;
            await new Promise(res => { img.onload = res; img.onerror = res; setTimeout(res, 250); });
            if (!img.complete || img.naturalWidth === 0) continue;
            
            let res = null;
            tf.tidy(() => {
                let tfImg = tf.browser.fromPixels(img);
                let features = aiModel.infer(tfImg, true);
                res = knn.predictClass(features);
            });
            let resolvedRes = await res;
            let conf = resolvedRes.confidences[pText] || 0;
            let negConf = resolvedRes.confidences['neg_' + pText] || 0;
            
            if (resolvedRes.label === pText && conf >= 0.70 && negConf < 0.25) {
                predictedClicks.push(m.index);
            }
            await tf.nextFrame();
        } catch(e) {}
    }

    if (predictedClicks.length >= 1 && predictedClicks.length <= 6) {
        task.clicks = predictedClicks;
        let card = document.querySelector(`.task-card[data-id="${task.id}"]`);
        if (card) {
            card.classList.add('ai-processing');
            predictedClicks.forEach(idx => {
                let imgEl = card.querySelector(`.g-img[data-index="${idx}"]`);
                if (imgEl) imgEl.classList.add('ai-pick');
            });
            if (autoSaveEnabled) {
                let btn = card.querySelector('.btn-save');
                if (btn) { btn.style.background = '#ff00ff'; btn.textContent = '🤖 Solved'; }
                sendToServer(task.id, btn, card);
            }
        }
    }
}

// 100% Pure WebSocket Engine (No Polling Overwrite)
let ws = null;
function wsConn() {
    if (ws && ws.readyState < 2) return;
    try { ws = new WebSocket(WS_URL); } catch(e) { setTimeout(wsConn, 1500); return; }
    ws.onopen = () => ws.send(JSON.stringify({ action: 'dashboard' }));
    ws.onmessage = ev => {
        try {
            let m = JSON.parse(ev.data);
            if (m.type === 'counts') {
                document.getElementById('c-pending').innerText = m.data.pending || 0;
                document.getElementById('c-trained').innerText = m.data.trained || 0;
                document.getElementById('c-trained-total').innerText = `${m.data.trained || 0} Solved`;
            }
            if (m.type === 'new_pending') {
                appendSingleCard(m.data.id, m.data);
            }
            if (m.type === 'task_solved' || m.type === 'task_deleted') {
                let tid = m.data.taskId;
                ghostBlocker.add(tid);
                document.querySelector(`.task-card[data-id="${tid}"]`)?.remove();
                delete activeTasksStore[tid];
                videoControllers.delete(tid);
                updateStreamCounts();
            }
        } catch(e) {}
    };
    ws.onclose = () => setTimeout(wsConn, 1500);
}

function appendSingleCard(id, td) {
    if (ghostBlocker.has(id) || activeTasksStore[id]) return;
    let media = td.media || [];
    let isGrid = media.length > 1 || (media.length === 1 && media[0]?.type === 'image');

    activeTasksStore[id] = { id, clicks: [], type: isGrid ? 'grid' : 'coord', media, prompt: td.prompt || '' };
    let card = buildCard(activeTasksStore[id]);

    if (isGrid) {
        gridArea.prepend(card);
        if (isAIReady && autoTrainEnabled) predictWithAI(activeTasksStore[id]);
    } else {
        manualArea.prepend(card);
    }
    updateStreamCounts();
}

function updateStreamCounts() {
    document.getElementById('c-grid').innerText = `${gridArea.children.length} Grids`;
    document.getElementById('c-manual').innerText = `${manualArea.children.length} Tasks`;
}

async function fetchInitial() {
    try {
        const res = await fetch(`${SERVER_URL}/api/tasks?tab=pending&t=${Date.now()}`);
        if (res.ok) {
            const data = await res.json();
            let tasks = data.tasks || {};
            for (let id in tasks) appendSingleCard(id, tasks[id]);
        }
    } catch(e) {}
}

async function fetchTrained() {
    try {
        const res = await fetch(`${SERVER_URL}/api/tasks?tab=trained&t=${Date.now()}`);
        if (res.ok) {
            const data = await res.json();
            trainedArea.innerHTML = '';
            let tasks = data.tasks || {};
            for (let id in tasks) {
                let td = tasks[id];
                let isGrid = td.media?.length > 1 || (td.media?.length === 1 && td.media[0]?.type === 'image');
                activeTasksStore[id] = { id, clicks: [...(td.clicks || [])], type: isGrid ? 'grid' : 'coord', media: td.media || [], prompt: td.prompt || '', _isTrained: true };
                trainedArea.appendChild(buildCard(activeTasksStore[id], true));
            }
        }
    } catch(e) {}
}

function buildCard(t, isTrained = false) {
    let card = document.createElement('div');
    card.className = 'task-card';
    card.dataset.id = t.id;
    if (isTrained) card.style.minWidth = '250px';

    let parts = t.prompt.split('|||');
    let exHtml = parts[1] ? `<img src="${parts[1]}" class="example-img">` : `<div class="example-img-placeholder">🖼️</div>`;
    let mediaHTML = '';

    if (t.type === 'grid') {
        mediaHTML = '<div class="img-grid">';
        t.media.forEach(m => {
            let isSelected = t.clicks.includes(m.index);
            mediaHTML += `<img src="${m.thumb || m.src || ''}" class="g-img ${isSelected?'selected':''}" data-index="${m.index}" draggable="false" loading="lazy"/>`;
        });
        mediaHTML += '</div>';
    } else {
        let m = t.media[0] || {};
        let isVid = m.type === 'video_frames' && m.frames && m.frames.length > 0;
        
        mediaHTML = `<div class="single-box" data-id="${t.id}">`;
        if (isVid) {
            m.frames.forEach((f, idx) => {
                mediaHTML += `<img src="${f}" class="frame-layer ${idx===0?'active':''}" data-frame="${idx}" draggable="false"/>`;
            });
        } else {
            mediaHTML += `<img src="${m.thumb || m.src || ''}" class="frame-layer active" draggable="false"/>`;
        }

        t.clicks.forEach((pt, i) => {
            mediaHTML += `<div class="dot${i % 2 === 1 ? ' end-dot' : ''}" style="left:${pt.px}%;top:${pt.py}%;"></div>`;
        });
        mediaHTML += '</div>';

        if (isVid && !isTrained) {
            videoControllers.set(t.id, { total: m.frames.length, current: 0 });
        }
    }

    let actions = !isTrained ? `
        <div class="actions">
            <button class="btn btn-save" data-action="save">Save & Train</button>
            <button class="btn btn-reset" data-action="reset">Clear</button>
            <button class="btn btn-del" data-action="del">❌</button>
        </div>` : `
        <div class="actions" id="act-${t.id}">
            <button class="btn btn-retrain" data-action="retrain">🔧 Retrain</button>
            <button class="btn btn-del" data-action="del-trained">❌</button>
        </div>`;

    card.innerHTML = `
        <div class="task-head">
            <span class="task-id">#${t.id.substring(0,6)}</span>
            ${isTrained ? `<span style="font-size:11px;color:#888">${t.clicks.length} saved</span>` : ''}
        </div>
        <div class="prompt-container"><div class="example-wrap">${exHtml}</div><div class="task-prompt">${parts[0]}</div></div>
        ${mediaHTML}
        ${actions}`;
    return card;
}

// 0% Blink Frame Swapper Engine (Class Toggle Only)
let lastFrameTime = 0;
function animateZeroBlinkVideos(timestamp) {
    if (timestamp - lastFrameTime > 140) {
        lastFrameTime = timestamp;
        videoControllers.forEach((v, id) => {
            let card = document.querySelector(`.task-card[data-id="${id}"]`);
            if (card) {
                let layers = card.querySelectorAll('.frame-layer');
                if (layers.length > 1) {
                    layers[v.current].classList.remove('active');
                    v.current = (v.current + 1) % v.total;
                    layers[v.current].classList.add('active');
                }
            }
        });
    }
    requestAnimationFrame(animateZeroBlinkVideos);
}
requestAnimationFrame(animateZeroBlinkVideos);

document.body.addEventListener('click', (e) => {
    let actionBtn = e.target.closest('[data-action]');
    let card = e.target.closest('.task-card');
    if (!card) return;
    let tid = card.dataset.id, t = activeTasksStore[tid];
    if (!t) return;

    if (actionBtn) {
        let act = actionBtn.dataset.action;
        if (act === 'save') sendToServer(tid, actionBtn, card);
        if (act === 'reset') {
            t.clicks = [];
            card.querySelectorAll('.g-img').forEach(img => img.classList.remove('selected', 'ai-pick'));
            card.querySelectorAll('.dot').forEach(d => d.remove());
            card.classList.remove('ai-processing');
        }
        if (act === 'del') {
            ghostBlocker.add(tid); card.remove(); delete activeTasksStore[tid];
            videoControllers.delete(tid); updateStreamCounts();
            fetch(`${SERVER_URL}/api/delete-hcaptcha/${tid}`, { method: 'DELETE' });
        }
        if (act === 'del-trained') {
            fetch(`${SERVER_URL}/api/delete-hcaptcha/${tid}`, { method: 'DELETE' }).then(() => fetchTrained());
            card.remove(); delete activeTasksStore[tid];
        }
    }

    if (card.closest('#trainedView') && !retrainEditingTasks.has(tid)) return;

    if (e.target.classList.contains('g-img')) {
        let idx = parseInt(e.target.dataset.index);
        if (e.target.classList.contains('selected') || e.target.classList.contains('ai-pick')) {
            e.target.classList.remove('selected', 'ai-pick');
            t.clicks = t.clicks.filter(i => i !== idx);
        } else {
            e.target.classList.add('selected');
            t.clicks.push(idx);
        }
    } else if (e.target.closest('.single-box')) {
        let sbox = e.target.closest('.single-box');
        let rect = sbox.getBoundingClientRect();
        let px = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
        let py = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
        t.clicks.push({ px, py });

        let dot = document.createElement('div');
        dot.className = 'dot' + (t.clicks.length % 2 === 0 ? ' end-dot' : '');
        dot.style.left = px + '%';
        dot.style.top = py + '%';
        sbox.appendChild(dot);
    }
});

function sendToServer(taskId, btnEl, card) {
    let t = activeTasksStore[taskId]; if (!t || !t.clicks.length) return;
    fetch(`${SERVER_URL}/api/submit-hcaptcha`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ taskId, clicks: t.clicks })
    }).catch(()=>{});

    ghostBlocker.add(taskId);
    if (card) card.remove();
    delete activeTasksStore[taskId];
    videoControllers.delete(taskId);
    updateStreamCounts();

    if (isAIReady && t.type === 'grid') {
        trainAIBrainAsync(t);
    }
}

function filterTasks() {
    let f = document.getElementById('searchInput').value.toLowerCase().replace('#', '');
    document.querySelectorAll('.task-card').forEach(c => {
        c.style.display = c.dataset.id.toLowerCase().includes(f) ? "" : "none";
    });
}

wsConn();
fetchInitial();
initAI();
</script>
