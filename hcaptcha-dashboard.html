<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>hCaptcha Master - Instant Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .header { background: #1e1e1e; padding: 15px 20px; border-bottom: 3px solid #00ff88; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { margin: 0; font-size: 20px; color: #00ff88; }
        .ai-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .sync-status { font-size: 13px; color: #ffaa00; font-weight: bold; transition: color 0.3s; }
        .sync-status.active { color: #00ff88; }
        .btn-toggle { padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; border: 2px solid #555; transition: all 0.2s; background: #333; color: #888; }
        .btn-toggle.on { background: #00ff88; color: #000; border-color: #00ff88; }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { background: #333; color: #ccc; border: 2px solid #444; padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; outline: none; }
        .tab-btn.active { background: #00ff88; color: #000; border-color: #00ff88; }
        .count { background: #000; color: #fff; padding: 2px 8px; border-radius: 10px; margin-left: 8px; font-size: 14px; }
        .search-box input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #00ff88; border-radius: 4px; font-size: 16px; font-weight: bold; outline: none; }
        .search-box input::placeholder { color: #666; font-weight: normal; }
        .grid-container { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-start; }
        
        .task-card { background: #1e1e1e; min-width: 480px; flex: 1; max-width: 650px; padding: 15px; border: 1px solid #333; border-radius: 6px; }
        .task-card.ai-processing { border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.4); }
        .task-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .task-id { color: #ff4444; font-family: monospace; font-size: 16px; font-weight: bold; }
        .prompt-container { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; background: #222; padding: 8px; border-radius: 6px; border: 1px solid #333; }
        .example-wrap { flex-shrink: 0; width: 55px; height: 55px; }
        .example-img { width: 55px; height: 55px; object-fit: cover; border-radius: 4px; background: #222; border: 1px solid #555; display: block; }
        .example-img-placeholder { width: 55px; height: 55px; border-radius: 4px; background: #2a2a2a; border: 1px dashed #555; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .task-prompt { color: #fff; font-size: 14px; font-weight: bold; margin: 0; line-height: 1.4; flex: 1; }
        
        .img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .img-grid img { width: 100%; height: 140px; object-fit: cover; cursor: pointer; border: 4px solid transparent; background: #222; }
        .img-grid img.selected { border-color: #00ff88; opacity: 0.7; }
        .img-grid img.ai-pick { border-color: #ff00ff; }
        
        .trained-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
        .trained-grid img { width: 100%; height: 100px; object-fit: cover; border: 3px solid #333; background: #222; }
        .trained-grid img.was-clicked { border-color: #00ff88; }
        .trained-grid img.retrain-pick { border-color: #555; cursor: pointer; }
        .trained-grid img.retrain-pick.was-clicked { border-color: #ff8800 !important; }
        
        .single-box { position: relative; width: 100%; cursor: crosshair; display: flex; justify-content: center; background: #000; border-radius: 4px; border: 2px solid #444; overflow: hidden; }
        .single-box img { width: 100%; height: auto; min-height: 450px; max-height: 600px; object-fit: contain; display: block; }
        
        .dot { position: absolute; width: 18px; height: 18px; background: #00ff88; border: 2px solid #000; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .missing-media { background: #111; color: #888; padding: 20px 10px; text-align: center; border-radius: 4px; border: 1px dashed #444; font-size: 13px; line-height: 1.6; }
        
        .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 12px; border: none; font-weight: bold; cursor: pointer; color: #fff; font-size: 14px; border-radius: 4px; }
        .btn-save { background: #00ff88; color: #000; }
        .btn-reset { background: #555; }
        .btn-del { background: #ff4444; flex: 0.3; }
        .btn-retrain { background: #ff8800; color: #000; }
        .btn-confirm { background: #ff8800; color: #000; }
        .btn-cancel { background: #555; }
        .btn-disabled { background: #222; color: #555; cursor: not-allowed; }
        .retrain-hint { font-size: 12px; color: #ff8800; margin-top: 6px; padding: 6px 10px; background: #1a0f00; border-radius: 4px; width: 100%; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-top">
        <h1>hCaptcha Master (Instant Engine) 🤖</h1>
        <div class="tabs">
            <button class="tab-btn active" id="btn-pending" onclick="setTab('pending')">Pending <span class="count" id="c-pending">0</span></button>
            <button class="tab-btn" id="btn-trained" onclick="setTab('trained')">Trained <span class="count" id="c-trained">0</span></button>
        </div>
    </div>
    <div class="ai-bar">
        <span class="sync-status" id="syncStatus">🧠 AI Loading...</span>
        <button id="btnAutoTrain" class="btn-toggle" onclick="toggleAutoTrain()">🧠 Auto Train: OFF</button>
        <button id="btnAutoSave" class="btn-toggle" onclick="toggleAutoSave()">💾 Auto Save: OFF</button>
    </div>
    <div class="search-box"><input type="text" id="searchInput" oninput="filterTasks()" placeholder="🔍 Task ID search karein..."/></div>
</div>
<div class="grid-container" id="tasksArea"></div>

<script>
const SERVER_URL = location.origin;
const tasksArea = document.getElementById('tasksArea');
const syncStatus = document.getElementById('syncStatus');
let currentTab = 'pending', serverData = { pending:{}, trained:{} }, activeTasksStore = {}, videoTasks = [];
let ghostBlocker = new Set();
let isFetching = false;
let trainedPage = 0;
const PAGE_SIZE = 20;

let isAIReady = false, aiModel, knn;
let autoTrainEnabled = false, autoSaveEnabled = false;
let retrainState = {};
let isAIWorking = false;

async function initAI() {
    syncStatus.innerHTML = "🧠 AI Loading...";
    try {
        await new Promise(r => setTimeout(r, 200));
        aiModel = await mobilenet.load({ version: 2, alpha: 1.0 });
        knn = knnClassifier.create();
        loadKNN();
        isAIReady = true;
        syncStatus.innerHTML = "🤖 AI Ready ✅";
        syncStatus.classList.add('active');
        if (autoTrainEnabled) reEvaluatePending();
    } catch(e) {
        syncStatus.innerHTML = "⚠️ AI Load Failed";
    }
}

const IDB = { name:'hcm_knn', store:'knn', key:'model_v3' };
function idbOpen() {
    return new Promise((res,rej)=>{
        let r = indexedDB.open(IDB.name,1);
        r.onupgradeneeded = e => e.target.result.createObjectStore(IDB.store);
        r.onsuccess = e => res(e.target.result);
        r.onerror = () => rej(r.error);
    });
}
async function idbSet(val) {
    let db = await idbOpen();
    return new Promise((res,rej)=>{
        let tx = db.transaction(IDB.store,'readwrite');
        tx.objectStore(IDB.store).put(val, IDB.key);
        tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
}
async function idbGet() {
    let db = await idbOpen();
    return new Promise((res,rej)=>{
        let tx = db.transaction(IDB.store,'readonly');
        let req = tx.objectStore(IDB.store).get(IDB.key);
        req.onsuccess = () => res(req.result||null);
        req.onerror = () => rej(req.error);
    });
}

async function saveKNN() {
    if (!knn) return;
    try {
        let ds = knn.getClassifierDataset();
        let ser = {};
        for (let k in ds) { ser[k] = { data: Array.from(ds[k].dataSync()), shape: ds[k].shape }; }
        await idbSet(ser);
        let concepts = Object.keys(ser).filter(k => !k.startsWith('negative_')).length;
        syncStatus.innerHTML = `🤖 AI Ready ✅ (${concepts} concepts)`;
    } catch(e) {}
}

async function loadKNN() {
    try {
        let ser = await idbGet();
        if (!ser) return;
        let ds = {};
        for (let k in ser) { ds[k] = tf.tensor(ser[k].data, ser[k].shape); }
        knn.setClassifierDataset(ds);
        let concepts = Object.keys(ser).filter(k => !k.startsWith('negative_')).length;
        syncStatus.innerHTML = `🤖 AI Ready ✅ (${concepts} concepts)`;
    } catch(e) {}
}

function toggleAutoTrain() {
    autoTrainEnabled = !autoTrainEnabled;
    let btn = document.getElementById('btnAutoTrain');
    btn.className = 'btn-toggle' + (autoTrainEnabled ? ' on' : '');
    btn.textContent = '🧠 Auto Train: ' + (autoTrainEnabled ? 'ON' : 'OFF');
    if (autoTrainEnabled && isAIReady) reEvaluatePending();
}

function toggleAutoSave() {
    autoSaveEnabled = !autoSaveEnabled;
    let btn = document.getElementById('btnAutoSave');
    btn.className = 'btn-toggle' + (autoSaveEnabled ? ' on' : '');
    btn.textContent = '💾 Auto Save: ' + (autoSaveEnabled ? 'ON' : 'OFF');
}

// Background Non-Blocking AI Trainer
async function trainAIBrainAsync(task, wrongIndices = []) {
    if (!isAIReady || task.type !== 'grid' || !task.media) return;
    let pText = task.prompt.split('|||')[0].trim().toLowerCase();
    let negLabel = 'negative_' + pText;

    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = new Image();
            if (!imgSrc.startsWith('data:')) img.crossOrigin = "anonymous";
            img.src = imgSrc;
            await new Promise((res) => { img.onload = res; img.onerror = () => res(); setTimeout(res, 1200); });
            if (!img.complete || img.naturalWidth === 0) continue;
            
            tf.tidy(() => {
                let tfImg = tf.browser.fromPixels(img);
                let features = aiModel.infer(tfImg, true);
                let isCorrect = task.clicks.includes(m.index);
                let isWrong = wrongIndices.includes(m.index);

                if (isCorrect) { knn.addExample(features, pText); knn.addExample(features, pText); } 
                else if (isWrong) { knn.addExample(features, negLabel); knn.addExample(features, negLabel); knn.addExample(features, negLabel); } 
                else { knn.addExample(features, negLabel); }
            });
            await new Promise(r => setTimeout(r, 10)); // Yield thread
        } catch(e) {}
    }
    saveKNN();
    if (autoTrainEnabled) reEvaluatePending();
}

async function predictWithAI(task) {
    if (!isAIReady || !autoTrainEnabled || task.type !== 'grid' || !task.media || task.clicks.length > 0) return;
    let pText = task.prompt.split('|||')[0].trim().toLowerCase();
    let dataset = knn.getClassExampleCount();
    if (!dataset[pText]) return;

    let predictedClicks = [];
    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = new Image();
            if (!imgSrc.startsWith('data:')) img.crossOrigin = "anonymous";
            img.src = imgSrc;
            await new Promise((res) => { img.onload = res; img.onerror = () => res(); setTimeout(res, 1200); });
            if (!img.complete || img.naturalWidth === 0) continue;
            
            let res = null;
            tf.tidy(() => {
                let tfImg = tf.browser.fromPixels(img);
                let features = aiModel.infer(tfImg, true);
                res = knn.predictClass(features);
            });
            let resolvedRes = await res;
            let conf = resolvedRes.confidences[pText] || 0;
            let negConf = resolvedRes.confidences['negative_' + pText] || 0;
            if (resolvedRes.label === pText && conf > 0.85 && negConf < 0.30) {
                predictedClicks.push(m.index);
            }
        } catch(e) {}
    }

    if (predictedClicks.length > 0 && predictedClicks.length <= 6) {
        task.clicks = predictedClicks;
        let card = document.querySelector(`.task-card[data-id="${task.id}"]`);
        if (card) {
            card.classList.add('ai-processing');
            predictedClicks.forEach(idx => {
                let imgEl = card.querySelector(`.g-img[data-index="${idx}"]`);
                if (imgEl) { imgEl.classList.remove('selected'); imgEl.classList.add('ai-pick'); }
            });
            if (autoSaveEnabled) {
                let btn = card.querySelector('.btn-save');
                if (btn) { btn.style.background = '#ff00ff'; btn.textContent = '🤖 Auto-Saving...'; }
                sendToServer(task.id, btn, card);
            }
        } else if (autoSaveEnabled) {
            fetch(`${SERVER_URL}/api/submit-hcaptcha`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ taskId: task.id, clicks: predictedClicks }) }).catch(()=>{});
        }
    }
}

async function reEvaluatePending() {
    if (isAIWorking) return;
    isAIWorking = true;
    for (let id in serverData.pending) {
        let t = serverData.pending[id];
        if (t && (!t.clicks || t.clicks.length === 0)) {
            let media = t.media || [];
            let isGrid = media.length > 1;
            if (isGrid) {
                await predictWithAI({ id, clicks: [], type: 'grid', media, prompt: t.prompt || '' });
            }
        }
    }
    isAIWorking = false;
}

function startRetrain(taskId) {
    let t = activeTasksStore[taskId] || serverData.trained[taskId];
    if (!t) return;
    let card = document.querySelector(`.task-card[data-id="${taskId}"]`);
    if (!card) return;
    
    retrainState[taskId] = { oldClicks: [...(t.clicks || [])], newClicks: [...(t.clicks || [])] };
    
    card.querySelectorAll('.trained-grid img').forEach(img => {
        img.classList.add('retrain-pick');
        img.onclick = (ev) => {
            ev.stopPropagation();
            let idx = parseInt(img.dataset.index);
            let state = retrainState[taskId];
            if (!state) return;
            if (state.newClicks.includes(idx)) {
                state.newClicks = state.newClicks.filter(x => x !== idx);
                img.classList.remove('was-clicked');
            } else {
                state.newClicks.push(idx);
                img.classList.add('was-clicked');
            }
        };
    });
    
    let existingHint = card.querySelector(`#hint-${taskId}`);
    if (existingHint) existingHint.remove();

    let hint = document.createElement('div');
    hint.className = 'retrain-hint'; hint.id = `hint-${taskId}`;
    hint.textContent = '🟠 Sahi images click karo → Confirm Retrain dabao';
    card.querySelector('.actions').before(hint);
    
    let actions = card.querySelector('.actions');
    actions.innerHTML = `
        <button class="btn btn-confirm" onclick="confirmRetrain('${taskId}')">✅ Confirm Retrain</button>
        <button class="btn btn-cancel" onclick="cancelRetrain('${taskId}')">❌ Cancel</button>`;
}

async function confirmRetrain(taskId) {
    let t = activeTasksStore[taskId] || serverData.trained[taskId];
    let state = retrainState[taskId];
    if (!t || !state) return;
    
    let wrongClicks = (state.oldClicks || []).filter(idx => !state.newClicks.includes(idx));
    t.clicks = state.newClicks;
    
    // 1. Instant submit to backend
    fetch(`${SERVER_URL}/api/submit-hcaptcha`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ taskId, clicks: state.newClicks }) }).catch(()=>{});
    
    // 2. Background async learn
    trainAIBrainAsync(t, wrongClicks);
    
    delete retrainState[taskId];
    let card = document.querySelector(`.task-card[data-id="${taskId}"]`);
    if (card) {
        let hint = card.querySelector(`#hint-${taskId}`); if (hint) hint.remove();
        card.querySelectorAll('.trained-grid img').forEach(img => { img.classList.remove('retrain-pick'); img.onclick = null; });
        let actions = card.querySelector('.actions');
        actions.innerHTML = `<button class="btn btn-save">Update</button> <button class="btn btn-retrain" onclick="startRetrain('${taskId}')">🔧 Retrain</button> <button class="btn btn-del">❌</button>`;
    }
}

function cancelRetrain(taskId) {
    delete retrainState[taskId];
    let card = document.querySelector(`.task-card[data-id="${taskId}"]`);
    if (!card) return;
    let hint = card.querySelector(`#hint-${taskId}`); if (hint) hint.remove();
    let t = activeTasksStore[taskId] || serverData.trained[taskId];
    card.querySelectorAll('.trained-grid img').forEach(img => { 
        img.classList.remove('retrain-pick'); 
        img.onclick = null;
        let idx = parseInt(img.dataset.index);
        if (t && t.clicks && t.clicks.includes(idx)) img.classList.add('was-clicked');
        else img.classList.remove('was-clicked');
    });
    let actions = card.querySelector('.actions');
    actions.innerHTML = `<button class="btn btn-save">Update</button> <button class="btn btn-retrain" onclick="startRetrain('${taskId}')">🔧 Retrain</button> <button class="btn btn-del">❌</button>`;
}

function setTab(tab) {
    currentTab = tab; trainedPage = 0;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + tab).classList.add('active');
    document.getElementById('searchInput').value = '';
    tasksArea.innerHTML = ''; activeTasksStore = {}; videoTasks = [];
    fetchTasks();
}

function filterTasks() {
    let f = document.getElementById('searchInput').value.toLowerCase().replace('#', '');
    document.querySelectorAll('.task-card').forEach(c => { c.style.display = c.dataset.id.toLowerCase().includes(f) ? "" : "none"; });
}

let _fetchTimer = null;
async function fetchTasks() {
    if (isFetching) return;
    isFetching = true;
    try {
        const resPending = await fetch(`${SERVER_URL}/api/tasks?tab=pending&page=0&size=50&t=${Date.now()}`, { cache: 'no-store' });
        if (resPending.ok) {
            const dPending = await resPending.json();
            serverData.pending = dPending.tasks || {};
            if (isAIReady && autoTrainEnabled) reEvaluatePending();
        }

        if (currentTab === 'trained') {
            const resTrained = await fetch(`${SERVER_URL}/api/tasks?tab=trained&page=${trainedPage}&size=${PAGE_SIZE}&t=${Date.now()}`, { cache: 'no-store' });
            if (resTrained.ok) {
                const dTrained = await resTrained.json();
                serverData.trained = dTrained.tasks || {};
            }
        }

        fetch(`${SERVER_URL}/api/counts`).then(r => r.json()).then(counts => {
            document.getElementById('c-pending').innerText = counts.pending;
            document.getElementById('c-trained').innerText = counts.trained;
        }).catch(()=>{});

        renderCurrentData();
    } catch(e) {}
    isFetching = false;
}

function startFetch() { if (!_fetchTimer) _fetchTimer = setInterval(fetchTasks, 500); fetchTasks(); }

function renderCurrentData() {
    let activeData = currentTab === 'pending' ? serverData.pending : serverData.trained;
    document.querySelectorAll('.task-card').forEach(card => {
        let id = card.dataset.id;
        if (!activeData[id] || ghostBlocker.has(id)) { card.remove(); delete activeTasksStore[id]; }
    });
    
    let oldBtn = document.getElementById('loadMoreBtn'); if (oldBtn) oldBtn.remove();
    let frag = document.createDocumentFragment();
    let ids = Object.keys(activeData);
    
    for (let id of ids) {
        if (ghostBlocker.has(id) || activeTasksStore[id]) continue;
        let td = activeData[id], media = td.media || [], isGrid = media.length > 1, clicks = td.clicks || [];
        activeTasksStore[id] = { id, clicks: currentTab === 'pending' ? [] : clicks, type: isGrid ? 'grid' : 'coord', media, prompt: td.prompt || '' };
        let card = buildCard(activeTasksStore[id]);
        if (card) frag.appendChild(card);
        if (currentTab === 'pending' && isAIReady && autoTrainEnabled && isGrid) predictWithAI(activeTasksStore[id]);
    }
    tasksArea.appendChild(frag);

    if (currentTab === 'trained' && ids.length >= PAGE_SIZE) {
        let btn = document.createElement('button'); btn.id = 'loadMoreBtn';
        btn.textContent = `⬇️ Next Page (${trainedPage + 1})`;
        btn.style = 'width:100%;padding:12px;margin-top:10px;background:#333;color:#00ff88;border:2px solid #00ff88;border-radius:6px;cursor:pointer;font-size:15px;font-weight:bold;';
        btn.onclick = () => { trainedPage++; fetchTasks(); };
        tasksArea.appendChild(btn);
    }
    filterTasks();
}

function buildCard(t) {
    let card = document.createElement('div'); card.className = 'task-card'; card.dataset.id = t.id;
    let isPending = currentTab === 'pending', parts = t.prompt.split('|||');
    
    function _safeUrl(u) {
        if (!u) return '';
        u = u.trim();
        if (u.startsWith('data:image/')) return u;
        if (/^https?:\/\//.test(u)) return u.replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        return '';
    }
    
    let _exSrc = parts[1] ? _safeUrl(parts[1]) : '';
    let exHtml = _exSrc
        ? `<img src="${_exSrc}" class="example-img" style="display:block">
           <div class="example-img-placeholder" style="display:none">🖼️</div>`
        : `<div class="example-img-placeholder">🖼️</div>`;

    let isMediaMissing = !t.media || t.media.length === 0 || t.media.every(m => !m.thumb && !m.src && !m.frames);
    let mediaHTML = '';

    if (isMediaMissing) {
        mediaHTML = `<div class="missing-media">⚠️ <b>Images process ho rahi hain...</b><br><span>Clicks: ${t.clicks.length}</span></div>`;
    } else if (t.type === 'grid') {
        if (isPending) {
            mediaHTML = '<div class="img-grid">';
            t.media.forEach(m => { mediaHTML += `<img src="${m.thumb || m.src || ''}" class="g-img ${t.clicks.includes(m.index)?'selected':''}" data-index="${m.index}" draggable="false" loading="lazy" onerror="this.style.opacity='0.3'"/>`; });
            mediaHTML += '</div>';
        } else {
            mediaHTML = '<div class="trained-grid">';
            t.media.forEach(m => { mediaHTML += `<img src="${m.thumb || m.src || ''}" class="${t.clicks.includes(m.index)?'was-clicked':''}" data-index="${m.index}" loading="lazy" onerror="this.style.opacity='0.2'" title="${t.clicks.includes(m.index)?'✅ Clicked':'❌ Not clicked'}"/>`; });
            mediaHTML += '</div>';
        }
    } else {
        let m = t.media[0], isVid = m.type === 'video_frames' && m.frames && m.frames.length > 0;
        let src = isVid ? m.frames[0] : (m.src || '');
        mediaHTML = `<div class="single-box"><img src="${src}" class="s-img ${isVid?'vid-player':''}" data-id="${t.id}" draggable="false" loading="lazy"/>`;
        t.clicks.forEach(pt => { mediaHTML += `<div class="dot" style="left:${pt.px}%;top:${pt.py}%;"></div>`; });
        mediaHTML += '</div>';
        if (isVid) videoTasks.push({ id: t.id, frames: m.frames, current: 0 });
    }

    let actionsHtml = isPending ? 
        `<button class="btn btn-save">Save Task</button> ${!isMediaMissing ? `<button class="btn btn-reset">Clear</button>` : ''} <button class="btn btn-del">❌</button>` : 
        `${!isMediaMissing ? `<button class="btn btn-save">Update</button> <button class="btn btn-retrain" onclick="startRetrain('${t.id}')">🔧 Retrain</button>` : `<button class="btn btn-disabled" disabled>No Update</button>`} <button class="btn btn-del">❌</button>`;

    card.innerHTML = `
        <div class="task-head">
            <span class="task-id">${t.num ? `<span style="color:#888;font-size:12px">#${t.num}</span> ` : ''}#${t.id.substring(0,6)}</span>
            ${!isPending ? `<span style="font-size:11px;color:#666">${t.clicks.length} clicks</span>` : ''}
        </div>
        <div class="prompt-container"><div class="example-wrap" style="flex-shrink:0;width:55px;height:55px;position:relative">${exHtml}</div><div class="task-prompt">${parts[0]}</div></div>
        ${mediaHTML}
        <div class="actions">${actionsHtml}</div>`;
    return card;
}

setInterval(() => {
    videoTasks.forEach(vt => {
        let el = document.querySelector(`.vid-player[data-id="${vt.id}"]`);
        if (el && vt.frames?.length > 0) { vt.current=(vt.current+1)%vt.frames.length; el.src=vt.frames[vt.current]; }
    });
}, 200); 

tasksArea.addEventListener('click', (e) => {
    let card = e.target.closest('.task-card'); if (!card) return;
    let tid = card.dataset.id, t = activeTasksStore[tid]; if (!t) return;
    if (retrainState[tid] && !e.target.classList.contains('btn-confirm') && !e.target.classList.contains('btn-cancel')) return;

    if (e.target.classList.contains('g-img')) {
        let idx = parseInt(e.target.dataset.index);
        if (e.target.classList.contains('selected') || e.target.classList.contains('ai-pick')) {
            e.target.classList.remove('selected', 'ai-pick'); t.clicks = t.clicks.filter(i => i !== idx);
        } else { e.target.classList.add('selected'); t.clicks.push(idx); }
    } else if (e.target.classList.contains('s-img')) {
        let rect = e.target.getBoundingClientRect();
        let x = ((e.clientX-rect.left)/rect.width)*100, y = ((e.clientY-rect.top)/rect.height)*100;
        t.clicks.push({px:x, py:y});
        let dot = document.createElement('div'); dot.className='dot'; dot.style.left=`${x}%`; dot.style.top=`${y}%`;
        e.target.parentElement.appendChild(dot);
    } else if (e.target.classList.contains('btn-save')) { sendToServer(tid, e.target, card);
    } else if (e.target.classList.contains('btn-reset')) {
        t.clicks = []; card.querySelectorAll('.g-img').forEach(img => img.classList.remove('selected','ai-pick'));
        card.querySelectorAll('.dot').forEach(d => d.remove()); card.classList.remove('ai-processing');
    } else if (e.target.classList.contains('btn-del')) {
        ghostBlocker.add(tid); card.remove(); delete activeTasksStore[tid];
        fetch(`${SERVER_URL}/api/delete-hcaptcha/${tid}`, { method:'DELETE' }).catch(e => {});
    }
});

const _saving = new Set();
function sendToServer(taskId, btnEl, card) {
    if (_saving.has(taskId)) return;
    _saving.add(taskId); 
    let t = activeTasksStore[taskId]; 
    if (!t) { _saving.delete(taskId); return; }

    // 1. INSTANT DISPATCH TO BACKEND (Zero delay for browser site)
    fetch(`${SERVER_URL}/api/submit-hcaptcha`, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ taskId, clicks: t.clicks }) 
    }).catch(()=>{});

    // 2. INSTANT UI REMOVAL TO TRAINED TAB
    if (currentTab === 'pending') {
        ghostBlocker.add(taskId);
        setTimeout(() => ghostBlocker.delete(taskId), 4000);
        if (card) card.remove(); 
        delete activeTasksStore[taskId];
    } else {
        if (btnEl) { btnEl.textContent='Updated!'; setTimeout(()=>{ if(btnEl){btnEl.textContent='Update';btnEl.disabled=false;} },1000); }
    }

    // 3. ASYNC BACKGROUND AI LEARNING (Non-blocking, UI freeze nahi hoga)
    if (isAIReady && t.clicks.length > 0) {
        trainAIBrainAsync(t).finally(() => {
            _saving.delete(taskId);
        });
    } else {
        _saving.delete(taskId);
    }
}

window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'IMG' && e.target.classList.contains('example-img')) {
        e.target.style.display = 'none';
        if (e.target.nextElementSibling) {
            e.target.nextElementSibling.style.display = 'flex';
        }
    }
}, true);

startFetch();
setTimeout(initAI, 200);
</script>
</body>
</html>
