<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hCaptcha Master - Smart Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
    <style>
        /* Tumhari original styling wesi hi rakhi hai, code chota rakhne ke liye sirf main layout likha hai */
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        .header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #00ff88; padding-bottom: 10px; }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { background: #333; color: #ccc; padding: 10px; cursor: pointer; border: none; font-weight: bold; }
        .tab-btn.active { background: #00ff88; color: #000; }
        .grid-container { display: flex; flex-wrap: wrap; gap: 15px; }
        .task-card { background: #1e1e1e; padding: 15px; border: 1px solid #333; min-width: 400px; }
        .task-card.ai-processing { border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.4); }
        .img-grid, .trained-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .img-grid img, .trained-grid img { width: 100%; height: 120px; object-fit: cover; cursor: pointer; border: 3px solid transparent; }
        .img-grid img.selected, .trained-grid img.was-clicked { border-color: #00ff88; }
        .img-grid img.ai-pick { border-color: #ff00ff; }
        .trained-grid img.retrain-pick { border-color: #ff8800; }
        .btn { padding: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; border: none; }
        .btn-save { background: #00ff88; } .btn-retrain { background: #ff8800; } .btn-del { background: #ff4444; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Dashboard 🤖 <span id="ai-status">Loading AI...</span></h2>
        <div>
            <button id="btnAutoTrain" onclick="autoTrainEnabled = !autoTrainEnabled; this.style.background = autoTrainEnabled ? '#00ff88' : '#333';">🧠 Auto Train: OFF</button>
            <button id="btnAutoSave" onclick="autoSaveEnabled = !autoSaveEnabled; this.style.background = autoSaveEnabled ? '#00ff88' : '#333';">💾 Auto Save: OFF</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="setTab('ai-grids')">AI Grids</button>
            <button class="tab-btn" onclick="setTab('workers')">Worker Tasks (Coords)</button>
            <button class="tab-btn" onclick="setTab('trained')">Trained (Retrain)</button>
        </div>
    </div>
    
    <div class="grid-container" id="tasksArea"></div>

<script>
    const socket = io();
    let currentTab = 'ai-grids';
    let dataStore = { pending: {}, trained: {} };
    let isAIReady = false, aiModel, knn;
    let autoTrainEnabled = false, autoSaveEnabled = false;
    let retrainState = {};

    // 1. AI Initialization (Original Flow)
    async function initAI() {
        aiModel = await mobilenet.load({ version: 2, alpha: 1.0 });
        knn = knnClassifier.create();
        isAIReady = true;
        document.getElementById('ai-status').innerText = '✅ AI Ready';
        // Yahan local storage / IndexedDB load karne ka function call karlena jo tumhare purane code mein tha
    }
    initAI();

    // 2. WebSockets for instant tasks
    socket.on('initialState', (data) => { dataStore = data; renderTasks(); });
    socket.on('taskCompleted', (task) => { delete dataStore.pending[task.id]; dataStore.trained[task.id] = task; renderTasks(); });
    
    socket.on('newTask', async (task) => {
        dataStore.pending[task.id] = task;
        renderTasks(); // Update UI if visible

        // 3. BACKGROUND AI PROCESSING
        // Tab koi bhi open ho, grid task aate hi AI background mein predict karega
        if (isAIReady && autoTrainEnabled && task.type === 'grid') {
            await predictWithAI(task);
        }
    });

    function setTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderTasks();
    }

    function renderTasks() {
        const area = document.getElementById('tasksArea');
        area.innerHTML = '';
        let list = [];
        
        if (currentTab === 'ai-grids') list = Object.values(dataStore.pending).filter(t => t.type === 'grid');
        else if (currentTab === 'workers') list = Object.values(dataStore.pending).filter(t => t.type !== 'grid');
        else list = Object.values(dataStore.trained).reverse().slice(0, 50);

        list.forEach(t => area.appendChild(buildCard(t)));
    }

    function buildCard(t) {
        let card = document.createElement('div'); card.className = `task-card ${t.clicks?.length > 0 && currentTab !== 'trained' ? 'ai-processing' : ''}`; card.dataset.id = t.id;
        let isPending = !!dataStore.pending[t.id];
        let pText = t.prompt.split('|||')[0];
        
        let mediaHtml = `<div class="${isPending ? 'img-grid' : 'trained-grid'}">`;
        (t.media || []).forEach(m => {
            let cl = '';
            if (t.clicks?.includes(m.index)) {
                if (currentTab === 'trained') cl = 'was-clicked';
                else cl = t.aiPredicted ? 'ai-pick' : 'selected';
            }
            mediaHtml += `<img src="${m.thumb || m.src}" class="g-img ${cl}" data-index="${m.index}">`;
        });
        mediaHtml += `</div>`;

        let actions = isPending ? 
            `<button class="btn btn-save" onclick="saveTask('${t.id}')">Save Task</button>` :
            `<button class="btn btn-retrain" onclick="startRetrain('${t.id}')">🔧 Retrain AI</button>`;

        card.innerHTML = `<div><b>#${t.id.substring(0,6)}</b> - ${pText}</div> ${mediaHtml} <div id="act-${t.id}">${actions}</div>`;
        return card;
    }

    // Task Interaction & Retrain Logic
    document.getElementById('tasksArea').addEventListener('click', (e) => {
        let card = e.target.closest('.task-card'); if (!card) return;
        let tid = card.dataset.id;
        let t = dataStore.pending[tid] || dataStore.trained[tid];
        if (!t) return;

        if (e.target.classList.contains('g-img')) {
            let idx = parseInt(e.target.dataset.index);
            if (e.target.classList.contains('selected') || e.target.classList.contains('ai-pick') || e.target.classList.contains('retrain-pick')) {
                e.target.classList.remove('selected', 'ai-pick', 'retrain-pick');
                t.clicks = (t.clicks || []).filter(i => i !== idx);
                if(retrainState[tid]) retrainState[tid].newClicks = retrainState[tid].newClicks.filter(i => i !== idx);
            } else {
                e.target.classList.add(currentTab === 'trained' ? 'retrain-pick' : 'selected');
                if(!t.clicks) t.clicks = []; t.clicks.push(idx);
                if(retrainState[tid]) retrainState[tid].newClicks.push(idx);
            }
        }
    });

    async function predictWithAI(task) {
        if (!isAIReady) return;
        let pText = task.prompt.split('|||')[0].trim().toLowerCase();
        let dataset = knn.getClassExampleCount();
        if (!dataset[pText]) return; // AI ko abhi ye class nahi pata

        let predicted = [];
        for (let m of task.media) {
            let img = new Image(); img.crossOrigin = "anonymous"; img.src = m.thumb || m.src;
            await new Promise(r => img.onload = r);
            let tfImg = tf.browser.fromPixels(img);
            let res = await knn.predictClass(aiModel.infer(tfImg, true));
            if (res.label === pText && res.confidences[pText] > 0.85) predicted.push(m.index);
            tfImg.dispose();
        }

        if (predicted.length > 0) {
            task.clicks = predicted;
            task.aiPredicted = true;
            renderTasks(); // DOM update agar visible hai
            if (autoSaveEnabled) saveTask(task.id);
        }
    }

    function saveTask(id) {
        let t = dataStore.pending[id];
        if(!t || !t.clicks || t.clicks.length === 0) return;
        
        // Tumhara purana trainAIBrain(t) yahan call karna
        // trainAIBrain(t); 

        fetch('/api/submit-hcaptcha', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ taskId: id, clicks: t.clicks })
        });
    }

    function startRetrain(id) {
        let t = dataStore.trained[id];
        retrainState[id] = { oldClicks: [...(t.clicks||[])], newClicks: [...(t.clicks||[])] };
        document.getElementById(`act-${id}`).innerHTML = `<button class="btn btn-save" onclick="confirmRetrain('${id}')">✅ Confirm Retrain</button>`;
    }

    function confirmRetrain(id) {
        let state = retrainState[id];
        let t = dataStore.trained[id];
        t.clicks = state.newClicks;
        // Yahan tumhara trainAIBrain function wrongIndices ke sath call hoga
        // let wrong = state.oldClicks.filter(x => !state.newClicks.includes(x));
        // trainAIBrain(t, wrong);

        fetch('/api/submit-hcaptcha', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ taskId: id, clicks: t.clicks })
        });
        delete retrainState[id];
    }
</script>
</body>
</html>
