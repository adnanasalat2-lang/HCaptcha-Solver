<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>hCaptcha Master UI</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        
        #modeOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .mode-btn { padding: 20px 40px; font-size: 20px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .mode-btn:hover { transform: scale(1.05); }
        .btn-master { background: #ff00ff; color: #fff; }
        .btn-worker { background: #00ff88; color: #000; }
        
        .header { background: #1e1e1e; padding: 15px 20px; border-bottom: 3px solid #00ff88; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { margin: 0; font-size: 20px; color: #00ff88; }
        .ai-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .sync-status { font-size: 13px; color: #ffaa00; font-weight: bold; }
        .sync-status.active { color: #00ff88; }
        .btn-toggle { padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; border: 2px solid #555; background: #333; color: #888; }
        .btn-toggle.on { background: #00ff88; color: #000; border-color: #00ff88; }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { background: #333; color: #ccc; border: 2px solid #444; padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .tab-btn.active { background: #00ff88; color: #000; border-color: #00ff88; }
        .count { background: #000; color: #fff; padding: 2px 8px; border-radius: 10px; margin-left: 8px; font-size: 14px; }
        
        .grid-container { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-start; }
        .task-card { background: #1e1e1e; min-width: 480px; flex: 1; max-width: 650px; padding: 15px; border: 1px solid #333; border-radius: 6px; }
        .task-card.ai-processing { border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.4); }
        .task-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .task-id { color: #ff4444; font-family: monospace; font-size: 16px; font-weight: bold; }
        
        .prompt-container { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; background: #222; padding: 8px; border-radius: 6px; border: 1px solid #333; }
        .example-img { width: 55px; height: 55px; object-fit: cover; border-radius: 4px; background: #222; display: block; }
        .task-prompt { color: #fff; font-size: 14px; font-weight: bold; flex: 1; }
        
        .img-grid, .trained-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .img-grid img, .trained-grid img { width: 100%; height: 140px; object-fit: cover; cursor: pointer; border: 4px solid transparent; background: #222; transition: opacity 0.3s; }
        .img-grid img.selected { border-color: #00ff88; opacity: 0.7; }
        .img-grid img.ai-pick { border-color: #ff00ff; }
        .trained-grid img { height: 100px; border: 3px solid #333; }
        .trained-grid img.was-clicked { border-color: #00ff88; opacity: 0.8; }
        .trained-grid img.retrain-pick { border-color: #ff8800; }
        
        .single-box { position: relative; width: 100%; cursor: crosshair; display: flex; justify-content: center; background: #000; border-radius: 4px; border: 2px solid #444; overflow: hidden; }
        .single-box img { width: 100%; height: auto; min-height: 450px; max-height: 600px; object-fit: contain; }
        .dot { position: absolute; width: 18px; height: 18px; background: #00ff88; border: 2px solid #000; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .missing-media { background: #111; color: #888; padding: 20px 10px; text-align: center; border-radius: 4px; border: 1px dashed #444; font-size: 13px; }
        
        .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 12px; border: none; font-weight: bold; cursor: pointer; color: #fff; font-size: 14px; border-radius: 4px; }
        .btn-save { background: #00ff88; color: #000; }
        .btn-reset { background: #555; }
        .btn-del { background: #ff4444; flex: 0.3; }
        .btn-retrain, .btn-confirm { background: #ff8800; color: #000; }
        .btn-cancel { background: #555; }
    </style>
</head>
<body>

<div id="modeOverlay">
    <h2 style="color:#00ff88;">Welcome to hCaptcha Master</h2>
    <p>Please select your dashboard role:</p>
    <button class="mode-btn btn-master" onclick="startApp('master')">👑 Start as MASTER AI NODE (Only 1 Tab)</button>
    <button class="mode-btn btn-worker" onclick="startApp('worker')">👨‍💻 Start as WORKER (For 5-10 Workers)</button>
</div>

<div class="header" style="display:none;" id="mainHeader">
    <div class="header-top">
        <h1 id="appTitle">Dashboard 👨‍💻</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="setTab('ai-grids')">AI Grids <span class="count" id="c-grids">0</span></button>
            <button class="tab-btn" onclick="setTab('workers')">Worker Tasks <span class="count" id="c-workers">0</span></button>
            <button class="tab-btn" onclick="setTab('trained')">Trained <span class="count" id="c-trained">0</span></button>
        </div>
    </div>
    <div class="ai-bar">
        <span class="sync-status" id="syncStatus">🔄 Connecting to Server...</span>
        <button id="btnAutoTrain" class="btn-toggle" style="display:none;" onclick="toggleAutoTrain()">🧠 Auto Train: OFF</button>
        <button id="btnAutoSave" class="btn-toggle" style="display:none;" onclick="toggleAutoSave()">💾 Auto Save: OFF</button>
    </div>
</div>
<div class="grid-container" id="tasksArea"></div>

<script>
const socket = io();
let currentTab = 'ai-grids';
let serverData = { pending: {}, trained: {} };
let isMaster = false;
let autoTrainEnabled = false;
let autoSaveEnabled = false;
let retrainState = {};
let videoTasks = [];

let aiModel, knn;
let isAIReady = false;

// -----------------------------------------
// BOOT & MODE LOGIC
// -----------------------------------------
function startApp(mode) {
    document.getElementById('modeOverlay').style.display = 'none';
    document.getElementById('mainHeader').style.display = 'flex';
    
    if (mode === 'master') {
        isMaster = true;
        document.getElementById('appTitle').innerHTML = 'Master AI Node 👑';
        document.getElementById('btnAutoTrain').style.display = 'inline-block';
        document.getElementById('btnAutoSave').style.display = 'inline-block';
        loadAILibraries();
    } else {
        document.getElementById('appTitle').innerHTML = 'Worker Node 👨‍💻';
        document.getElementById('syncStatus').innerHTML = "🟢 Connected (Worker Mode)";
    }
}

// -----------------------------------------
// SEQUENTIAL SCRIPT LOADER
// -----------------------------------------
function loadScript(src) {
    return new Promise((resolve, reject) => {
        let s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
    });
}

async function loadAILibraries() {
    document.getElementById('syncStatus').innerHTML = "🧠 Downloading AI Files (Step 1/3)...";
    try {
        await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
        document.getElementById('syncStatus').innerHTML = "🧠 Downloading AI Files (Step 2/3)...";
        await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
        document.getElementById('syncStatus').innerHTML = "🧠 Downloading AI Files (Step 3/3)...";
        await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js');
        initAI();
    } catch (e) {
        document.getElementById('syncStatus').innerHTML = "⚠️ Network Error loading AI";
    }
}

async function initAI() {
    try {
        await tf.ready();
        aiModel = await mobilenet.load({ version: 2, alpha: 1.0 });
        knn = knnClassifier.create();
        await loadKNN(); 
        isAIReady = true;
        document.getElementById('syncStatus').innerHTML = "🤖 Master AI Active ✅";
        document.getElementById('syncStatus').classList.add('active');
    } catch(e) { 
        document.getElementById('syncStatus').innerHTML = "⚠️ AI Load Failed: " + e.message; 
    }
}

const IDB = { name:'hcm_knn', store:'knn', key:'model_v3' };
function idbOpen() { return new Promise((res,rej)=>{ let r=indexedDB.open(IDB.name,1); r.onupgradeneeded=e=>e.target.result.createObjectStore(IDB.store); r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(val) { let db=await idbOpen(); return new Promise((res,rej)=>{ let tx=db.transaction(IDB.store,'readwrite'); tx.objectStore(IDB.store).put(val, IDB.key); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function idbGet() { let db=await idbOpen(); return new Promise((res,rej)=>{ let tx=db.transaction(IDB.store,'readonly'); let req=tx.objectStore(IDB.store).get(IDB.key); req.onsuccess=()=>res(req.result||null); req.onerror=()=>rej(req.error); }); }

async function saveKNN() {
    if (!knn) return;
    let ds = knn.getClassifierDataset(), ser = {};
    for (let k in ds) ser[k] = { data: Array.from(ds[k].dataSync()), shape: ds[k].shape };
    await idbSet(ser);
}

async function loadKNN() {
    let ser = await idbGet();
    if (ser) {
        let ds = {};
        for (let k in ser) ds[k] = tf.tensor(ser[k].data, ser[k].shape);
        knn.setClassifierDataset(ds);
    }
}

// Predictor
async function predictWithAI(task) {
    if (!isAIReady || !autoTrainEnabled || task.type !== 'grid' || !task.media) return;
    let pText = (task.prompt || "").split('|||')[0].trim().toLowerCase();
    let dataset = knn.getClassExampleCount();
    if (!dataset[pText]) return;

    let predictedClicks = [];
    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = new Image(); img.crossOrigin = "anonymous"; img.src = imgSrc;
            await new Promise((res) => { img.onload = res; img.onerror = res; setTimeout(res, 3000); });
            if (!img.complete || img.naturalWidth === 0) continue;
            let tfImg = tf.browser.fromPixels(img);
            let res = await knn.predictClass(aiModel.infer(tfImg, true));
            if (res.label === pText && res.confidences[pText] > 0.85) predictedClicks.push(m.index);
            tfImg.dispose();
        } catch(e) {}
    }

    if (predictedClicks.length >= 2 && predictedClicks.length <= 6) {
        socket.emit('aiPredictionResult', { taskId: task.id, clicks: predictedClicks });
        if (autoSaveEnabled) {
            setTimeout(() => {
                fetch('/api/submit-hcaptcha', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ taskId: task.id, clicks: predictedClicks, wrongIndices: [] }) });
            }, 800);
        }
    }
}

// Trainer
async function trainAIBrain(task, wrongIndices = []) {
    if (!isAIReady || task.type !== 'grid' || !task.media) return;
    let pText = (task.prompt || "").split('|||')[0].trim().toLowerCase();
    let negLabel = 'negative_' + pText;
    let learned = false;

    for (let m of task.media) {
        let imgSrc = m.thumb || m.src;
        if (!imgSrc) continue;
        try {
            let img = new Image(); img.crossOrigin = "anonymous"; img.src = imgSrc;
            await new Promise((res) => { img.onload = res; img.onerror = res; setTimeout(res, 3000); });
            if (!img.complete || img.naturalWidth === 0) continue;
            let tfImg = tf.browser.fromPixels(img);
            let features = aiModel.infer(tfImg, true);
            let isCorrect = (task.clicks||[]).includes(m.index);
            let isWrong = wrongIndices.includes(m.index);

            if (isCorrect) { knn.addExample(features, pText); knn.addExample(features, pText); } 
            else if (isWrong) { knn.addExample(features, negLabel); knn.addExample(features, negLabel); knn.addExample(features, negLabel); } 
            else { knn.addExample(features, negLabel); }
            tfImg.dispose();
            learned = true;
        } catch(e) {}
    }
    if (learned) saveKNN();
}

// -----------------------------------------
// UI & SOCKET LOGIC 
// -----------------------------------------
socket.on('initialState', (data) => { serverData = data; renderTasks(); });
socket.on('newTask', async (task) => { serverData.pending[task.id] = task; renderTasks(); if (isMaster && autoTrainEnabled) await predictWithAI(task); });
socket.on('updateTask', (task) => { serverData.pending[task.id] = task; renderTasks(); });
socket.on('taskCompleted', async (data) => { delete serverData.pending[data.task.id]; serverData.trained[data.task.id] = data.task; renderTasks(); if (isMaster && isAIReady) await trainAIBrain(data.task, data.wrongIndices); });
socket.on('taskDeleted', (taskId) => { delete serverData.pending[taskId]; delete serverData.trained[taskId]; renderTasks(); });

function toggleAutoTrain() { autoTrainEnabled = !autoTrainEnabled; let btn = document.getElementById('btnAutoTrain'); btn.className = 'btn-toggle' + (autoTrainEnabled ? ' on' : ''); btn.textContent = '🧠 Auto Train: ' + (autoTrainEnabled ? 'ON' : 'OFF'); }
function toggleAutoSave() { autoSaveEnabled = !autoSaveEnabled; let btn = document.getElementById('btnAutoSave'); btn.className = 'btn-toggle' + (autoSaveEnabled ? ' on' : ''); btn.textContent = '💾 Auto Save: ' + (autoSaveEnabled ? 'ON' : 'OFF'); }

function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderTasks();
}

function renderTasks() {
    let grids = 0, workers = 0;
    Object.values(serverData.pending).forEach(t => t.type === 'grid' ? grids++ : workers++);
    document.getElementById('c-grids').innerText = grids;
    document.getElementById('c-workers').innerText = workers;
    document.getElementById('c-trained').innerText = Object.keys(serverData.trained).length;

    const tasksArea = document.getElementById('tasksArea');
    tasksArea.innerHTML = '';
    videoTasks = [];

    let list = [];
    if (currentTab === 'ai-grids') list = Object.values(serverData.pending).filter(t => t.type === 'grid');
    else if (currentTab === 'workers') list = Object.values(serverData.pending).filter(t => t.type !== 'grid');
    else list = Object.values(serverData.trained).reverse().slice(0, 50);

    list.forEach(t => { try { tasksArea.appendChild(buildCard(t)); } catch(e) {} });
}

function buildCard(t) {
    let card = document.createElement('div'); 
    let showAI = t.aiPredicted && currentTab !== 'trained';
    card.className = `task-card ${showAI ? 'ai-processing' : ''}`; 
    card.dataset.id = t.id;
    
    let taskIdStr = t.id || "000000";
    let promptStr = t.prompt || "";
    let isPending = !!serverData.pending[t.id];
    let parts = promptStr.split('|||');
    let exHtml = parts[1] ? `<img src="${parts[1]}" class="example-img">` : `🖼️`;
    let isMediaMissing = !t.media || t.media.length === 0 || t.media.every(m => !m.thumb && !m.src && !m.frames);
    let mediaHTML = '';

    if (isMediaMissing) {
        mediaHTML = `<div class="missing-media">⚠️ <b>Images missing</b></div>`;
    } else if (t.type === 'grid') {
        mediaHTML = `<div class="${isPending ? 'img-grid' : 'trained-grid'}">`;
        t.media.forEach(m => {
            let cl = '';
            if ((t.clicks||[]).includes(m.index)) {
                cl = isPending ? (showAI ? 'ai-pick' : 'selected') : 'was-clicked';
            }
            mediaHTML += `<img src="${m.thumb || m.src || ''}" class="g-img ${cl}" data-index="${m.index}">`;
        });
        mediaHTML += '</div>';
    } else {
        let m = t.media[0] || {};
        let isVid = m.type === 'video_frames' && m.frames && m.frames.length > 0;
        let src = isVid ? m.frames[0] : (m.src || '');
        mediaHTML = `<div class="single-box"><img src="${src}" class="s-img ${isVid?'vid-player':''}" data-id="${t.id}">`;
        (t.clicks||[]).forEach(pt => { mediaHTML += `<div class="dot" style="left:${pt.px}%;top:${pt.py}%;"></div>`; });
        mediaHTML += '</div>';
        if (isVid) videoTasks.push({ id: t.id, frames: m.frames, current: 0 });
    }

    let actionsHtml = isPending ? 
        `<button class="btn btn-save" onclick="submitTask('${t.id}', false)">Save Task</button> <button class="btn btn-reset">Clear</button> <button class="btn btn-del" onclick="deleteTask('${t.id}')">❌</button>` : 
        `<button class="btn btn-retrain" onclick="startRetrain('${t.id}')">🔧 Retrain AI</button> <button class="btn btn-del" onclick="deleteTask('${t.id}')">❌</button>`;

    card.innerHTML = `
        <div class="task-head"><span class="task-id">#${taskIdStr.substring(0,6)}</span></div>
        <div class="prompt-container"><div class="example-wrap">${exHtml}</div><div class="task-prompt">${parts[0]}</div></div>
        ${mediaHTML}
        <div class="actions" id="act-${t.id}">${actionsHtml}</div>`;
    return card;
}

// -----------------------------------------
// FIXED CLICK LOGIC (RETRAIN WAS-CLICKED FIX)
// -----------------------------------------
document.getElementById('tasksArea').addEventListener('click', (e) => {
    let card = e.target.closest('.task-card'); if (!card) return;
    let tid = card.dataset.id;
    let t = serverData.pending[tid] || serverData.trained[tid];
    if (!t) return;
    if (!t.clicks) t.clicks = [];
    
    // Retrain safety
    if (retrainState[tid] && !e.target.classList.contains('btn-confirm') && !e.target.classList.contains('btn-cancel') && !e.target.classList.contains('btn-reset') && !e.target.classList.contains('g-img') && !e.target.classList.contains('s-img')) return;

    if (e.target.classList.contains('g-img')) {
        let idx = parseInt(e.target.dataset.index);
        t.aiPredicted = false; 
        card.classList.remove('ai-processing');
        
        // 🔴 FIX: was-clicked ko hatane ke liye is condition mein was-clicked shamil kar liya gaya
        if (e.target.classList.contains('selected') || e.target.classList.contains('ai-pick') || e.target.classList.contains('retrain-pick') || e.target.classList.contains('was-clicked')) {
            e.target.classList.remove('selected', 'ai-pick', 'retrain-pick', 'was-clicked'); 
            t.clicks = t.clicks.filter(i => i !== idx);
            if(retrainState[tid]) retrainState[tid].newClicks = retrainState[tid].newClicks.filter(i => i !== idx);
        } else { 
            e.target.classList.add(currentTab === 'trained' ? 'retrain-pick' : 'selected'); 
            t.clicks.push(idx); 
            if(retrainState[tid]) retrainState[tid].newClicks.push(idx);
        }
    } 
    else if (e.target.classList.contains('s-img')) {
        if (currentTab === 'trained' && !retrainState[tid]) return;

        let rect = e.target.getBoundingClientRect();
        let x = ((e.clientX - rect.left) / rect.width) * 100;
        let y = ((e.clientY - rect.top) / rect.height) * 100;
        
        if (retrainState[tid]) {
            retrainState[tid].newClicks.push({ px: x, py: y });
        } else {
            t.clicks.push({ px: x, py: y });
        }
        
        let dot = document.createElement('div'); 
        dot.className = 'dot'; 
        dot.style.left = `${x}%`; 
        dot.style.top = `${y}%`;
        e.target.parentElement.appendChild(dot);
    } 
    else if (e.target.classList.contains('btn-reset')) {
        if (retrainState[tid]) {
            retrainState[tid].newClicks = [];
        } else {
            t.clicks = []; t.aiPredicted = false; 
        }
        card.querySelectorAll('.g-img').forEach(img => img.classList.remove('selected','ai-pick','retrain-pick','was-clicked'));
        card.querySelectorAll('.dot').forEach(d => d.remove()); 
        card.classList.remove('ai-processing');
    }
});

function submitTask(taskId, isRetrain = false) {
    let t = serverData.pending[taskId] || serverData.trained[taskId];
    if (!t || !t.clicks || t.clicks.length === 0) return;
    
    let payload = { taskId, clicks: t.clicks, wrongIndices: [] };
    if (isRetrain && retrainState[taskId]) {
        payload.clicks = retrainState[taskId].newClicks;
        payload.wrongIndices = retrainState[taskId].oldClicks.filter(idx => !retrainState[taskId].newClicks.includes(idx));
    }

    fetch('/api/submit-hcaptcha', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (isRetrain) delete retrainState[taskId];
}

function deleteTask(taskId) { fetch(`/api/delete-hcaptcha/${taskId}`, { method:'DELETE' }); }

function startRetrain(taskId) {
    let t = serverData.trained[taskId];
    if (!t) return;
    retrainState[taskId] = { oldClicks: [...(t.clicks || [])], newClicks: [...(t.clicks || [])] };
    document.getElementById(`act-${taskId}`).innerHTML = `
        <button class="btn btn-confirm" onclick="submitTask('${taskId}', true)">✅ Confirm</button>
        <button class="btn btn-reset">Clear</button>
        <button class="btn btn-cancel" onclick="cancelRetrain('${taskId}')">❌ Cancel</button>`;
}
function cancelRetrain(taskId) { delete retrainState[taskId]; renderTasks(); }

setInterval(() => {
    videoTasks.forEach(vt => {
        let el = document.querySelector(`.vid-player[data-id="${vt.id}"]`);
        if (el && vt.frames?.length > 0) { vt.current=(vt.current+1)%vt.frames.length; el.src=vt.frames[vt.current]; }
    });
}, 200);
</script>
</body>
</html>
